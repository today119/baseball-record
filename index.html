<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>야구 수행평가 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚾</text></svg>">
<style>
:root{
  --bg:#0d1418; --panel:#152026; --panel2:#1b2930; --line:#26363e; --line2:#324650;
  --tx:#e8f0f2; --tx2:#9fb3bb; --tx3:#6b828c;
  --grass:#1f7a4d; --dirt:#c08a4a;
  --hit:#2fa96b; --out:#d2544a; --warn:#e0a33c; --info:#3d8fd1;
  --home:#3d8fd1; --away:#d2544a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--panel2);
  border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
.app{display:flex;height:100%}

/* ── 사이드바 ───────────────────────────── */
.side{width:190px;flex:0 0 190px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 10px;gap:4px}
.brand{font-size:15px;font-weight:800;padding:6px 10px 12px;letter-spacing:-.3px}
.brand small{display:block;font-size:11px;color:var(--tx3);font-weight:500;margin-top:2px}
.nav{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;
  color:var(--tx2);font-size:14px;font-weight:600;width:100%;text-align:left}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--line);color:var(--tx)}
.nav i{font-style:normal;font-size:16px;width:20px;text-align:center}
.side .foot{margin-top:auto;font-size:11px;color:var(--tx3);padding:8px 10px;line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--tx3);margin-right:5px}
.dot.ok{background:var(--hit)} .dot.off{background:var(--warn)}

/* ── 본문 ─────────────────────────────── */
.main{flex:1;min-width:0;overflow-y:auto;padding:18px 22px 60px}
.vw{display:none} .vw.on{display:block}
h2.t{font-size:19px;font-weight:800;margin:0 0 3px;letter-spacing:-.3px}
p.st{font-size:12.5px;color:var(--tx3);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:13px}
.card h3{font-size:13px;font-weight:700;margin:0 0 11px;color:var(--tx2);letter-spacing:.02em}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{background:var(--line);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;
  font-size:13.5px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--info);border-color:var(--info);color:#fff}
.btn.ok{background:var(--hit);border-color:var(--hit);color:#fff}
.btn.dn{background:var(--out);border-color:var(--out);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;gap:9px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.cbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:15px 8px;
  text-align:center;font-weight:800;font-size:15px}
.cbtn:hover{border-color:var(--info)}
.cbtn.on{background:var(--info);border-color:var(--info);color:#fff}
.cbtn small{display:block;font-size:11px;font-weight:500;color:var(--tx3);margin-top:3px}
.cbtn.on small{color:rgba(255,255,255,.8)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;color:var(--tx3);font-weight:700;letter-spacing:.03em}
td.n,th.n{text-align:right}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:var(--line);color:var(--tx2)}
.tag.m{background:#1d3d55;color:#8ec5f0} .tag.f{background:#4a2340;color:#f0a8d8}
.tag.dup{background:#4a3a1a;color:var(--warn)}
.msg{font-size:12.5px;color:var(--tx3);padding:22px;text-align:center}
/* 자동 계산된 점수 칸 — 입력칸과 구분되게 */
td.sc{font-weight:900;font-variant-numeric:tabular-nums;color:#8fd0aa;font-size:14px}
td.sc.tot{color:var(--warn);font-size:15px}

/* ── 부문별 순위 (기록실) ──
   평가 점수와는 무관한 「재미·동기부여」용 기록판. 이름 칸을 넓게 쓴다. */
.lbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.lb{background:#12181c;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.lb h4{margin:0 0 8px;font-size:12px;font-weight:900;color:#8fd0aa;letter-spacing:.03em;
  display:flex;align-items:center;justify-content:space-between}
.lb h4 em{font-style:normal;font-size:10.5px;color:var(--tx3);font-weight:700}
.lb.rate h4{color:#e0a33c}
.lb.def h4{color:#7fb4e0}
.lb ol{margin:0;padding:0;list-style:none}
.lb li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;
  border-top:1px solid #1b2429}
.lb li:first-child{border-top:0}
.lb .rk{flex:0 0 auto;width:17px;height:17px;border-radius:5px;background:#1e282e;color:#93aab8;
  font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lb li.top .rk{background:var(--warn);color:#241a05}
.lb .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:700;color:var(--tx)}
.lb li.top .nm{font-weight:900;color:#fff}
.lb .vl{flex:0 0 auto;font-weight:900;font-variant-numeric:tabular-nums;color:#cfdde5}
.lb li.top .vl{color:var(--warn)}
.lb .none{font-size:11.5px;color:var(--tx3);padding:6px 0}
.lbnote{font-size:11.5px;color:var(--tx3);margin:10px 0 0;line-height:1.5}
.sw{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.sw button{padding:8px 15px;font-size:13px;font-weight:700;color:var(--tx3)}
.sw button.on{background:var(--info);color:#fff}

/* ── 전광판 ─────────────────────────────────────────────────
   야구장 전광판 배치. 세 칸으로 나눈다.
     좌·우 = 두 팀. 공격 중이면 타순표, 수비 중이면 수비 배치도.
     가운데 = 이닝별 점수 · 큰 주루 다이아몬드 · 공격 버튼.

   ★ 크기는 전부 --u 의 배수로만 쓴다.
     --u 는 화면 폭에 비례하므로 태블릿이든 4K 든 비율이 그대로 유지된다.
     px 을 직접 박으면 큰 화면에서 글자만 작아져 따로 논다. */
.board{
  --u:clamp(11px, .78vw, 18px);          /* 기준 글자 단위 */
  --w:calc(var(--u) * 33);               /* 좌·우 칸 안쪽 최대 폭 */
  --gp:calc(var(--u) * .6);              /* 기본 간격 */
  background:#070d10;border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;height:calc(100vh - 118px);min-height:560px}
/* 가운데도 화면 폭에 비례해 함께 커진다 (고정 px 이면 큰 화면에서 좌우만 넓어진다) */
.brow{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,32%,660px) minmax(0,1fr);
  flex:1;min-height:0}

/* ── 좌·우 팀 칸 ───────────────────────── */
.pan{display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;
  padding:calc(var(--u) * .75);gap:var(--gp)}
.pan > *{width:100%;max-width:var(--w)}
.pan-l{border-right:1px solid var(--line2);background:#0a1117}
.pan-r{border-left:1px solid var(--line2);background:#0a1117}
.pan.hide{display:none}
.ph{display:flex;align-items:center;gap:calc(var(--u) * .5);flex-wrap:wrap;flex:0 0 auto}
.pt{padding:calc(var(--u) * .42) calc(var(--u) * .85);border-radius:calc(var(--u) * .45);
  font-size:calc(var(--u) * 1.55);font-weight:900;color:#fff;letter-spacing:-.3px;white-space:nowrap}
.pt.h{background:linear-gradient(180deg,#3f7fd0,#2b5fa8)}
.pt.a{background:linear-gradient(180deg,#d2564a,#a83d33)}
.pmode{font-size:calc(var(--u) * .82);font-weight:900;letter-spacing:.1em;
  padding:calc(var(--u) * .22) calc(var(--u) * .55);border-radius:99px}
.pmode.on{background:var(--warn);color:#241a05}
.pmode.off{background:#16242c;color:#7d95a3}
.phint{margin-left:auto;font-size:calc(var(--u) * .88);font-weight:800;color:var(--warn)}

/* 타순표 — 높이를 다 쓰고, 인원이 많으면 신문처럼 옆 단으로 흘린다 */
.lineup{flex:1;min-height:0;column-count:1;column-gap:calc(var(--u) * .8);
  column-fill:auto;overflow:auto}
.lineup{--plpad:0px}
.pl{display:flex;align-items:center;gap:calc(var(--u) * .45);
  padding:calc(var(--u) * .3 + var(--plpad)) calc(var(--u) * .5);border-radius:calc(var(--u) * .35);
  margin-bottom:calc(var(--u) * .18);font-size:calc(var(--u) * 1.15);break-inside:avoid}
.pl .o{font-size:calc(var(--u) * .82);color:var(--tx3);
  width:calc(var(--u) * 1.25);flex:0 0 calc(var(--u) * 1.25);text-align:right}
.pl .ps{font-size:calc(var(--u) * .72);font-weight:900;color:#8fd0aa;background:#123a23;
  border-radius:calc(var(--u) * .25);padding:calc(var(--u) * .16) 0;
  width:calc(var(--u) * 2);flex:0 0 calc(var(--u) * 2);text-align:center;letter-spacing:-.02em}
.pl .ps.na{color:#5c7080;background:#141f26}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .rs{font-size:calc(var(--u) * .88);color:var(--tx3);font-variant-numeric:tabular-nums}
.pl.now{background:var(--warn);color:#241a05;font-weight:900}
.pl.now .o,.pl.now .rs{color:#5a4310}
.pl.now .ps{background:#5a4310;color:#ffd479}
.pl.done{opacity:.38}
.pl.onbase{box-shadow:inset calc(var(--u) * .2) 0 0 var(--warn)}
/* 두 단 이상으로 접히면 한 칸이 좁아지므로 한 단계 줄인다 */
.lineup.narrow .pl{font-size:calc(var(--u) * .96);gap:calc(var(--u) * .35)}
.lineup.narrow .pl .ps{width:calc(var(--u) * 1.7);flex:0 0 calc(var(--u) * 1.7);
  font-size:calc(var(--u) * .64)}

/* 수비 배치도 */
/* ★ 세로가 모자라도 구장이 눌리지 않게 높이 기준으로 폭을 잡는다(주루 다이아몬드와 같은 이유). */
.field{position:relative;aspect-ratio:100/78;flex:0 1 auto;min-height:0;
  height:min(100%, calc(var(--u) * 26));width:auto;max-width:100%;margin:auto;
  background:#0d1f16;border-radius:calc(var(--u) * .6);overflow:hidden}
.fbg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 라벨 = 중계 그래픽처럼 「포지션 배지 + 이름 박스」.
   배지 색으로 내야(주황) / 외야(파랑) 가 한눈에 구분된다. */
.po{position:absolute;transform:translate(-50%,-50%);overflow:hidden;
  min-width:calc(var(--u) * 4.6);border-radius:calc(var(--u) * .4);
  text-align:center;cursor:pointer;transition:all .12s;
  box-shadow:0 calc(var(--u)*.14) calc(var(--u)*.5) rgba(0,0,0,.55)}
.po .pp{display:block;font-size:calc(var(--u) * .68);font-weight:900;color:#fff;
  background:#e2711d;padding:calc(var(--u) * .12) calc(var(--u) * .3);letter-spacing:.02em}
.po.of .pp{background:#1d7fc0}
.po .pn{display:block;font-size:calc(var(--u) * .98);font-weight:900;color:#132019;
  background:#eef3f6;padding:calc(var(--u) * .16) calc(var(--u) * .3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--u) * 6.5)}
.po.pick{outline:calc(var(--u) * .16) solid var(--warn);outline-offset:0}
.po.pick .pp{background:#b8860f} .po.pick .pn{background:var(--warn);color:#241a05}
.po.swap{outline:calc(var(--u) * .14) dashed var(--info)}
.bench{font-size:calc(var(--u) * .85);color:var(--tx3);text-align:center;flex:0 0 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{display:flex;gap:calc(var(--u) * .45);flex:0 0 auto}
.dbtn button{flex:1;padding:calc(var(--u) * .62) 0;border-radius:calc(var(--u) * .45);
  font-size:calc(var(--u) * 1.02);font-weight:800;background:var(--line);border:1px solid var(--line2)}
.dbtn button.on{background:var(--info);border-color:var(--info);color:#fff}
.dbtn button.ok{background:var(--hit);border-color:var(--hit);color:#fff}

/* ── 가운데 ─────────────────────────────
   남는 세로 공간을 블록 사이에 자동으로 나눠 갖는다(space-between).
   그래서 큰 화면에서는 간격이 넉넉해지고 작은 화면에서는 알아서 붙는다. */
.ctr{display:flex;flex-direction:column;justify-content:space-between;
  min-height:0;min-width:0;padding:calc(var(--u) * .75);gap:var(--gp);
  background:#050a0d;overflow:hidden}

/* 이닝별 점수표 */
.isc{width:100%;border-collapse:collapse;background:#000;
  border-radius:calc(var(--u) * .6);overflow:hidden;table-layout:fixed;flex:0 0 auto}
/* 글자 크기는 딱 3단계만 쓴다 — 헤더(--fh) / 본문 숫자(--fv) / 합계 R·H(--fr).
   칸마다 크기가 제각각이면 전광판이 지저분해 보인다. */
.isc{--fh:calc(var(--u) * 1.05);--fv:calc(var(--u) * 1.7);--fr:calc(var(--u) * 2.15)}
.isc th{text-align:center;font-size:var(--fh);font-weight:900;color:#93aab8;background:#0e1a21;
  padding:calc(var(--u) * .34) 0;vertical-align:middle;letter-spacing:.02em}
.isc th.rh{color:#ff7b6e} .isc th.hh{color:#e0a33c}
.isc th.cur{background:#1d3540;color:var(--warn)}
.isc th.inh{width:calc(var(--u) * 5.6);color:#5c7080;letter-spacing:.14em}
.isc th.adjh{width:calc(var(--u) * 2.4)}
.isc td{text-align:center;font-weight:900;padding:calc(var(--u) * .38) 0;color:#cfdde5;
  font-size:var(--fv);font-variant-numeric:tabular-nums;border-top:1px solid #16242c;line-height:1.1}
.isc td.tm{font-size:var(--fv);color:#fff;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:calc(var(--u) * .38) calc(var(--u) * .4)}
.isc tr.h td.tm{background:linear-gradient(180deg,#3f7fd0,#2b5fa8)}
.isc tr.a td.tm{background:linear-gradient(180deg,#d2564a,#a83d33)}
.isc td.rr{font-size:var(--fr);color:#fff;background:#2a0d0c;line-height:1}
.isc td.hh{font-size:var(--fr);color:#e0a33c;line-height:1}
.isc td.z{color:#3d525c}
.isc .adj{display:flex;flex-direction:column;gap:calc(var(--u) * .12);align-items:center}
.isc .adj button{width:calc(var(--u) * 1.7);height:calc(var(--u) * 1.05);
  border-radius:calc(var(--u) * .25);background:#16242c;border:1px solid #2b3d45;
  font-size:calc(var(--u) * .6);font-weight:900;color:#8aa2b0;line-height:1}

/* 주루 — 가운데의 주인공. 남는 높이를 전부 먹고 폭도 꽉 쓴다 */
.brun{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:calc(var(--u) * .7)}
/* ★ 정사각형 칸으로 잡아야 마름모가 안 찌그러진다.
   예전엔 aspect-ratio 1/.82 + max-height 라서, 세로가 모자라면 칸이 눌리고
   그 안의 % 좌표가 같이 눌려 루와 마름모 꼭짓점이 어긋났다.
   이제 높이를 기준으로 폭을 잡아(width:auto) 항상 정사각형을 유지한다. */
.dia{position:relative;flex:0 1 auto;min-height:0;aspect-ratio:1;
  height:min(100%, calc(var(--u) * 22));width:auto;max-width:100%;margin:0 auto}
/* 내야 — 네 루의 중심을 그대로 이은 마름모 (꼭짓점 = 루 중심과 정확히 같은 좌표).
   바깥은 흙(주루로), 안쪽은 잔디 — 통짜 색 한 덩어리보다 구장처럼 보인다. */
.dia::before,.dia::after{content:'';position:absolute;inset:0}
.dia::before{background:linear-gradient(165deg,#b57e51,#8a5c39);
  clip-path:polygon(50% 16%, 88% 52%, 50% 88%, 12% 52%)}
.dia::after{background:linear-gradient(165deg,#2f7d47,#1e5a32);
  clip-path:polygon(50% 35%, 68% 52%, 50% 69%, 32% 52%)}
/* 루 — % 로 잡아 다이아몬드가 커지면 같이 커진다 (칸이 정사각형이라 가로=세로) */
.bs{position:absolute;width:14%;aspect-ratio:1;background:#f2f6f8;border:2px solid #6b4a30;
  transform:rotate(45deg);border-radius:14%;cursor:pointer;transition:background .12s;z-index:2}
.bs.on{background:var(--warn);border-color:#ffd479;box-shadow:0 0 calc(var(--u)*1.1) rgba(224,163,60,.75)}
.bs.b2{left:43%;top:9%}      /* 중심 (50,16) */
.bs.b1{left:81%;top:45%}     /* 중심 (88,52) */
.bs.b3{left:5%;top:45%}      /* 중심 (12,52) */
.hp{position:absolute;left:44%;top:82%;width:12%;aspect-ratio:1;background:#f2f6f8;
  border:2px solid #6b4a30;transform:rotate(45deg);border-radius:14%;z-index:2}
.rn{position:absolute;font-size:calc(var(--u) * 1.02);font-weight:800;color:#fff3d6;
  white-space:nowrap;pointer-events:none;text-shadow:0 1px 5px #000,0 0 2px #000;z-index:3}
.rn.r2{left:50%;top:0;transform:translateX(-50%)}
.rn.r1{right:0;top:63%} .rn.r3{left:0;top:63%}
/* B·S·O — 다이아몬드 아래 가로로 (사진의 전광판처럼) */
.sbo{display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:calc(var(--u) * 1.6);flex-wrap:wrap;flex:0 0 auto;margin-top:calc(var(--u) * .4)}
.sbo .g{display:flex;align-items:center;gap:calc(var(--u) * .35)}
.sbo .lb{font-size:calc(var(--u) * 1.02);font-weight:900;color:var(--tx3)}
.lamp{width:calc(var(--u) * 1.15);height:calc(var(--u) * 1.15);border-radius:99px;
  background:#1a262c;border:1px solid #2b3d45}
.lamp.s{background:var(--warn);border-color:var(--warn)}
.lamp.b{background:var(--hit);border-color:var(--hit)}
.lamp.o{background:var(--out);border-color:var(--out)}

<body>
<div class="app">

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   야구 수행평가 기록 앱 — 단일 파일
   저장:  로컬(localStorage)이 원본, Firebase 는 있으면 동기화
   내보내기: 구글 앱스스크립트 웹앱(JSONP/POST) 경유
   ═══════════════════════════════════════════════════════════ */

/* ───── 순수 로직 (node 로 테스트 완료) ───────────────── */
function buildOrder(players, targetCount){
  var base = players.map(function(p,i){
    return {sid:p.sid,name:p.name,gender:p.gender,num:p.num,dup:false,slot:i};
  });
  if(players.length===0 || targetCount<=base.length) return base;
  var need = targetCount - base.length;
  var M = players.filter(function(p){return p.gender==='남';});
  var F = players.filter(function(p){return p.gender==='여';});
  var needM = Math.round(need*(M.length/players.length)), needF = need-needM;
  if(M.length===0){needF=need;needM=0;}
  if(F.length===0){needM=need;needF=0;}
  function take(arr,k){
    if(k<=0||arr.length===0) return [];
    var s = arr.slice().sort(function(a,b){
      return (a.pa||0)-(b.pa||0) || String(a.num).localeCompare(String(b.num));});
    var out=[]; for(var i=0;i<k;i++) out.push(s[i%s.length]); return out;
  }
  take(M,needM).concat(take(F,needF)).forEach(function(p,i){
    base.push({sid:p.sid,name:p.name,gender:p.gender,num:p.num,dup:true,slot:base.length+i});
  });
  return base;
}
function nextState(st, orderLen){
  var s={inning:st.inning,half:st.half,idx:st.idx+1};
  if(s.idx<orderLen) return s;
  s.idx=0;
  if(s.half==='초') s.half='말'; else {s.half='초'; s.inning+=1;}
  return s;
}
function isGameOver(st,maxInning){ return st.inning>maxInning; }
function tally(atbats, defense, innings){
  var m={};
  function slot(sid){ if(!m[sid]) m[sid]={sid:sid,pa:0,ab:0,bb:0,h:0,h2:0,h3:0,hr:0,tb:0,
                                          r:0,rbi:0,dOut:0,inn:0,g:0}; return m[sid]; }
  (atbats||[]).forEach(function(a){
    var x=slot(a.sid);
    x.pa+=1;
    if(a.kind!==5) x.ab+=1;                 // 포볼은 타수에서 뺀다
    if(a.kind>=1 && a.kind<=4){             // 1·2·3루타·홈런만 안타
      x.h+=1;
      x.tb+=a.kind;                         // 루타 수 = kind 그대로 (1·2·3·4)
      if(a.kind===2) x.h2+=1;
      if(a.kind===3) x.h3+=1;
      if(a.kind===4) x.hr+=1;
    }
    if(a.kind===5) x.bb+=1;
    x.r+=(a.run||0); x.rbi+=(a.rbi||0);
  });
  (defense||[]).forEach(function(d){ slot(d.sid).dOut+=1; });
  Object.keys(innings||{}).forEach(function(sid){
    var x=slot(sid); x.inn=innings[sid].inn||0; x.g=innings[sid].g||0; });
  Object.keys(m).forEach(function(sid){
    var x=m[sid];
    x.avg  = x.ab ? x.h/x.ab : 0;                       // 타율
    x.slg  = x.ab ? x.tb/x.ab : 0;                      // 장타율 = 총루타 ÷ 타수
    x.obp  = (x.ab+x.bb) ? (x.h+x.bb)/(x.ab+x.bb) : 0;  // 출루율 (희생타 없음)
    x.ops  = x.obp + x.slg;
    x.xbh  = x.h2 + x.h3 + x.hr;                        // 장타 (2루타 이상)
    x.contrib = x.inn ? (x.r+x.rbi+x.dOut)/x.inn : 0;   // 평가에 쓰는 이닝당 기여도
  });
  return m;
}
function fmtAvg(v){ var s=(Math.round(v*1000)/1000).toFixed(3); return s.charAt(0)==='0'?s.slice(1):s; }
function canAddDefense(list){ return (list||[]).length<2; }
/* 주루 — bases=[1루,2루,3루], 각 칸에 sid 또는 null.
   kind: 0=아웃  1=1루타  2=2루타  3=3루타  4=홈런  5=포볼(밀어내기)  6=야수선택
   안타·홈런은 모든 주자를 그만큼 밀고, 포볼은 「차 있는 루만」 연쇄로 민다. */
function advance(bases, batterSid, kind){
  var b = (bases||[null,null,null]).slice(), runs=[];
  if(kind===0) return {bases:b, runs:runs};

  if(kind===5){                       // 포볼 — 강제 진루만
    if(b[0]){                         // 1루가 비어 있으면 아무도 안 움직인다
      if(b[1]){
        if(b[2]) runs.push(b[2]);     // 만루 → 3루 주자 밀려서 득점
        b[2]=b[1];
      }
      b[1]=b[0];
    }
    b[0]=batterSid;
    return {bases:b, runs:runs};
  }
  if(kind===6){                       // 야수선택 — 타자만 1루로, 주자는 그대로
    b[0] = b[0] || null;              // (죽은 주자는 다이아몬드에서 따로 지운다)
    var tmp = b[0];
    b[0] = batterSid;
    if(tmp){ /* 1루에 있던 주자는 보통 아웃 — 화면에서 확인·수정 */ }
    return {bases:b, runs:runs, fc:true};
  }

  for(var i=2;i>=0;i--){              // 안타·홈런
    if(!b[i]) continue;
    var to = i + kind;
    if(to>=3) runs.push(b[i]); else b[to] = b[i];
    b[i] = null;
  }
  if(kind>=4) runs.push(batterSid);
  else b[kind-1] = batterSid;
  return {bases:b, runs:runs};
}
/* 타석 결과 → 타수에 넣을지 (포볼은 타수에서 뺀다) */
function isAB(kind){ return kind !== 5; }
function isHit(kind){ return kind>=1 && kind<=4; }

/* ───── 상태 ──────────────────────────────────────────── */
var DB=null, FB=null;
var S = load();

function load(){
  var d;
  try{ d = JSON.parse(localStorage.getItem('bb.v1')||'null'); }catch(e){ d=null; }
  if(!d) d = {};
  d.cfg = Object.assign({school:'', classCount:11, classNames:[], gasUrl:'', fb:'', mine:[], showAll:false}, d.cfg||{});
  d.cfg.mine = d.cfg.mine || [];
  if(!d.cfg.classNames.length) d.cfg.classNames = defaultClassNames(d.cfg.classCount);
  d.classes = d.classes || {};        // { 학급명: {roster:[], groups:{}, games:[], tt:{}, rep:{}} }
  d.cur = d.cur || null;
  return d;
}
function defaultClassNames(n){
  var out=[]; for(var i=1;i<=n;i++) out.push(i+'반'); return out;
}
var DEVICE = (function(){
  var d = localStorage.getItem('bb.dev');
  if(!d){ d = 'd'+Math.random().toString(36).slice(2,9); localStorage.setItem('bb.dev', d); }
  return d;
})();
function ck(x){ return String(x).replace(/[.#$/\[\]]/g,'_'); }
function ROOT(){ return 'baseball/' + ck(S.cfg.school || 'default'); }

/* 로컬 저장은 즉시 — 화면이 절대 기다리지 않게 한다 */
function save(){ try{ localStorage.setItem('bb.v1', JSON.stringify(S)); }catch(e){} }

/* Firebase 는 「바뀐 칸만」 뒤에서 보낸다. 실패해도 로컬은 이미 저장돼 있다. */
function push(path, val){
  if(!DB) return;
  syncing(true);
  DB.ref(ROOT()+'/'+path).set(val)
    .then(function(){ syncing(false); })
    .catch(function(){ syncing(false); });
}
function patch(path, obj){
  if(!DB) return;
  syncing(true);
  DB.ref(ROOT()+'/'+path).update(obj)
    .then(function(){ syncing(false); })
    .catch(function(){ syncing(false); });
}
function drop(path){
  if(!DB) return;
  syncing(true);
  DB.ref(ROOT()+'/'+path).remove()
    .then(function(){ syncing(false); })
    .catch(function(){ syncing(false); });
}
var _syncN = 0;
function syncing(on){
  _syncN = Math.max(0, _syncN + (on?1:-1));
  var d = el('netDot'); if(!d) return;
  d.style.opacity = _syncN ? '.4' : '1';
}

/* ═══ 동기화 (2026-08-18 다시 씀) ═══════════════════════
   예전에는 타석을 하나 기록할 때마다 「타석 배열 전체」를 올리고,
   받을 때도 받은 배열로 통째 교체했다. 그래서 두 기기가 같은 경기를 기록하면
   나중에 올라간 (더 짧은) 배열이 앞의 기록을 지워 버렸다.
   배열 번호(atbats/20)로 올리는 경우도 두 기기가 똑같이 21번째를 치면 같은 칸에 부딪혔다.

   이제 기록 한 건 = 고유 id 한 칸이다.
     올릴 때 : ab/{id} 한 칸만  → 남의 기록을 덮어쓸 수가 없다
     받을 때 : id 로 합치기만   → 받은 것 때문에 내 기록이 지워지지 않는다
     지울 때 : 그 id 만 지운다  (되돌리기)
   덕분에 두 기기가 동시에 기록해도 합쳐지고, 끊겼다 다시 붙어도 밀린 것만 올라간다.
   이닝·주자·점수 같은 「현재 상태」만 예전처럼 마지막 입력이 이긴다(cur 칸 하나). */

/* id 는 기기마다 다르게 만든다 — 같은 순번이어도 절대 안 부딪힌다 */
var _idN = 0;
function newId(){ return DEVICE+'_'+(++_idN)+'_'+Date.now().toString(36); }
/* 순서용 시각 — 같은 밀리초에 두 건이 들어와도 순서가 뒤집히지 않게 항상 커진다 */
var _lastTs = 0;
function stamp(){ _lastTs = Math.max(Date.now(), _lastTs+1); return _lastTs; }
/* 예전 기록(id 없음)에 id 를 붙인다. ts 는 배열 순서를 그대로 쓴다(작은 수라 새 기록보다 앞선다) */
function ensureIds(g){
  if(!g) return;
  g.atbats = g.atbats || []; g.defense = g.defense || [];
  g.atbats.forEach(function(r,i){ if(!r.id) r.id='old'+g.no+'_'+i; if(!r.ts) r.ts=i+1; });
  g.defense.forEach(function(r,i){ if(!r.id) r.id='oldd'+g.no+'_'+i; if(!r.ts) r.ts=i+1; });
}
function mapOf(list){
  var m={}; (list||[]).forEach(function(r){ if(r.id) m[r.id]=r; }); return m;
}
function sortRec(list){
  list.sort(function(a,b){ return (a.ts||0)-(b.ts||0) || (String(a.id)<String(b.id)?-1:1); });
}
/* 합치기만 한다 — 새로 들어온 것이면 true */
function mergeRec(list, rec){
  for(var i=0;i<list.length;i++) if(list[i].id===rec.id){ list[i]=rec; return false; }
  list.push(rec); sortRec(list); return true;
}

function gPath(cn, g){ return 'classes/'+ck(cn)+'/games/'+g.no; }

/* 현재 상태 — 이닝·주자·점수·수비 배치. 칸 하나라 수백 바이트로 끝난다. */
function syncState(cn, g, extra){
  save();
  if(!DB) return;
  var o = {st:g.st, bases:g.bases||[null,null,null], hs:g.hs, as:g.as,
           status:g.status, def:g.def||null, _by:DEVICE, _at:Date.now()};
  if(extra) Object.keys(extra).forEach(function(k){ o[k]=extra[k]; });
  patch(gPath(cn,g)+'/cur', o);
}
/* 타석 한 건 */
function syncAB(cn, g, rec){ save(); if(DB && rec && rec.id) push(gPath(cn,g)+'/ab/'+rec.id, rec); }
/* 앞 타자의 득점만 고칠 때 — 그 칸의 run 하나만 */
function syncABRun(cn, g, rec){ save(); if(DB && rec && rec.id) patch(gPath(cn,g)+'/ab/'+rec.id, {run:rec.run||0}); }
function dropAB(cn, g, id){ save(); if(DB && id) drop(gPath(cn,g)+'/ab/'+id); }
/* 수비 기여 한 건 */
function syncDF(cn, g, rec){ save(); if(DB && rec && rec.id) push(gPath(cn,g)+'/df/'+rec.id, rec); }

/* 경기 전체 — 라인업 확정·경기 종료처럼 드물 때만.
   ★ set 이 아니라 update 로 올린다. set 이면 아직 못 받은 상대 기기의 기록까지 날아간다. */
function syncGameFull(cn, g){
  save();
  if(!DB) return;
  ensureIds(g);
  var meta = {};
  Object.keys(g).forEach(function(k){
    if(k.charAt(0)==='_') return;                        // 화면용 임시값(_pick 등)은 안 올린다
    if(k==='atbats'||k==='defense') return;              // 기록은 ab/df 칸으로 따로 올린다
    if(k==='st'||k==='bases'||k==='hs'||k==='as') return; // 현재 상태는 cur 칸으로
    meta[k] = g[k];
  });
  patch(gPath(cn,g), meta);
  syncState(cn, g);
  if(g.atbats.length)  patch(gPath(cn,g)+'/ab', mapOf(g.atbats));
  if(g.defense.length) patch(gPath(cn,g)+'/df', mapOf(g.defense));
}
function syncRoster(cn){
  save();
  push('classes/'+ck(cn)+'/roster', cls(cn).roster);
}
function syncMisc(cn, key){
  save();

/* 같은 경기를 보는 다른 기기의 입력을 실시간으로 받아온다.
   기록은 칸 단위(child_*)로 받으므로, 타석 하나 들어올 때 경기 전체를 다시 받지 않는다. */
var _w = null;
function watchGame(cn, gno){
  var key = cn+'#'+gno;
  if(!DB || (_w && _w.key===key)) return;
  unwatch();
  var g0 = gameOf(cn, gno);
  if(!g0) return;
  ensureIds(g0);
  _w = {key:key, refs:[], ready:false};
  var base = DB.ref(ROOT()+'/classes/'+ck(cn)+'/games/'+gno);

  /* 화면이 다시 그려지면 경기 객체가 바뀔 수 있으므로 그때그때 찾는다 */
  function G(){ return gameOf(cn, gno); }
  function done(){ save(); if(V==='game') render(); }
  function on(ref, ev, fn){ ref.on(ev, fn); _w.refs.push([ref, ev, fn]); }
  function say(m){ if(_w && _w.ready) toast(m); }

  /* 1) 현재 상태 — 마지막 입력이 이긴다 */
  on(base.child('cur'), 'value', function(s){
    var v = s.val(); if(!v || v._by===DEVICE) return;     // 내가 쓴 건 무시 (되울림 방지)
    var g = G(); if(!g) return;
    ['st','bases','hs','as','status','def'].forEach(function(k){
      if(v[k]!==undefined && v[k]!==null) g[k] = v[k]; });
    done(); say('다른 기기 진행 상황 반영');
  });

  /* 2) 타석 — 합치기만 한다 */
  var ab = base.child('ab');
  on(ab, 'child_added', function(s){
    var g=G(), r=s.val(); if(!g||!r) return;
    r.id = s.key;
    if(mergeRec(g.atbats, r)) say('다른 기기 타석 반영');
    done();
  });
  on(ab, 'child_changed', function(s){
    var g=G(), r=s.val(); if(!g||!r) return;
    r.id = s.key; mergeRec(g.atbats, r); done();
  });
  on(ab, 'child_removed', function(s){
    var g=G(); if(!g) return;
    var i = g.atbats.findIndex(function(x){ return x.id===s.key; });
    if(i>=0){ g.atbats.splice(i,1); done(); say('다른 기기 되돌리기 반영'); }
  });

  /* 3) 수비 기여 */
  var df = base.child('df');
  on(df, 'child_added', function(s){
    var g=G(), r=s.val(); if(!g||!r) return;
    r.id = s.key;
    if(mergeRec(g.defense, r)) say('다른 기기 수비 기여 반영');
    done();
  });
  on(df, 'child_removed', function(s){
    var g=G(); if(!g) return;
    var i = g.defense.findIndex(function(x){ return x.id===s.key; });
    if(i>=0){ g.defense.splice(i,1); done(); }
  });

  /* 4) 처음 한 번 — 예전 방식(배열 통째)으로 올라가 있던 기록을 새 구조로 옮겨 온다 */
  base.once('value').then(function(s){
    var v = s.val() || {}, g = G();
    if(g && !v.ab && ((v.atbats||[]).length || (v.defense||[]).length)){
      (v.atbats||[]).forEach(function(r,i){
        if(!r) return; r.id = r.id || ('old'+gno+'_'+i); r.ts = r.ts || (i+1);
        mergeRec(g.atbats, r); });
      (v.defense||[]).forEach(function(r,i){
        if(!r) return; r.id = r.id || ('oldd'+gno+'_'+i); r.ts = r.ts || (i+1);
        mergeRec(g.defense, r); });
      done();
    }
    if(g) syncGameFull(cn, g);          // 내 기록도 새 구조로 한 번 올려 둔다
    if(_w && _w.key===key) _w.ready = true;   // 여기서부터 들어오는 것만 토스트를 띄운다
  }).catch(function(){ if(_w && _w.key===key) _w.ready = true; });
}
function gameOf(cn, gno){
  var c = cls(cn); if(!c) return null;
  return (c.games||[]).filter(function(x){ return x.no===gno; })[0] || null;
}
function unwatch(){
  if(_w) _w.refs.forEach(function(x){ try{ x[0].off(x[1], x[2]); }catch(e){} });
  _w = null;
}

function cls(cn){
  cn = cn||S.cur;
  if(!cn) return null;
  if(!S.classes[cn]) S.classes[cn] = {roster:[], groups:{}, games:[], tt:{}, rep:{}};
  var c = S.classes[cn];
  c.roster=c.roster||[]; c.groups=c.groups||{}; c.games=c.games||[]; c.tt=c.tt||{}; c.rep=c.rep||{};
  c.gCount = c.gCount || 2;
  c.gNames = c.gNames || ['A조','B조','C조','D조'];
  return c;
}
function toast(m){
  var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on');},1900);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }

/* ───── Firebase (선택) ───────────────────────────────── */
/* ⚠️ 다시 부를 때 이전 연결의 리스너를 반드시 떼야 한다.
   예전엔 안 떼서, 설정을 고칠 때마다 죽은 연결의 감시가 쌓이고
   경기 감시(_w)가 사라진 DB 를 가리킨 채 남아 있었다. */
var _connRef = null;
function initFB(){
  var raw = (S.cfg.fb||'').trim();
  setNet(false, raw? '연결 중…' : '로컬 저장');
  unwatch();
  if(_connRef){ try{ _connRef.off(); }catch(e){} _connRef = null; }
  if(FB){ try{ FB.delete(); }catch(e){} FB = null; }
  DB = null;
  if(!raw) return;
  try{
    var conf = JSON.parse(raw);
    FB = firebase.initializeApp(conf, 'bb'+Date.now());
    DB = firebase.database(FB);
    _connRef = DB.ref('.info/connected');
    _connRef.on('value', function(s){
      setNet(!!s.val(), s.val()? 'Firebase 연결' : '오프라인 (로컬 저장)');
    });
  }catch(e){ DB=null; setNet(false,'설정 오류 — 로컬 저장'); }
}
function setNet(ok, txt){
  var d=el('netDot'); d.className = 'dot ' + (ok?'ok':'off');
  el('netTx').textContent = txt;
}

/* ───── 설정 링크 ─────────────────────────────────────
   학교명 · 앱스스크립트 주소 · Firebase 설정을 링크 하나에 담는다.
   기기가 바뀔 때마다 손으로 다시 넣지 않아도 되게 하려는 것.

   ★ 이 값들을 앱 코드(공개 저장소)에 박아 넣지 않는 이유:
     지금 Realtime Database 규칙이 열려 있어서, 이 설정을 아는 사람은
     학생 이름·번호·기록을 읽고 고치고 지울 수 있다. 공개 저장소는 봇이 훑고 다닌다.
     그래서 「코드에 심기」 대신 「선생님끼리만 주고받는 링크」로 둔다. */
function b64e(s){
  return btoa(unescape(encodeURIComponent(s)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(s){
  s = String(s).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
}
function setupLink(){
  var p = {v:1, school:S.cfg.school||'', gas:S.cfg.gasUrl||'', fb:S.cfg.fb||''};
  if(!p.gas && !p.fb) return '';
  return location.origin + location.pathname + '#setup=' + b64e(JSON.stringify(p));
}
/* ★ 이 링크를 태블릿 바탕화면 바로가기로 걸어 두는 걸 권한다.
   그러면 브라우저가 저장소를 비워 버려도 앱을 열 때마다 설정이 저절로 다시 들어와서,
   선생님이 다시 설정하러 다닐 일이 없다.
   대신 이미 같은 설정이면 아무 말도 하지 않는다 — 열 때마다 알림이 뜨면 성가시다. */
function applySetupLink(){
  var m = /[#&]setup=([^&]+)/.exec(location.hash || '');
  if(!m) return false;
  var p = null;
  try{ p = JSON.parse(b64d(m[1])); }catch(e){}
  /* 주소창에서 즉시 지운다 — 화면을 띄워 놓거나 방문기록이 남아도 설정값이 안 보이게 */
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
  if(!p) return false;
  var changed = false;
  if(p.school && S.cfg.school !== p.school){ S.cfg.school = p.school; changed = true; }
  if(p.gas    && S.cfg.gasUrl !== p.gas   ){ S.cfg.gasUrl = p.gas;    changed = true; }
  if(p.fb     && S.cfg.fb     !== p.fb    ){ S.cfg.fb     = p.fb;     changed = true; }
  if(changed) save();
  return changed;
}

/* ───── 앱스스크립트 브릿지 ───────────────────────────── */
function jsonp(params){
  return new Promise(function(res, rej){
    var url = S.cfg.gasUrl;
    if(!url) return rej(new Error('앱스스크립트 주소가 없습니다'));
    var cb = 'bbcb'+Math.random().toString(36).slice(2);
    var t = setTimeout(function(){ cleanup(); rej(new Error('응답 없음 (시간 초과)')); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; if(sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function(d){ cleanup(); res(d); };
    var q = Object.keys(params).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    var sc = document.createElement('script');
    sc.src = url + (url.indexOf('?')<0?'?':'&') + q + '&callback=' + cb;
    sc.onerror = function(){ cleanup(); rej(new Error('연결 실패')); };
    document.body.appendChild(sc);
  });
}
function gasPost(action, payload){
  var url = S.cfg.gasUrl;
  if(!url) return Promise.reject(new Error('앱스스크립트 주소가 없습니다'));
  var fd = new FormData();
  fd.append('action', action);
  fd.append('payload', JSON.stringify(payload));
  return fetch(url, {method:'POST', body:fd, mode:'no-cors'}).then(function(){ return {ok:true}; });
}

var GK = ['A','B','C','D'];
function grpName(k){
  var c = S.cur ? cls() : null;
  var i = GK.indexOf(k);
  return (c && c.gNames && c.gNames[i]) ? c.gNames[i] : (k+'조');

function grpKeys(){ var c = cls(); return GK.slice(0, c.gCount||2); }

/* 지금까지의 타율 — 실력 균등 배정에 쓴다 */
function avgMap(){
  var c = cls(), t = tally(allAtbats(c), allDefense(c), {}), m = {};
  c.roster.forEach(function(s){ var x=t[s.sid]; m[s.sid] = (x && x.ab) ? x.h/x.ab : -1; });
  return m;
}
/* 뱀 모양 배정 — 1,2,3 / 3,2,1 로 접어 넣어 실력이 한쪽에 몰리지 않게 */
function snake(list, k){
  var out = list.map(function(){return 0;}), g=0, dir=1;
  for(var i=0;i<list.length;i++){
    out[i]=g; g+=dir;
    if(g>=k){ g=k-1; dir=-1; } else if(g<0){ g=0; dir=1; }
  }
  return out;
}
function assignAuto(mode){
  var c = cls(), k = c.gCount||2, keys = grpKeys();
  var list = c.roster.slice();
  if(mode==='num')    list.sort(function(a,b){ return String(a.num).localeCompare(String(b.num),'ko',{numeric:true}); });
  if(mode==='rand')   list.sort(function(){ return Math.random()-0.5; });
  if(mode==='skill'){ var av=avgMap(); list.sort(function(a,b){ return av[b.sid]-av[a.sid]; }); }
  if(mode==='gender'){
    //  남녀를 따로 뱀 배정해서 두 축 모두 고르게
    ['남','여'].forEach(function(gd){
      var sub = c.roster.filter(function(s){return s.gender===gd;});
      snake(sub, k).forEach(function(gi,i){ sub[i].group = keys[gi]; });
    });
    syncRoster(S.cur); vGroups(); return toast('남녀 고르게 배정했습니다');
  }
  snake(list, k).forEach(function(gi,i){ list[i].group = keys[gi]; });
  syncRoster(S.cur); vGroups();
  toast({num:'번호순',rand:'무작위',skill:'실력 균등'}[mode]+'으로 배정했습니다');
}

/* ── 드래프트 ──
   주장 지정 → 여학생 라운드 → 남학생 라운드.
   각 라운드는 「먼저 뽑을 조」를 가위바위보로 정해 누른 뒤 번갈아 지명한다. */
function startDraft(){
  var c = cls();
  c.draft = { active:true, caps:[], phase:'cap', first:null, idx:0 };
  c.roster.forEach(function(s){ s.group = null; });
  save(); vGroups();
}
function draftPool(g){                     // 이번 라운드에 남은 학생
  var c = cls();
  return c.roster.filter(function(s){
    return !s.group && (g==='F' ? s.gender==='여' : s.gender==='남');
  });
}
function draftTurn(){                      // 지금 뽑을 조의 인덱스
  var c = cls(), d = c.draft, k = c.gCount||2;
  return (d.first + d.idx) % k;
}
function draftAdvance(){
  var c = cls(), d = c.draft;
  d.idx++;
  if(draftPool(d.phase).length===0){
    if(d.phase==='F'){
      //  남학생 라운드 선공 추천 = 여학생 때 「후공이던 조」.
      //  (마지막에 뽑은 조가 아니다 — 인원이 홀수면 선공 조가 마지막까지 뽑기 때문)
      var k = c.gCount||2;
      d.suggest = (d.first + 1) % k;
      d.phase='M'; d.first=null; d.idx=0;
    }else{
      d.phase='done';
    }
  }
}

        '<p class="st" style="margin:0 0 9px">성별은 선생님이 맞춰서 고르시면 됩니다.</p>'+

        '<button class="btn dn sm" id="dCancel">취소</button></div></div>';

    }else if(d.phase==='done'){
      draftBox = '<div class="card" style="border-color:var(--hit)">'+
        '<h3 style="color:var(--hit)">드래프트 완료</h3>'+
        '<div class="row"><button class="btn pri" id="dDone">확정하기</button>'+
        '<button class="btn sm" id="dUndo">한 명 되돌리기</button></div></div>';

    }else{

        (mem.length ? mem.map(function(s){

            (c.draft && c.draft.caps && c.draft.caps.indexOf(s.sid)>=0 ? ' <span class="tag dup">주장</span>' : '')+
            '</span>'+
            '<span class="tag '+(s.gender==='남'?'m':'f')+'">'+esc(s.gender)+'</span>'+
            (d ? '' : '<button class="btn sm" data-mvg="'+s.sid+'">이동</button>')+'</div>';
        }).join('') : '<div class="msg">비어 있음</div>')+'</div>';
    }).join('')+'</div>';

  var unassigned = c.roster.filter(function(s){ return !s.group; });
  var un = (!d && unassigned.length) ?
    '<div class="card" style="border-color:var(--warn)"><h3 style="color:var(--warn)">미배정 '+unassigned.length+'명</h3>'+
    unassigned.map(function(s){ return '<span class="tag" style="margin:2px">'+esc(s.name)+'</span>'; }).join('')+

  el('saveGn').onclick = function(){

    for(var i=0;i<4;i++) if(nm[i]) c.gNames[i]=nm[i];

    //  줄어든 조에 있던 학생은 미배정으로
    var ok = grpKeys();
    c.roster.forEach(function(s){ if(s.group && ok.indexOf(s.group)<0) s.group=null; });
    syncRoster(S.cur); vGroups(); toast('저장했습니다');
  };
  el('v-grp').querySelectorAll('[data-au]').forEach(function(b){

  });
  if(el('dStart')) el('dStart').onclick = function(){

      st.group = keys[turn];

      draftAdvance();
      save(); vGroups();

    var st = c.roster.filter(function(s){return s.sid===sid;})[0];
    if(st) st.group = null;
    //  라운드/차례를 하나 뒤로
    if(c.draft.phase==='done'){ c.draft.phase = st && st.gender==='여' ? 'F':'M'; }

  if(el('dCancel')) el('dCancel').onclick = function(){

  if(el('dDone')) el('dDone').onclick = function(){

  };
  el('v-grp').querySelectorAll('[data-mvg]').forEach(function(b){
    b.onclick = function(){
      var s = c.roster.filter(function(x){return x.sid===b.dataset.mvg;})[0];
      var i = keys.indexOf(s.group);
      s.group = keys[(i+1) % keys.length];

  });
}
function nameOfSid(sid){

  return s ? s.name : '';
}

/* ── 야구 ─────────────────────────────── */
function vGame(){

      : '<div class="row"><div style="flex:1"><label style="font-size:11.5px;color:var(--tx3)">상대 학급</label>'+

        '<div style="flex:1"><label style="font-size:11.5px;color:var(--tx3)">이닝</label>'+

function paCount(c){
  var m={};
  c.games.forEach(function(g){ (g.atbats||[]).forEach(function(a){ m[a.sid]=(m[a.sid]||0)+1; }); });
  return m;
}

function startGame(mode){
  var c = cls();
  var innings = +((el('inn')||{}).value || 2);
  var hp, ap, hname, aname, oppClass=null, oppCount=0;

  if(mode==='intra'){
    hp = c.roster.filter(function(s){return s.group==='A';});
    ap = c.roster.filter(function(s){return s.group==='B';});
    hname='A조'; aname='B조';
    if(!hp.length || !ap.length) return toast('A조와 B조 모두 인원이 있어야 합니다');
  }else{
    var opp = el('opp') ? el('opp').value : '';
    hp = c.roster; hname = S.cur; aname = opp || '상대';
    var oc = S.classes[opp];
    if(oc && oc.roster && oc.roster.length){ ap = oc.roster; oppClass = opp; }
    else{ ap = []; oppCount = Math.max(1, +(el('oppN')||{}).value || hp.length); }
  }

  var g = {
    no: (c.games.reduce(function(m,x){return Math.max(m,x.no);},0))+1,
    mode:mode, innings:innings, home:hname, away:aname, oppClass:oppClass, oppCount:oppCount,
    hs:0, as:0, status:'lineup', st:{inning:1, half:'초', idx:0},
    seqH: hp.map(function(p){return p.sid;}), seqA: ap.map(function(p){return p.sid;}),
    outH: [], outA: [],
    orderH:[], orderA:[], atbats:[], defense:[], bases:[null,null,null],
    date: new Date().toISOString().slice(0,10)
  };
  c.games.push(g); save(); render();
}

/* 학생 찾기 — 우리 학급 + (학급대항이면) 상대 학급 명단에서 */
function findP(g, sid){
  var pool = cls().roster.slice();
  if(g.oppClass && S.classes[g.oppClass]) pool = pool.concat(S.classes[g.oppClass].roster);
  return pool.filter(function(p){return p.sid===sid;})[0];
}
function activeCount(g, side){
  var seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
  if(side==='A' && !seq.length) return g.oppCount||0;
  return seq.filter(function(sid){ return out.indexOf(sid)<0; }).length;
}

/* ── 당일 라인업·타순 짜기 ─────────────────── */
function lineupView(g){
  var nH = activeCount(g,'H'), nA = activeCount(g,'A');
  var target = Math.max(nH, nA);
  var dupH = Math.max(0, target-nH), dupA = Math.max(0, target-nA);

  function col(side, name){
    var seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
    var dup = side==='H'?dupH:dupA;
    if(side==='A' && !seq.length){
      return '<div class="card"><h3>'+esc(name)+' <span class="tag">명단 없음</span></h3>'+
        '<label style="font-size:11.5px;color:var(--tx3)">오늘 출전 인원수</label>'+
        '<input type="number" min="1" max="40" id="oppCnt" value="'+(g.oppCount||9)+'">'+
        '<p class="st" style="margin:9px 0 0">상대 학급 명단이 없어 인원수로만 진행합니다.</p></div>';
    }
    var live = seq.filter(function(sid){return out.indexOf(sid)<0;}).length;
    var placed = Object.keys((g.def||{})[side]||{}).length;
    return '<div class="card"><h3>'+esc(name)+' · 출전 <b style="color:var(--warn)">'+live+'명</b>'+
      (dup ? ' <span class="tag dup">중복 '+dup+'</span>' : '')+
      ' <span class="tag">수비 '+placed+'/9</span></h3>'+
      '<div class="row" style="margin-bottom:9px">'+

  }

  el('v-game').innerHTML =
    '<h2 class="t">경기 #'+g.no+' 라인업</h2>'+

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(288px,1fr))">'+
      col('H', g.home)+col('A', g.away)+'</div>'+
    (dupH||dupA ?
      '<div class="card" style="border-color:var(--warn)"><h3 style="color:var(--warn)">인원이 다릅니다</h3>'+
      '<p class="st" style="margin:0">'+esc(dupH?g.home:g.away)+'에 <b>중복 타자 '+(dupH||dupA)+'명</b>이 붙어 '+
      '양 팀 모두 <b>'+target+'타석</b>이 됩니다. 남녀 비율은 유지되고 타석 수가 적은 학생부터 뽑힙니다.</p></div>'
      : '<div class="card"><p class="st" style="margin:0">양 팀 <b>'+target+'명</b>으로 인원이 같습니다.</p></div>')+
    '<div class="row"><button class="btn pri" id="goGame" style="flex:1;justify-content:center;padding:14px;font-size:15px">경기 시작</button>'+
    '<button class="btn dn" id="cancelG">취소</button></div>';

  el('v-game').querySelectorAll('[data-ck]').forEach(function(cb){
    cb.onchange = function(){
      var side=cb.dataset.ck, sid=cb.dataset.sid, out = side==='H'?g.outH:g.outA;
      var i = out.indexOf(sid);
      if(cb.checked){ if(i>=0) out.splice(i,1); } else if(i<0) out.push(sid);
      save(); lineupView(g);
    };
  });
  el('v-game').querySelectorAll('[data-mv]').forEach(function(b){
    b.onclick = function(){
      var q = b.dataset.mv.split(':'), seq = q[0]==='H'?g.seqH:g.seqA;
      var i = +q[1], j = i + (+q[2]);
      if(j<0 || j>=seq.length) return;
      var t = seq[i]; seq[i]=seq[j]; seq[j]=t;
      save(); lineupView(g);
    };
  });
  el('v-game').querySelectorAll('[data-all]').forEach(function(b){
    b.onclick = function(){ if(b.dataset.all==='H') g.outH=[]; else g.outA=[]; save(); lineupView(g); };
  });
  /* 포지션 지정 — 이미 차 있는 자리를 고르면 원래 있던 학생이 대기로 밀린다 */
  el('v-game').querySelectorAll('[data-pos]').forEach(function(sel){
    sel.onchange = function(){
      var side = sel.dataset.pos, sid = sel.dataset.sid;
      var kicked = setPos(g, side, sid, sel.value);
      save(); lineupView(g);
      if(kicked){ var kp = findP(g,kicked); toast((kp?kp.name:'앞 선수')+' → 대기로 밀렸습니다'); }

  });
  el('v-game').querySelectorAll('[data-auto]').forEach(function(b){
    b.onclick = function(){
      var side = b.dataset.auto, seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
      g.def = g.def || {}; g.def[side] = g.def[side] || {};
      var m = g.def[side], taken = {};
      Object.keys(m).forEach(function(k){ taken[m[k]] = 1; });
      var rest = seq.filter(function(sid){ return out.indexOf(sid)<0 && !taken[sid]; }), i = 0;
      POS.forEach(function(P){ if(!m[P.k] && rest[i]) m[P.k] = rest[i++]; });
      save(); lineupView(g); toast(i+'명을 빈 자리에 세웠습니다');
    };
  });
  el('v-game').querySelectorAll('[data-clrp]').forEach(function(b){
    b.onclick = function(){
      g.def = g.def || {}; g.def[b.dataset.clrp] = {};
      save(); lineupView(g); toast('수비 배치를 비웠습니다');
    };
  });
  el('v-game').querySelectorAll('[data-mix]').forEach(function(b){
    b.onclick = function(){
      var side=b.dataset.mix, seq = side==='H'?g.seqH:g.seqA, M=[], F=[];
      seq.forEach(function(sid){ var p=findP(g,sid); if(!p) return; (p.gender==='남'?M:F).push(sid); });
      var mixed=[], i=0, j=0;
      while(i<M.length || j<F.length){ if(i<M.length) mixed.push(M[i++]); if(j<F.length) mixed.push(F[j++]); }
      if(side==='H') g.seqH=mixed; else g.seqA=mixed;
      save(); lineupView(g); toast('남녀 교차로 타순을 짰습니다');
    };
  });
  if(el('oppCnt')) el('oppCnt').onchange = function(){
    g.oppCount = Math.max(1, +el('oppCnt').value||9); save(); lineupView(g);
  };
  el('cancelG').onclick = function(){
    if(!confirm('이 경기를 취소할까요?')) return;
    var c=cls(); c.games = c.games.filter(function(x){ return x.no!==g.no; });
    save(); render();
  };
  el('goGame').onclick = function(){ confirmLineup(g); };
}

function confirmLineup(g){
  var c = cls(), pa = paCount(c);
  function build(side){
    var seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
    if(side==='A' && !seq.length){
      var n = g.oppCount||9, arr=[];
      for(var i=0;i<n;i++) arr.push({sid:'opp'+g.no+'_'+i, num:String(i+1),
                                     name:'상대'+(i+1), gender: i%2?'여':'남', pa:0});
      return arr;
    }
    return seq.filter(function(sid){ return out.indexOf(sid)<0; })
      .map(function(sid){ var p=findP(g,sid);
        return p ? Object.assign({}, p, {pa: pa[sid]||0}) : null; }).filter(Boolean);
  }
  var hp = build('H'), ap = build('A');
  if(!hp.length || !ap.length) return toast('양 팀 모두 한 명 이상 출전해야 합니다');
  var target = Math.max(hp.length, ap.length);
  g.orderH = buildOrder(hp, target);
  g.orderA = buildOrder(ap, target);
  g.status = 'live';
  autoPos(g,'H'); autoPos(g,'A');       // 라인업에서 안 채운 자리는 타순대로
  syncGameFull(S.cur, g);
  render();
  toast('경기 시작 · 양 팀 '+target+'타석');
}


/* ── 전광판 ─────────────────────────────── */
/* z:'of' = 외야수(파란 배지), 나머지는 내야수(주황 배지) */
var POS = [
  {k:'CF', n:'중견수', x:50, y:13, z:'of'},
  {k:'LF', n:'좌익수', x:17, y:26, z:'of'},
  {k:'RF', n:'우익수', x:83, y:26, z:'of'},
  {k:'SS', n:'유격수', x:36, y:45},
  {k:'2B', n:'2루수', x:64, y:45},
  {k:'3B', n:'3루수', x:23, y:55},
  {k:'1B', n:'1루수', x:77, y:55},
  {k:'P',  n:'투수',   x:50, y:63},
  {k:'C',  n:'포수',   x:50, y:92}
];
/* 수비 배치 — 없으면 타순 앞 9명을 자동으로 세운다 */
function defOf(g, side){
  g.def = g.def || {};
  if(!g.def[side]){
    var order = side==='H' ? g.orderH : g.orderA, m = {}, seen = {};
    var pool = order.filter(function(p){ if(seen[p.sid]) return false; seen[p.sid]=1; return true; });
    POS.forEach(function(P,i){ if(pool[i]) m[P.k] = pool[i].sid; });
    g.def[side] = m;
  }
  return g.def[side];
}
function benchOf(g, side){
  var d = defOf(g, side), on = {};
  Object.keys(d).forEach(function(k){ on[d[k]] = 1; });
  var order = side==='H' ? g.orderH : g.orderA, seen = {};
  return order.filter(function(p){
    if(seen[p.sid] || on[p.sid]) return false; seen[p.sid]=1; return true; });
}
function pName(g, sid){
  var f = g.orderH.concat(g.orderA).filter(function(p){return p.sid===sid;})[0];
  return f ? f.name : '';
}
/* 야구장 그림 — 그림이 칸을 꽉 채우도록 세로를 78 로 잡은 좌표계.
   홈(50,66) 에서 90도로 펼쳐진 부채꼴, 베이스 간격 34.
   1루(74,42) 2루(50,18) 3루(26,42) 이 되고 파울선 끝이 칸의 좌우 끝에 닿는다. */
function fieldSVG(){
  return '<svg class="fbg" viewBox="0 0 100 78" preserveAspectRatio="none">'+
    /* 외야 잔디 */
    '<path d="M50,66 L3.3,19.3 A66,66 0 0,1 96.7,19.3 Z" fill="#17492c"/>'+
    /* 내야 흙 */
    '<path d="M50,66 L16.1,32.1 A48,48 0 0,1 83.9,32.1 Z" fill="#6b4a30"/>'+
    /* 내야 잔디 — 네 베이스를 이은 마름모 */
    '<polygon points="50,66 74,42 50,18 26,42" fill="#1d5c37"/>'+
    /* 파울선 · 외야 펜스 */
    '<path d="M50,66 L3.3,19.3 M50,66 L96.7,19.3" stroke="rgba(255,255,255,.34)" '+
      'stroke-width=".6" fill="none"/>'+
    '<path d="M3.3,19.3 A66,66 0 0,1 96.7,19.3" stroke="rgba(255,255,255,.22)" '+
      'stroke-width=".8" fill="none"/>'+
    /* 베이스 · 투수판 · 홈플레이트 */
    '<g fill="#eef6f1">'+
      '<rect x="71.8" y="39.8" width="4.4" height="4.4" transform="rotate(45 74 42)"/>'+
      '<rect x="47.8" y="15.8" width="4.4" height="4.4" transform="rotate(45 50 18)"/>'+
      '<rect x="23.8" y="39.8" width="4.4" height="4.4" transform="rotate(45 26 42)"/>'+
      '<polygon points="47.4,63.6 52.6,63.6 52.6,66.2 50,68.4 47.4,66.2"/>'+
      '<rect x="46" y="48.2" width="8" height="1.8" rx=".6"/>'+
    '</g></svg>';
}
/* 이 선수가 맡은 자리 (없으면 '') */
function posOf(g, side, sid){
  var m = (g.def||{})[side] || {}, r = '';
  Object.keys(m).forEach(function(k){ if(m[k]===sid) r = k; });
  return r;
}
/* 자리 배정 — 원래 있던 자리는 비우고, 그 자리에 있던 사람은 대기로 밀린다 */
function setPos(g, side, sid, posKey){
  g.def = g.def || {}; g.def[side] = g.def[side] || {};
  var m = g.def[side], kicked = '';
  Object.keys(m).forEach(function(k){ if(m[k]===sid) delete m[k]; });
  if(posKey){ kicked = m[posKey] || ''; m[posKey] = sid; }
  return kicked;
}
/* 빈 자리를 타순 순서대로 채운다 */
function autoPos(g, side){
  var m = defOf(g, side), taken = {};
  Object.keys(m).forEach(function(k){ taken[m[k]] = 1; });
  var rest = benchOf(g, side), i = 0;
  POS.forEach(function(P){ if(!m[P.k] && rest[i]) m[P.k] = rest[i++].sid; });
  return i;
}
/* 이닝별 득점 — 그 회에 기록된 타석의 득점을 합친다 */
function runsIn(g, inning, half){
  return (g.atbats||[]).reduce(function(a,x){
    return a + ((x.inning===inning && x.half===half) ? (x.run||0) : 0); }, 0);
}
function hitsOf(g, side){
  return (g.atbats||[]).filter(function(x){
    return x.side===side && x.kind>=1 && x.kind<=4; }).length;
}
/* 그 회를 시작했는지 — 아직 안 온 회만 점수 칸을 '-' 로 비운다 (진행 중인 회는 지금까지의 점수) */
function halfPlayed(g, inning, half){
  if(inning < g.st.inning) return true;
  if(inning > g.st.inning) return false;
  return half==='초' ? true : (g.st.half==='말');
}

function board(g){
  var c = cls();
  watchGame(S.cur, g.no);
  var atk = g.st.half==='초' ? 'A' : 'H';
  var dside = atk==='H' ? 'A' : 'H';          // 수비팀
  var order = atk==='H' ? g.orderH : g.orderA;
  var b = order[g.st.idx];
  var st = tally(g.atbats, g.defense, {});
  var cum = tally(allAtbats(c), allDefense(c), {});
  var mine = b ? (cum[b.sid] || {ab:0,h:0,hr:0,rbi:0,avg:0}) : {ab:0,h:0,hr:0,rbi:0,avg:0};
  g.bases = g.bases || [null,null,null];
  var dmap = defOf(g, dside);
  g._pick = g._pick || [];                    // 아웃 기여로 고른 선수
  g._swap = !!g._swap;                        // 교대 모드

  /* 한 팀 칸 — 공격이면 타순표, 수비면 배치도 */
  function panel(side){
    var isAtk = (side===atk), nm = side==='H' ? g.home : g.away;
    var head = '<div class="ph"><span class="pt '+(side==='H'?'h':'a')+'">'+esc(nm)+'</span>'+
      '<span class="pmode '+(isAtk?'on':'off')+'">'+(isAtk?'공격':'수비')+'</span>'+
      (isAtk ? '' : '<span class="phint">'+
        (g._swap ? '교대할 자리를 누르세요'
                 : (g._pick.length ? g._pick.length+'명 선택 — 기여 확정' : '아웃에 기여한 선수를 누르세요'))+'</span>')+
      '</div>';
    if(isAtk) return head + '<div class="lineup">'+
      lineupHTML(side==='H'?g.orderH:g.orderA, g, side, atk, cum)+'</div>';
    var bench = benchOf(g, side);
    return head +
      '<div class="field">'+fieldSVG()+POS.map(function(P){
          var sid = dmap[P.k], on = g._pick.indexOf(sid)>=0;
          return '<div class="po'+(P.z==='of'?' of':'')+(on?' pick':'')+(g._swap?' swap':'')+'" data-pos="'+P.k+'" '+
            'style="left:'+P.x+'%;top:'+P.y+'%"><div class="pp">'+P.n+'</div>'+
            '<div class="pn">'+esc(sid? pName(g,sid) : '—')+'</div></div>';
        }).join('')+'</div>'+
      '<div class="bench">대기 '+bench.length+'명'+
        (bench.length ? ' · '+bench.map(function(p){return esc(p.name);}).join(', ') : '')+'</div>'+
      '<div class="dbtn">'+
        '<button id="swapB" class="'+(g._swap?'on':'')+'">수비 교대</button>'+
        '<button id="okDef" class="'+(g._pick.length?'ok':'')+'">기여 확정'+(g._pick.length?' ('+g._pick.length+')':'')+'</button>'+
      '</div>';
  }

  /* 이닝별 점수표 — TEAM | 1 | 2 | … | R | H */
  function scoreTable(){
    var n = g.innings;
    var head = '<tr><th class="inh">TEAM</th>';
    for(var i=1;i<=n;i++) head += '<th'+(i===g.st.inning?' class="cur"':'')+'>'+i+'</th>';
    head += '<th class="rh">R</th><th class="hh">H</th><th class="adjh"></th></tr>';
    function row(side){
      var half = side==='A' ? '초' : '말';
      var o = '<tr class="'+(side==='H'?'h':'a')+'"><td class="tm">'+
              esc(side==='H'?g.home:g.away)+'</td>';
      for(var i=1;i<=n;i++){
        var played = halfPlayed(g,i,half), v = runsIn(g,i,half);
        o += '<td'+(played? (v?'':' class="z"') : ' class="z"')+'>'+(played? v : '-')+'</td>';
      }
      o += '<td class="rr">'+(side==='H'?g.hs:g.as)+'</td>'+
           '<td class="hh">'+hitsOf(g,side)+'</td>'+
           '<td class="adjc"><div class="adj"><button data-sc="'+side+'+">▲</button>'+
             '<button data-sc="'+side+'-">▼</button></div></td></tr>';
      return o;
    }
    return '<table class="isc">'+head+row('H')+row('A')+'</table>';
  }

  el('v-game').innerHTML =
  '<div class="row hdrow" style="margin-bottom:9px;justify-content:space-between">'+
    '<div><h2 class="t">경기 #'+g.no+'</h2>'+
    '<p class="st" style="margin:0">'+(g.mode==='intra'?'학급내':'학급대항')+' · 최대 '+g.innings+'이닝 · 전원타격제</p></div>'+
    '<div class="row"><button class="btn sm" id="tgL">◀ '+esc(g.home)+'</button>'+
      '<button class="btn sm" id="tgR">'+esc(g.away)+' ▶</button>'+
      '<button class="btn sm" id="fsB">전체화면</button>'+
      '<button class="btn sm" id="undo">되돌리기</button>'+
      '<button class="btn sm dn" id="fin">경기 종료</button></div></div>'+

  '<div class="board">'+
    '<div class="brow">'+
      '<div class="pan pan-l'+(g._hl?' hide':'')+'">'+panel('H')+'</div>'+
      '<div class="ctr">'+
        scoreTable()+
        '<div class="brun">'+diamondHTML(g)+
          '<div class="sbo">'+lampG('B',g._b||0,3,'b')+lampG('S',g._s||0,2,'s')+
            lampG('O',g._o||0,3,'o')+'</div>'+
          '<div class="dlb">루를 눌러 주자 진루·아웃을 고칩니다</div></div>'+
        (b ? '<div class="bwho"><span class="binn">'+g.st.inning+'회 '+g.st.half+'</span> · '+
               (g.st.idx+1)+'번 <span class="bpos">'+(posOf(g,atk,b.sid)||'대기')+'</span> '+
               '<b>'+esc(b.name)+'</b>'+(b.dup?' · 중복':'')+'</div>'
           : '<div class="msg">타자가 없습니다</div>')+
        (b ? '<div class="hits">'+
               '<button class="h1" data-k="1">1루타</button>'+
               '<button class="h2" data-k="2">2루타</button>'+
               '<button class="h3" data-k="3">3루타</button>'+
               '<button class="h4" data-k="4">홈런</button>'+
               '<button class="h5" data-k="5">포볼</button>'+
               '<button class="h6" data-k="6">야수선택</button>'+
               '<button class="h0" data-k="0">아웃</button>'+
             '</div>' : '')+
        '<div class="extra">'+
          '<button class="btn" id="pS">스트라이크</button>'+
          '<button class="btn" id="pB">볼</button>'+
          '<button class="btn" id="clrB">주자 비우기</button>'+
        '</div>'+
      '</div>'+
      '<div class="pan pan-r'+(g._hr?' hide':'')+'">'+panel('A')+'</div>'+
    '</div>'+
  '</div>'+
  '<div class="card hdrow" style="margin-top:11px"><h3>이 경기 기록</h3>'+
    (Object.keys(st).length ?
      '<table><tr><th>이름</th><th class="n">타석</th><th class="n">타수</th><th class="n">안타</th>'+
      '<th class="n">타율</th><th class="n">볼넷</th><th class="n">득점</th><th class="n">타점</th><th class="n">수비</th></tr>'+
      Object.keys(st).map(function(k){ var x=st[k];
        return '<tr><td>'+esc(nameOf(g,k))+'</td><td class="n">'+x.pa+'</td><td class="n">'+x.ab+'</td>'+
          '<td class="n">'+x.h+'</td><td class="n">'+fmtAvg(x.avg)+'</td><td class="n">'+x.bb+'</td>'+
          '<td class="n">'+x.r+'</td><td class="n">'+x.rbi+'</td><td class="n">'+x.dOut+'</td></tr>'; }).join('')+'</table>'
      : '<div class="msg">아직 기록이 없습니다</div>')+'</div>';

  function lampG(lb,v,n,cl){
    var o='<div class="g"><span class="lb">'+lb+'</span>';
    for(var i=0;i<n;i++) o+='<span class="lamp'+(i<v?' '+cl:'')+'"></span>';
    return o+'</div>';
  }

  el('v-game').querySelectorAll('.hits button').forEach(function(x){
    x.onclick = function(){ swing(+x.dataset.k); };
  });
  el('v-game').querySelectorAll('[data-sc]').forEach(function(x){
    x.onclick = function(){
      var k=x.dataset.sc, w=k.charAt(0), d=k.charAt(1)==='+'?1:-1;
      if(w==='H') g.hs=Math.max(0,g.hs+d); else g.as=Math.max(0,g.as+d);
      syncState(S.cur,g); board(g);
    };
  });
  //  다이아몬드 — 주자 이동/아웃 고르기
  el('v-game').querySelectorAll('.bs').forEach(function(x){
    x.onclick = function(){
      var i = +x.dataset.b, sid = g.bases[i];
      if(!sid){ g.bases[i] = b ? b.sid : 'x'; syncState(S.cur,g); board(g); return; }
      runnerPop(g, i, sid);
    };
  });
  //  수비 배치도
  el('v-game').querySelectorAll('[data-pos]').forEach(function(x){
    x.onclick = function(){
      var k = x.dataset.pos;
      if(g._swap) return swapPop(g, dside, k);
      var sid = dmap[k]; if(!sid) return;
      var i = g._pick.indexOf(sid);
      if(i>=0) g._pick.splice(i,1); else g._pick.push(sid);
      board(g);
    };
  });
  /* 타순표 단 수 — 한 단에 몇 명 들어가는지 재서 필요한 만큼만 쪼갠다.
     (CSS column-width 로 맡기면 14명일 때도 두 단으로 갈라져 이름이 잘린다) */
  el('v-game').querySelectorAll('.lineup').forEach(function(box){
    var n = box.children.length; if(!n) return;
    //  세로 모드는 칸 높이가 내용에 따라 정해지므로 계산하지 않고 CSS 에 맡긴다
    if(box.clientHeight < 220){ box.style.columnCount=''; box.classList.remove('narrow'); return; }
    var rowH = box.children[0].getBoundingClientRect().height + 3;
    var per = Math.max(1, Math.floor(box.clientHeight / rowH));
    var cols = Math.max(1, Math.ceil(n / per));
    box.style.columnCount = cols;
    if(cols >= 2){                       // 좁아진 칸에 맞춰 글자를 줄이고 다시 잰다
      box.classList.add('narrow');
      rowH = box.children[0].getBoundingClientRect().height + 3;
      per = Math.max(1, Math.floor(box.clientHeight / rowH));
      cols = Math.max(1, Math.ceil(n / per));
      box.style.columnCount = cols;
      if(cols < 2) box.classList.remove('narrow');
    }
    //  남는 세로 공간은 줄 간격으로 나눠 화면 하단까지 채운다
    var rows = Math.ceil(n / cols);
    var slack = box.clientHeight - rows * rowH;
    var pad = Math.max(0, Math.min(rowH * 0.55, slack / rows / 2));
    box.style.setProperty('--plpad', pad.toFixed(1)+'px');
  });
  el('swapB').onclick = function(){ g._swap = !g._swap; g._pick=[]; board(g); };
  el('okDef').onclick = function(){
    if(!g._pick.length) return toast('기여한 선수를 먼저 누르세요');
    var made = g._pick.map(function(sid){
      var r = {id:newId(), sid:sid, ts:stamp()}; g.defense.push(r); return r; });
    var n = g._pick.length; g._pick = [];
    made.forEach(function(r){ syncDF(S.cur, g, r); });
    syncState(S.cur, g); board(g);
    toast('수비 기여 '+n+'명 기록');
  };
  el('tgL').onclick = function(){ g._hl=!g._hl; board(g); };
  el('tgR').onclick = function(){ g._hr=!g._hr; board(g); };
  el('fsB').onclick = function(){
    document.body.classList.toggle('fs');
    if(document.body.classList.contains('fs') && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(function(){});
    else if(document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
  };
  el('pS').onclick = function(){ g._s=((g._s||0)+1)%3; save(); board(g); };
  el('pB').onclick = function(){ g._b=((g._b||0)+1)%4; save(); board(g); };
  el('clrB').onclick = function(){ g.bases=[null,null,null]; syncState(S.cur,g); board(g); toast('주자를 비웠습니다'); };
  el('undo').onclick = function(){
    if(!g.atbats.length) return toast('되돌릴 기록이 없습니다');
    var last = g.atbats.pop();
    if(last.run) (last.side==='H') ? g.hs-=last.run : g.as-=last.run;
    if(last.stBefore) g.st = last.stBefore;
    if(last.basesBefore) g.bases = last.basesBefore;
    g._s=0; g._b=0; g._pick=[];
    dropAB(S.cur, g, last.id);            // 배열 전체가 아니라 그 한 칸만 지운다
    syncState(S.cur,g); board(g); toast('한 타석 되돌림');
  };
  el('fin').onclick = function(){
    if(!confirm('경기를 종료할까요?')) return;
    g.status='done'; document.body.classList.remove('fs');
    ['_s','_b','_o','_pick','_swap'].forEach(function(k){ delete g[k]; });
    unwatch(); syncGameFull(S.cur,g); render(); toast('경기 #'+g.no+' 종료');
  };

  function swing(kind){
    if(!b) return;
    var before = g.bases.slice();
    var res = advance(g.bases, b.sid, kind);
    g.bases = res.bases;
    var scored = res.runs.length;

    var rec = {id:newId(), ts:stamp(), side:atk, sid:b.sid, name:b.name, kind:kind,
               result: (kind>=1&&kind<=4)?'H':'O', dup:!!b.dup,
               run:0, rbi:(kind===5?0:scored), inning:g.st.inning, half:g.st.half,
               stBefore:Object.assign({},g.st), basesBefore:before};
    g.atbats.push(rec);
    var touched=[];
    res.runs.forEach(function(sid){
      if(sid===b.sid){ rec.run+=1; }
      else for(var i=g.atbats.length-2;i>=0;i--){
        if(g.atbats[i].sid===sid){ g.atbats[i].run=(g.atbats[i].run||0)+1;
          if(touched.indexOf(i)<0) touched.push(i); break; }
      }
    });
    if(atk==='H') g.hs+=scored; else g.as+=scored;
    if(kind===0) g._o = Math.min(3,(g._o||0)+1);
    g._s=0; g._b=0; g._pick=[];
    g.st = nextState(g.st, order.length);
    /* 공수교대 — 주자·아웃 리셋. 교대 모드도 꺼서 다음 회에 헛눌리지 않게 한다 */
    if(g.st.idx===0){ g._o=0; g.bases=[null,null,null]; g._swap=false; }
    if(isGameOver(g.st, g.innings)){
      g.status='done'; document.body.classList.remove('fs');
      unwatch(); syncGameFull(S.cur,g); render(); toast('경기 종료'); return;
    }
    syncAB(S.cur, g, rec);                                  // 새 타석은 자기 칸에
    touched.forEach(function(i){ syncABRun(S.cur, g, g.atbats[i]); });  // 앞 타자는 run 만
    syncState(S.cur, g);
    board(g);
    if(kind===6) toast('야수선택 — 죽은 주자를 다이아몬드에서 눌러 지우세요');
    else if(scored) toast(b.name+' · '+scored+'점');
  }
}

/* 주자를 눌렀을 때 — 어디로 갔는지 고른다 */
function runnerPop(g, idx, sid){
  var d = document.createElement('div');
  d.className='pop';
  d.innerHTML = '<div class="popbox"><h4>'+esc(pName(g,sid))+'</h4>'+
    '<p>'+(idx+1)+'루 주자가 어디로 갔나요?</p>'+
    '<div class="popgrid">'+
      (idx<1?'<button data-to="1">2루</button>':'')+
      (idx<2?'<button data-to="2">3루</button>':'')+
      '<button data-to="H">홈 (득점)</button>'+
      '<button data-to="O">아웃</button>'+
      '<button data-to="X" style="grid-column:1/-1">취소</button>'+
    '</div></div>';
  document.body.appendChild(d);
  d.onclick = function(e){ if(e.target===d) d.remove(); };
  d.querySelectorAll('[data-to]').forEach(function(btn){
    btn.onclick = function(){
      var to = btn.dataset.to;
      if(to==='X'){ d.remove(); return; }
      g.bases[idx] = null;
      var hit = null;
      if(to==='H'){
        var side = g.st.half==='초' ? 'A' : 'H';
        if(side==='H') g.hs++; else g.as++;
        for(var i=g.atbats.length-1;i>=0;i--)
          if(g.atbats[i].sid===sid){ g.atbats[i].run=(g.atbats[i].run||0)+1; hit=g.atbats[i]; break; }
      } else if(to!=='O'){ g.bases[+to] = sid; }
      d.remove();
      if(hit) syncABRun(S.cur, g, hit);
      syncState(S.cur,g); board(g);
      toast(pName(g,sid)+' → '+(to==='H'?'득점':to==='O'?'아웃':(+to+1)+'루'));
    };
  });
}
/* 수비 교대 — 자리를 누르면 대기 선수 목록 */
function swapPop(g, side, posKey){
  var bench = benchOf(g, side), d = document.createElement('div');
  var P = POS.filter(function(x){return x.k===posKey;})[0];
  d.className='pop';
  d.innerHTML = '<div class="popbox"><h4>'+P.n+' 교체</h4>'+
    '<p>대기 '+bench.length+'명 · 누구를 넣을까요?</p>'+
    '<div class="popgrid">'+
      bench.map(function(p){ return '<button data-sid="'+p.sid+'">'+esc(p.name)+'</button>'; }).join('')+
      '<button data-sid="" style="grid-column:1/-1">취소</button>'+
    '</div></div>';
  document.body.appendChild(d);
  d.onclick = function(e){ if(e.target===d) d.remove(); };
  d.querySelectorAll('[data-sid]').forEach(function(btn){
    btn.onclick = function(){
      var sid = btn.dataset.sid;
      if(sid){ g.def[side][posKey] = sid; syncState(S.cur,g); toast(P.n+' → '+pName(g,sid)); }
      d.remove(); board(g);
    };
  });
}
function diamondHTML(g){
  var b = g.bases||[null,null,null];
  function nm(i){ return b[i] ? '<div class="rn r'+(i+1)+'">'+esc(pName(g,b[i]))+'</div>' : ''; }
  return '<div class="dia">'+
    '<div class="bs b2'+(b[1]?' on':'')+'" data-b="1"></div>'+
    '<div class="bs b1'+(b[0]?' on':'')+'" data-b="0"></div>'+
    '<div class="bs b3'+(b[2]?' on':'')+'" data-b="2"></div>'+
    '<div class="hp"></div>'+nm(0)+nm(1)+nm(2)+'</div>';
}
function defSide(g, atk){ return atk==='H' ? g.orderA : g.orderH; }
function nameOf(g, sid){
  var f = g.orderH.concat(g.orderA).filter(function(p){return p.sid===sid;})[0];
  return f ? f.name : sid;
}
/* 타순표 — 번호 · 포지션 · 이름 · 시즌 타율 */
function lineupHTML(order, g, side, atk, cum){
  var on = (side===atk), bs = g.bases||[];
  cum = cum || {};
  return order.map(function(p,i){
    var done = on && i < g.st.idx, now = on && i===g.st.idx;
    var onbase = bs.indexOf(p.sid)>=0;
    var pos = posOf(g, side, p.sid);
    var s = cum[p.sid];
    return '<div class="pl'+(now?' now':'')+(done?' done':'')+(onbase?' onbase':'')+'">'+
      '<span class="o">'+(i+1)+'</span>'+
      '<span class="ps'+(pos?'':' na')+'">'+(pos||'–')+'</span>'+
      '<span class="nm">'+esc(p.name)+(p.dup?'*':'')+'</span>'+
      '<span class="rs">'+(s && s.ab ? fmtAvg(s.avg) : '')+'</span></div>';
  }).join('');
}
function pickPlayer(order, cb){
  var names = order.map(function(p,i){ return (i+1)+'. '+p.name; }).join('\n');
  var v = prompt('수비 아웃에 관여한 선수 번호를 입력하세요\n\n'+names);
  if(!v) return;
  var i = parseInt(v,10)-1;
  if(isNaN(i) || !order[i]) return toast('번호가 올바르지 않습니다');
  cb(order[i].sid);
}
function allAtbats(c){ return c.games.reduce(function(a,g){ return a.concat(g.atbats||[]); },[]); }
function allDefense(c){ return c.games.reduce(function(a,g){ return a.concat(g.defense||[]); },[]); }
function inningMap(c){
  var m = {};
  c.games.filter(function(g){return g.status==='done';}).forEach(function(g){
    var played = Math.min(g.innings, Math.max(1, g.st.inning - (g.st.half==='초'?1:0)));
    var seen = {};
    g.orderH.concat(g.orderA).forEach(function(p){
      if(seen[p.sid]) return; seen[p.sid]=1;
      if(!m[p.sid]) m[p.sid] = {inn:0, g:0};
      m[p.sid].inn += played; m[p.sid].g += 1;
    });
  });
  return m;
}

/* ── 탁구 ─────────────────────────────── */
/* 평가계획서의 척도 그대로 (2026-2학기 스포츠 생활2)
   포핸드 20점 : 9개↑ 20 / 7~8 16 / 5~6 12 / 3~4 8 / 2개↓ 4
   백핸드 Ⓐ 15점 : 9개↑ 15 / 7~8 12 / 5~6 9 / 3~4 6 / 2개↓ 4
   백핸드 영역 = Ⓐ + 태도카드(1장 1점, 최대 5장), 영역 만점 20점을 넘지 못한다 */
function ttFH(n){
  if(n==null || n==='') return null;
  n = +n; return n>=9?20 : n>=7?16 : n>=5?12 : n>=3?8 : 4;
}
function ttBH(n){
  if(n==null || n==='') return null;
  n = +n; return n>=9?15 : n>=7?12 : n>=5?9 : n>=3?6 : 4;
}
function ttBHArea(bh, card){
  var a = ttBH(bh);
  if(a==null) return null;                       // 백핸드를 아직 안 쟀으면 영역 점수도 없다
  return Math.min(20, a + Math.max(0, Math.min(5, +card || 0)));
}
function vTT(){
  if(!S.cur) return needClass('v-tt');
  var c = cls();
  function cells(s){
    var t = c.tt[s.sid] || {};
    var f = ttFH(t.fh), a = ttBHArea(t.bh, t.card);
    return {f: f==null?'—':f, a: a==null?'—':a,
            sum: (f==null && a==null) ? '—' : ((f||0)+(a||0))};
  }
  el('v-tt').innerHTML =
    '<h2 class="t">'+esc(S.cur)+' 탁구</h2>'+
    '<p class="st">10구 중 성공 횟수를 넣으면 <b>옆 칸에 점수가 바로 계산</b>됩니다 · '+
    '포핸드 20점 + 백핸드 영역 20점 = 40점</p>'+
    '<div class="card">'+
    (c.roster.length ?
      '<div style="overflow-x:auto"><table><tr><th>번호</th><th>이름</th>'+
      '<th class="n">포핸드</th><th class="n">점수</th>'+
      '<th class="n">백핸드</th><th class="n">태도카드</th><th class="n">백핸드 영역</th>'+
      '<th class="n">합계</th></tr>'+
      c.roster.map(function(s){
        var t = c.tt[s.sid] || {}, v = cells(s);
        function inp(k, mx){
          return '<td class="n"><input type="number" min="0" max="'+mx+'" style="width:62px;text-align:right" '+
                 'data-tt="'+k+'" data-s="'+s.sid+'" value="'+(t[k]!=null?t[k]:'')+'"></td>';
        }
        return '<tr><td>'+esc(s.num)+'</td><td>'+esc(s.name)+'</td>'+
          inp('fh',10)+
          '<td class="n sc" id="scF_'+s.sid+'">'+v.f+'</td>'+
          inp('bh',10)+ inp('card',5)+
          '<td class="n sc" id="scA_'+s.sid+'">'+v.a+'</td>'+
          '<td class="n sc tot" id="scT_'+s.sid+'">'+v.sum+'</td></tr>';
      }).join('')+'</table></div>'
      : '<div class="msg">명단이 없습니다</div>')+
    '<p class="st" style="margin:11px 0 0">참여한 학생의 최하점은 두 영역 모두 <b>4점</b>입니다. '+
    '태도카드는 백핸드 점수에 더해지되 영역 만점 20점을 넘지 않습니다.</p></div>';

  /* 입력하는 즉시 옆 칸 점수를 고쳐 준다 (화면을 다시 그리면 입력칸에서 커서가 튄다) */
  function repaint(sid){
    var s = {sid:sid}, v = cells(s);
    var f = el('scF_'+sid), a = el('scA_'+sid), tt = el('scT_'+sid);
    if(f) f.textContent = v.f;
    if(a) a.textContent = v.a;
    if(tt) tt.textContent = v.sum;
  }
  el('v-tt').querySelectorAll('[data-tt]').forEach(function(i){
    function apply(){
      var sid = i.dataset.s;
      c.tt[sid] = c.tt[sid] || {};
      c.tt[sid][i.dataset.tt] = i.value===''? null : +i.value;
      repaint(sid);
    }
    i.oninput  = function(){ apply(); save(); };          // 치는 동안엔 화면만
    i.onchange = function(){ apply(); syncMisc(S.cur,'tt'); };  // 칸을 벗어날 때 올린다
  });
}

/* ── 부문별 순위 ───────────────────────────
   평가 점수와는 무관하다. 평가에 쓰는 건 타율과 이닝당 기여도뿐이고,
   여기 나머지 기록은 학생들이 자기 기록을 재미있게 보라고 넣은 것이다.
   비율 기록(타율·출루율·장타율·OPS)은 타수가 적으면 쉽게 1등이 되어 버리므로
   최소 타수를 채운 학생만 순위에 넣는다. */
var LB_MIN_AB = 3;
var LB_SHOW = 5;                                    // 카드 한 장에 최대 몇 줄까지 보여줄지
function topN(list, key, n){
  var v = list.slice().sort(function(a,b){
    return b[key]-a[key] || (String(a.num) < String(b.num) ? -1 : 1); });
  var out = [], rank = 0, prev = null, more = 0;
  for(var i=0;i<v.length;i++){
    if(!(v[i][key] > 0)) break;                     // 0 인 기록은 순위에 넣지 않는다
    if(prev===null || v[i][key] !== prev){ rank = i+1; prev = v[i][key]; }
    if(rank > n) break;
    if(out.length >= LB_SHOW){ more++; continue; }  // 공동 순위가 많으면 「외 N명」으로 접는다
    out.push({rank:rank, row:v[i]});
  }
  return {list:out, more:more};
}
function leaderHTML(rows){
  if(!rows.length) return '';
  var qual = rows.filter(function(x){ return x.ab >= LB_MIN_AB; });      // 비율 기록 자격
  var innd = rows.filter(function(x){ return x.inn > 0; });
  var i3 = function(v){ return String(v); };
  var CATS = [
    {t:'타율',        k:'avg',     src:qual, fmt:fmtAvg, cls:'rate', note:'타수 '+LB_MIN_AB+'↑'},
    {t:'최다 안타',   k:'h',       src:rows, fmt:i3},
    {t:'홈런',        k:'hr',      src:rows, fmt:i3},
    {t:'타점',        k:'rbi',     src:rows, fmt:i3},
    {t:'출루율',      k:'obp',     src:qual, fmt:fmtAvg, cls:'rate', note:'타수 '+LB_MIN_AB+'↑'},
    {t:'장타율',      k:'slg',     src:qual, fmt:fmtAvg, cls:'rate', note:'타수 '+LB_MIN_AB+'↑'},
    {t:'OPS',         k:'ops',     src:qual, fmt:fmtAvg, cls:'rate', note:'출루율+장타율'},
    {t:'득점',        k:'r',       src:rows, fmt:i3},
    {t:'수비 아웃',   k:'dOut',    src:rows, fmt:i3,     cls:'def'},
    {t:'이닝당 기여', k:'contrib', src:innd, fmt:function(v){return v.toFixed(2);}, cls:'def', note:'평가 반영'}
  ];
  var cards = CATS.map(function(C){
    var t = topN(C.src, C.k, 3);
    return '<div class="lb '+(C.cls||'')+'"><h4>'+C.t+
      (C.note ? '<em>'+C.note+'</em>' : '')+'</h4>'+
      (t.list.length ? '<ol>'+t.list.map(function(e){
          return '<li'+(e.rank===1?' class="top"':'')+'><span class="rk">'+e.rank+'</span>'+
            '<span class="nm">'+esc(e.row.name)+'</span>'+
            '<span class="vl">'+C.fmt(e.row[C.k])+'</span></li>';
        }).join('')+'</ol>'+
        (t.more ? '<div class="none">공동 순위 외 '+t.more+'명</div>' : '')
      : '<div class="none">아직 기록 없음</div>')+'</div>';
  }).join('');
  return '<div class="card"><h3>부문별 순위</h3><div class="lbg">'+cards+'</div>'+
    '<p class="lbnote">※ 성적 평가에 들어가는 것은 <b>타율</b>과 <b>이닝당 기여도</b>뿐입니다. '+
    '나머지 부문은 자기 기록을 돌아보라고 보여 주는 참고 기록입니다.</p></div>';
}

/* ── 기록실 ───────────────────────────── */
function vStats(){
  if(!S.cur) return needClass('v-stats');
  var c = cls();
  var t = tally(allAtbats(c), allDefense(c), inningMap(c));
  var ZERO = {ab:0,bb:0,h:0,h2:0,h3:0,hr:0,tb:0,xbh:0,r:0,rbi:0,dOut:0,inn:0,g:0,
              avg:0,slg:0,obp:0,ops:0,contrib:0};
  var rows = c.roster.map(function(s){ return Object.assign({num:s.num,name:s.name,gender:s.gender,group:s.group||'A'}, ZERO, t[s.sid]||{}); });
  rows.sort(function(a,b){ return b.avg-a.avg || b.h-a.h; });

  el('v-stats').innerHTML =
    '<h2 class="t">'+esc(S.cur)+' 기록실</h2>'+
    '<p class="st">경기 '+c.games.filter(function(g){return g.status==='done';}).length+'개 누적 · 타율순</p>'+
    leaderHTML(rows)+
    '<div class="card"><div class="row" style="margin-bottom:11px">'+
      '<button class="btn pri" id="exp">구글시트로 내보내기</button>'+
      '<button class="btn" id="csv">CSV 내려받기</button></div>'+
    (rows.length ?
      '<div style="overflow-x:auto"><table><tr><th>번호</th><th>이름</th><th class="n">경기</th><th class="n">이닝</th>'+
      '<th class="n">타수</th><th class="n">안타</th><th class="n">2루타</th><th class="n">3루타</th>'+
      '<th class="n">홈런</th><th class="n">볼넷</th><th class="n">타율</th>'+
      '<th class="n">출루율</th><th class="n">장타율</th><th class="n">OPS</th>'+
      '<th class="n">득점</th><th class="n">타점</th><th class="n">수비</th><th class="n">이닝당 기여</th></tr>'+
      rows.map(function(x){
        return '<tr><td>'+esc(x.num)+'</td><td>'+esc(x.name)+'</td>'+
          '<td class="n">'+x.g+'</td><td class="n">'+x.inn+'</td>'+
          '<td class="n">'+x.ab+'</td><td class="n">'+x.h+'</td>'+
          '<td class="n">'+x.h2+'</td><td class="n">'+x.h3+'</td><td class="n">'+x.hr+'</td>'+
          '<td class="n">'+x.bb+'</td>'+
          '<td class="n"><b>'+fmtAvg(x.avg)+'</b></td>'+
          '<td class="n">'+fmtAvg(x.obp)+'</td><td class="n">'+fmtAvg(x.slg)+'</td>'+
          '<td class="n">'+fmtAvg(x.ops)+'</td>'+
          '<td class="n">'+x.r+'</td><td class="n">'+x.rbi+'</td><td class="n">'+x.dOut+'</td>'+
          '<td class="n"><b>'+x.contrib.toFixed(2)+'</b></td></tr>';
      }).join('')+'</table></div>'
      : '<div class="msg">기록이 없습니다</div>')+'</div>';

  function tableData(){
    return rows.map(function(x){
      var tt = c.tt[ (c.roster.filter(function(s){return s.name===x.name;})[0]||{}).sid ] || {};
      var rp = c.rep[ (c.roster.filter(function(s){return s.name===x.name;})[0]||{}).sid ] || {};
      var repN = [0,1,2,3,4].filter(function(i){return rp['i'+i];}).length;
      return [x.num, x.name, x.gender, x.group, x.g, x.inn, x.ab, x.h, fmtAvg(x.avg),
              x.r, x.rbi, x.dOut, x.contrib.toFixed(2),
              tt.fh==null?'':tt.fh, tt.bh==null?'':tt.bh, tt.card==null?'':tt.card, repN];
    });
  }
  var HDR = ['번호','이름','성별','조','경기','이닝','타수','안타','타율','득점','타점','수비아웃',
             '이닝당기여','탁구포핸드','탁구백핸드','태도카드','보고서충족'];
  /* CSV 는 새 기록(2·3루타·홈런·출루율·장타율·OPS)까지 전부 넣는다.
     구글시트는 평가 산출물이라 예전 17열 그대로 둔다 — 시트 양식·Apps Script 를
     건드리지 않기 위해서다. */
  var CHDR = HDR.slice(0,8).concat(['2루타','3루타','홈런','볼넷','타율','출루율','장타율','OPS'],
                                   HDR.slice(9));
  function csvData(){
    return rows.map(function(x){
      var sid = (c.roster.filter(function(s){return s.name===x.name;})[0]||{}).sid;
      var tt = c.tt[sid] || {}, rp = c.rep[sid] || {};
      var repN = [0,1,2,3,4].filter(function(i){return rp['i'+i];}).length;
      return [x.num, x.name, x.gender, x.group, x.g, x.inn, x.ab, x.h,
              x.h2, x.h3, x.hr, x.bb,
              fmtAvg(x.avg), fmtAvg(x.obp), fmtAvg(x.slg), fmtAvg(x.ops),
              x.r, x.rbi, x.dOut, x.contrib.toFixed(2),
              tt.fh==null?'':tt.fh, tt.bh==null?'':tt.bh, tt.card==null?'':tt.card, repN];
    });
  }
  el('csv').onclick = function(){
    var csv = [CHDR].concat(csvData()).map(function(r){
      return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv'}));
    a.download = S.cur+'_야구기록.csv'; a.click();
  };
  el('exp').onclick = function(){
    var rows = tableData();
    toast('내보내는 중…');
    //  POST 는 no-cors 라 응답을 못 읽는다 → 보낸 뒤 실제로 들어갔는지 세어서 확인한다
    gasPost('saveBaseball', {cn:S.cur, header:HDR, rows:rows})
      .then(function(){ return new Promise(function(r){ setTimeout(r, 1500); }); })
      .then(function(){ return jsonp({action:'getCount', cn:S.cur}); })
      .then(function(r){
        if(r && r.ok && r.count >= rows.length) toast('「'+S.cur+'」 탭에 '+rows.length+'명 저장 완료');
        else if(r && r.ok) toast('「'+S.cur+'」 탭 '+r.count+'행 확인 (보낸 건 '+rows.length+'행)');
        else toast('보내긴 했지만 확인 실패 — 시트를 직접 봐 주세요');
      })
      .catch(function(e){ toast('실패: '+e.message); });
  };
}
