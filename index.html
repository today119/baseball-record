function paCount(c){
  var m={};
  c.games.forEach(function(g){ (g.atbats||[]).forEach(function(a){ m[a.sid]=(m[a.sid]||0)+1; }); });
  return m;
}

function startGame(mode){
  var c = cls();
  var innings = +((el('inn')||{}).value || 2);
  var hp, ap, hname, aname, oppClass=null, oppCount=0;

  if(mode==='intra'){
    hp = c.roster.filter(function(s){return s.group==='A';});
    ap = c.roster.filter(function(s){return s.group==='B';});
    hname='A조'; aname='B조';
    if(!hp.length || !ap.length) return toast('A조와 B조 모두 인원이 있어야 합니다');
  }else{
    var opp = el('opp') ? el('opp').value : '';
    hp = c.roster; hname = S.cur; aname = opp || '상대';
    var oc = S.classes[opp];
    if(oc && oc.roster && oc.roster.length){ ap = oc.roster; oppClass = opp; }
    else{ ap = []; oppCount = Math.max(1, +(el('oppN')||{}).value || hp.length); }
  }

  var g = {
    no: (c.games.reduce(function(m,x){return Math.max(m,x.no);},0))+1,
    mode:mode, innings:innings, home:hname, away:aname, oppClass:oppClass, oppCount:oppCount,
    hs:0, as:0, status:'lineup', st:{inning:1, half:'초', idx:0},
    first: ((el('first')||{}).value==='A') ? 'A' : 'H',
    seqH: hp.map(function(p){return p.sid;}), seqA: ap.map(function(p){return p.sid;}),
    outH: [], outA: [],
    orderH:[], orderA:[], atbats:[], defense:[], bases:[null,null,null],
    date: new Date().toISOString().slice(0,10)
  };
  c.games.push(g); save(); render();
}

/* 학생 찾기 — 우리 학급 + (학급대항이면) 상대 학급 명단에서 */
function findP(g, sid){
  var pool = cls().roster.slice();
  if(g.oppClass && S.classes[g.oppClass]) pool = pool.concat(S.classes[g.oppClass].roster);
  return pool.filter(function(p){return p.sid===sid;})[0];
}
function activeCount(g, side){
  var seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
  if(side==='A' && !seq.length) return g.oppCount||0;
  return seq.filter(function(sid){ return out.indexOf(sid)<0; }).length;
}

/* ── 당일 라인업·타순 짜기 ─────────────────── */
function lineupView(g){
  var nH = activeCount(g,'H'), nA = activeCount(g,'A');
  var target = Math.max(nH, nA);
  var dupH = Math.max(0, target-nH), dupA = Math.max(0, target-nA);

  function col(side, name){
    var seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
    var dup = side==='H'?dupH:dupA;
    if(side==='A' && !seq.length){
      return '<div class="card"><h3>'+esc(name)+' <span class="tag">명단 없음</span></h3>'+
        '<label style="font-size:11.5px;color:var(--tx3)">오늘 출전 인원수</label>'+
        '<input type="number" min="1" max="40" id="oppCnt" value="'+(g.oppCount||9)+'">'+
        '<p class="st" style="margin:9px 0 0">상대 학급 명단이 없어 인원수로만 진행합니다.</p></div>';
    }
    var live = seq.filter(function(sid){return out.indexOf(sid)<0;}).length;
    var placed = Object.keys((g.def||{})[side]||{}).length;
    return '<div class="card"><h3>'+esc(name)+' · 출전 <b style="color:var(--warn)">'+live+'명</b>'+
      (dup ? ' <span class="tag dup">중복 '+dup+'</span>' : '')+
      ' <span class="tag">수비 '+placed+'/9</span></h3>'+
      '<div class="row" style="margin-bottom:9px">'+
        '<button class="btn sm" data-all="'+side+'">전원 체크</button>'+
        '<button class="btn sm" data-mix="'+side+'">남녀 교차</button>'+
        '<button class="btn sm" data-auto="'+side+'">빈 자리 자동 채우기</button>'+
        '<button class="btn sm dn" data-clrp="'+side+'">수비 비우기</button></div>'+
      '<table>'+seq.map(function(sid,i){
        var p = findP(g,sid); if(!p) return '';
        var on = out.indexOf(sid)<0;
        return '<tr'+(on?'':' style="opacity:.38"')+'>'+
          '<td style="width:26px"><input type="checkbox" style="width:auto" data-ck="'+side+'" data-sid="'+sid+'"'+(on?' checked':'')+'></td>'+
          '<td style="width:24px;color:var(--tx3)">'+(i+1)+'</td>'+
          '<td>'+esc(p.name)+'</td>'+
          '<td style="width:32px"><span class="tag '+(p.gender==='남'?'m':'f')+'">'+esc(p.gender)+'</span></td>'+
          '<td style="width:96px"><select data-pos="'+side+'" data-sid="'+sid+'"'+(on?'':' disabled')+'>'+
            posOptions(g, side, sid)+
            '</select></td>'+
          '<td class="n" style="width:76px">'+
            '<button class="btn sm" data-mv="'+side+':'+i+':-1">▲</button> '+
            '<button class="btn sm" data-mv="'+side+':'+i+':1">▼</button></td></tr>';
      }).join('')+'</table>'+
      '<p class="st" style="margin:9px 0 0">포지션은 <b>그날그날 바꾸는 것</b>이라 여기서 정합니다. '+
      '<b>이미 찬 자리는 목록에 안 나옵니다</b> — 남은 자리만 고르면 됩니다. '+
      '비워 두면 경기 시작할 때 타순대로 채워지고, 경기가 시작된 뒤에는 <b>[경기 세팅]</b>에서 바꿉니다.</p></div>';
  }

  el('v-game').innerHTML =
    '<h2 class="t">'+gLabel(g)+' 라인업</h2>'+
    '<p class="st">오늘 안 나온 학생은 <b>체크를 끄세요.</b> ▲▼ 로 타순을 바꿉니다.</p>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(288px,1fr))">'+
      col('H', g.home)+col('A', g.away)+'</div>'+
    (dupH||dupA ?
      '<div class="card" style="border-color:var(--warn)"><h3 style="color:var(--warn)">인원이 다릅니다</h3>'+
      '<p class="st" style="margin:0">'+esc(dupH?g.home:g.away)+'에 <b>중복 타자 '+(dupH||dupA)+'명</b>이 붙어 '+
      '양 팀 모두 <b>'+target+'타석</b>이 됩니다. 남녀 비율은 유지되고 타석 수가 적은 학생부터 뽑힙니다.</p></div>'
      : '<div class="card"><p class="st" style="margin:0">양 팀 <b>'+target+'명</b>으로 인원이 같습니다.</p></div>')+
    '<div class="row"><button class="btn pri" id="goGame" style="flex:1;justify-content:center;padding:14px;font-size:15px">경기 시작</button>'+
    '<button class="btn dn" id="cancelG">취소</button></div>';

  el('v-game').querySelectorAll('[data-ck]').forEach(function(cb){
    cb.onchange = function(){
      var side=cb.dataset.ck, sid=cb.dataset.sid, out = side==='H'?g.outH:g.outA;
      var i = out.indexOf(sid);
      if(cb.checked){ if(i>=0) out.splice(i,1); } else if(i<0) out.push(sid);
      save(); lineupView(g);
    };
  });
  el('v-game').querySelectorAll('[data-mv]').forEach(function(b){
    b.onclick = function(){
      var q = b.dataset.mv.split(':'), seq = q[0]==='H'?g.seqH:g.seqA;
      var i = +q[1], j = i + (+q[2]);
      if(j<0 || j>=seq.length) return;
      var t = seq[i]; seq[i]=seq[j]; seq[j]=t;
      save(); lineupView(g);
    };
  });
  el('v-game').querySelectorAll('[data-all]').forEach(function(b){
    b.onclick = function(){ if(b.dataset.all==='H') g.outH=[]; else g.outA=[]; save(); lineupView(g); };
  });
  /* 포지션 지정 — 이미 차 있는 자리를 고르면 원래 있던 학생이 대기로 밀린다 */
  el('v-game').querySelectorAll('[data-pos]').forEach(function(sel){
    sel.onchange = function(){
      var side = sel.dataset.pos, sid = sel.dataset.sid;
      var kicked = setPos(g, side, sid, sel.value);
      save(); lineupView(g);
      if(kicked){ var kp = findP(g,kicked); toast((kp?kp.name:'앞 선수')+' → 대기로 밀렸습니다'); }
    };
  });
  el('v-game').querySelectorAll('[data-auto]').forEach(function(b){
    b.onclick = function(){
      var side = b.dataset.auto, seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
      g.def = g.def || {}; g.def[side] = g.def[side] || {};
      var m = g.def[side], taken = {};
      Object.keys(m).forEach(function(k){ taken[m[k]] = 1; });
      var rest = seq.filter(function(sid){ return out.indexOf(sid)<0 && !taken[sid]; }), i = 0;
      POS.forEach(function(P){ if(!m[P.k] && rest[i]) m[P.k] = rest[i++]; });
      save(); lineupView(g); toast(i+'명을 빈 자리에 세웠습니다');
    };
  });
  el('v-game').querySelectorAll('[data-clrp]').forEach(function(b){
    b.onclick = function(){
      g.def = g.def || {}; g.def[b.dataset.clrp] = {};
      save(); lineupView(g); toast('수비 배치를 비웠습니다');
    };
  });
  el('v-game').querySelectorAll('[data-mix]').forEach(function(b){
    b.onclick = function(){
      var side=b.dataset.mix, seq = side==='H'?g.seqH:g.seqA, M=[], F=[];
      seq.forEach(function(sid){ var p=findP(g,sid); if(!p) return; (p.gender==='남'?M:F).push(sid); });
      var mixed=[], i=0, j=0;
      while(i<M.length || j<F.length){ if(i<M.length) mixed.push(M[i++]); if(j<F.length) mixed.push(F[j++]); }
      if(side==='H') g.seqH=mixed; else g.seqA=mixed;
      save(); lineupView(g); toast('남녀 교차로 타순을 짰습니다');
    };
  });
  if(el('oppCnt')) el('oppCnt').onchange = function(){
    g.oppCount = Math.max(1, +el('oppCnt').value||9); save(); lineupView(g);
  };
  el('cancelG').onclick = function(){
    if(!confirm('이 경기를 취소할까요?')) return;
    var c=cls(); c.games = c.games.filter(function(x){ return x.no!==g.no; });
    save(); render();
  };
  el('goGame').onclick = function(){ confirmLineup(g); };
}

function confirmLineup(g){
  var c = cls(), pa = paCount(c);
  function build(side){
    var seq = side==='H'?g.seqH:g.seqA, out = side==='H'?g.outH:g.outA;
    if(side==='A' && !seq.length){
      var n = g.oppCount||9, arr=[];
      for(var i=0;i<n;i++) arr.push({sid:'opp'+g.no+'_'+i, num:String(i+1),
                                     name:'상대'+(i+1), gender: i%2?'여':'남', pa:0});
      return arr;
    }
    return seq.filter(function(sid){ return out.indexOf(sid)<0; })
      .map(function(sid){ var p=findP(g,sid);
        return p ? Object.assign({}, p, {pa: pa[sid]||0}) : null; }).filter(Boolean);
  }
  var hp = build('H'), ap = build('A');
  if(!hp.length || !ap.length) return toast('양 팀 모두 한 명 이상 출전해야 합니다');
  var target = Math.max(hp.length, ap.length);
  g.orderH = buildOrder(hp, target);
  g.orderA = buildOrder(ap, target);
  g.status = 'live';
  autoPos(g,'H'); autoPos(g,'A');       // 라인업에서 안 채운 자리는 타순대로
  syncGameFull(S.cur, g);
  render();
  toast('경기 시작 · 양 팀 '+target+'타석');
}


/* ── 경기 세팅 (경기 중 타순·수비 위치 고치기) ──────────────
   ★ 라인업 화면처럼 타순을 「다시 만들지」 않는다. orderH/orderA 를 그 자리에서 바꾼다.
     다시 만들면 지금 타자(st.idx)가 엉뚱한 사람을 가리키게 되기 때문이다.
     지금 타자는 자리를 위아래로 옮겨도 계속 「지금 타자」로 따라간다. */
function setupView(g){
  var atk = atkSide(g);

  function col(side, name){
    var order = side==='H' ? g.orderH : g.orderA;
    var taken = (g.def||{})[side] || {};
    var cur = (side===atk) ? order[g.st.idx] : null;
    if(!order.length) return '<div class="card"><h3>'+esc(name)+'</h3><div class="msg">타순이 없습니다</div></div>';
    return '<div class="card"><h3>'+esc(name)+' · '+order.length+'타석'+
      ' <span class="tag">수비 '+Object.keys(taken).length+'/9</span></h3>'+
      '<div class="row" style="margin-bottom:9px">'+
        '<button class="btn sm" data-sauto="'+side+'">빈 자리 자동 채우기</button>'+
        '<button class="btn sm dn" data-sclr="'+side+'">수비 비우기</button></div>'+
      '<table>'+order.map(function(pp,i){
        var isNow = (pp===cur);
        return '<tr'+(isNow?' style="background:rgba(224,163,60,.13)"':'')+'>'+
          '<td style="width:24px;color:var(--tx3)">'+(i+1)+'</td>'+
          '<td>'+esc(pp.name)+
            (pp.dup?' <span class="tag dup">중복</span>':'')+
            (isNow?' <span class="tag" style="background:var(--warn);color:#241a05">지금 타자</span>':'')+'</td>'+
          '<td style="width:104px"><select data-sp="'+side+'" data-si="'+i+'">'+
            posOptions(g, side, pp.sid)+'</select></td>'+
          '<td class="n" style="width:76px">'+
            '<button class="btn sm" data-sm="'+side+':'+i+':-1">▲</button> '+
            '<button class="btn sm" data-sm="'+side+':'+i+':1">▼</button></td></tr>';
      }).join('')+'</table></div>';
  }

  el('v-game').innerHTML =
    '<div class="row" style="margin-bottom:9px;justify-content:space-between">'+
      '<div><h2 class="t">'+gLabel(g)+' 세팅</h2>'+
      '<p class="st" style="margin:0">타순은 ▲▼ 로, 수비는 오른쪽에서 고릅니다 · '+
      '<b>이미 찬 자리는 목록에 안 나옵니다</b></p></div>'+
      '<div class="row" style="align-items:flex-end">'+
        '<div><label style="font-size:11.5px;color:var(--tx3)">경기 날짜</label>'+
        '<input type="date" id="gDt" value="'+esc(g.date||'')+'" style="width:154px"></div>'+
      ((g.atbats||[]).length ? '' : '<button class="btn" id="swFirst">선공 바꾸기 (지금: '+esc(firstSide(g)==='H'?g.home:g.away)+')</button>')+
      '<button class="btn pri" id="setDone">경기로 돌아가기</button></div></div>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(288px,1fr))">'+
      col(firstSide(g), firstSide(g)==='H'?g.home+' (선공)':g.away+' (선공)')+
      col(otherSide(firstSide(g)), firstSide(g)==='H'?g.away+' (후공)':g.home+' (후공)')+'</div>'+
    '<div class="card"><p class="st" style="margin:0">'+
      '타순을 바꿔도 <b>지금 타자는 그대로 따라갑니다</b> — 순서만 바뀌고 차례를 건너뛰지 않습니다.<br>'+
      '이미 기록한 타석은 그대로 남습니다.</p></div>';

  /* 타순 위아래 — 지금 타자를 놓치지 않게 「사람」을 기억했다가 자리를 다시 찾는다 */
  el('v-game').querySelectorAll('[data-sm]').forEach(function(b){
    b.onclick = function(){
      var q = b.dataset.sm.split(':'), side = q[0];
      var order = side==='H' ? g.orderH : g.orderA;
      var i = +q[1], j = i + (+q[2]);
      if(j<0 || j>=order.length) return;
      var keep = (side===atk) ? order[g.st.idx] : null;
      var t = order[i]; order[i] = order[j]; order[j] = t;
      if(keep){ var k = order.indexOf(keep); if(k>=0) g.st.idx = k; }
      syncOrder(S.cur, g); setupView(g);
    };
  });
  /* 수비 자리 — 이미 찬 자리는 목록에 없으므로 밀려나는 사람도 안 생긴다 */
  el('v-game').querySelectorAll('[data-sp]').forEach(function(sel){
    sel.onchange = function(){
      var side = sel.dataset.sp;
      var order = side==='H' ? g.orderH : g.orderA;
      var pp = order[+sel.dataset.si]; if(!pp) return;
      setPos(g, side, pp.sid, sel.value);
      syncState(S.cur, g); setupView(g);
      toast(pp.name+' → '+(sel.value ? (POS.filter(function(P){return P.k===sel.value;})[0]||{}).n : '대기'));
    };
  });
  el('v-game').querySelectorAll('[data-sauto]').forEach(function(b){
    b.onclick = function(){
      var n = autoPos(g, b.dataset.sauto);
      syncState(S.cur, g); setupView(g); toast(n+'명을 빈 자리에 세웠습니다');
    };
  });
  el('v-game').querySelectorAll('[data-sclr]').forEach(function(b){
    b.onclick = function(){
      g.def = g.def || {}; g.def[b.dataset.sclr] = {};
      syncState(S.cur, g); setupView(g); toast('수비 배치를 비웠습니다');
    };
  });
  if(el('gDt')) el('gDt').onchange = function(){
    g.date = el('gDt').value || g.date;
    syncOrder(S.cur, g);            // 날짜는 meta 라 같은 경로로 올라간다
    setupView(g); toast('경기 날짜를 '+(gDate(g)||g.date)+'로 바꿨습니다');
  };
  el('setDone').onclick = function(){ delete g._setup; save(); render(); };
  /* 첫 타석 전에만 — 기록이 생긴 뒤 바꾸면 이닝 칸이 뒤섞인다 */
  if(el('swFirst')) el('swFirst').onclick = function(){
    g.first = otherSide(firstSide(g)); g.st = {inning:1, half:'초', idx:0};
    syncState(S.cur, g); setupView(g); toast('선공을 바꿨습니다');
  };
}

/* ── 전광판 ─────────────────────────────── */
/* z:'of' = 외야수(파란 배지), 나머지는 내야수(주황 배지) */
var POS = [
  {k:'CF', n:'중견수', x:50, y:13, z:'of'},
  {k:'LF', n:'좌익수', x:17, y:26, z:'of'},
  {k:'RF', n:'우익수', x:83, y:26, z:'of'},
  {k:'SS', n:'유격수', x:36, y:45},
  {k:'2B', n:'2루수', x:64, y:45},
  {k:'3B', n:'3루수', x:23, y:55},
  {k:'1B', n:'1루수', x:77, y:55},
  {k:'P',  n:'투수',   x:50, y:63},
  {k:'C',  n:'포수',   x:50, y:92}
];
/* 경기 이름에 날짜를 같이 보여준다 — 「경기 #3」만으로는 언제 한 경기인지 모른다 */
function gDate(g){
  if(!g || !g.date) return '';
  var t = new Date(g.date + 'T00:00:00');
  if(isNaN(t.getTime())) return g.date;
  var W = ['일','월','화','수','목','금','토'];
  return (t.getMonth()+1) + '월 ' + t.getDate() + '일(' + W[t.getDay()] + ')';
}
function gLabel(g){
  var d = gDate(g);
  return '경기 #' + g.no + (d ? ' · ' + d : '');
}

/* 그 학생이 고를 수 있는 자리 — 남이 이미 차지한 자리는 목록에서 뺀다.
   (자기가 지금 맡은 자리는 남겨야 드롭다운에 표시된다) */
function freePos(g, side, sid){
  var taken = (g.def||{})[side] || {};
  return POS.filter(function(P){ return !taken[P.k] || taken[P.k]===sid; });
}
function posOptions(g, side, sid){
  var pos = posOf(g, side, sid);
  return '<option value=""'+(pos?'':' selected')+'>대기</option>'+
    freePos(g, side, sid).map(function(P){
      return '<option value="'+P.k+'"'+(pos===P.k?' selected':'')+'>'+esc(P.n)+'</option>';
    }).join('');
}

/* 수비 배치 — 없으면 타순 앞 9명을 자동으로 세운다 */
function defOf(g, side){
  g.def = g.def || {};
  if(!g.def[side]){
    var order = side==='H' ? g.orderH : g.orderA, m = {}, seen = {};
    var pool = order.filter(function(p){ if(seen[p.sid]) return false; seen[p.sid]=1; return true; });
    POS.forEach(function(P,i){ if(pool[i]) m[P.k] = pool[i].sid; });
    g.def[side] = m;
  }
  return g.def[side];
}
function benchOf(g, side){
  var d = defOf(g, side), on = {};
  Object.keys(d).forEach(function(k){ on[d[k]] = 1; });
  var order = side==='H' ? g.orderH : g.orderA, seen = {};
  return order.filter(function(p){
    if(seen[p.sid] || on[p.sid]) return false; seen[p.sid]=1; return true; });
}
function pName(g, sid){
  var f = g.orderH.concat(g.orderA).filter(function(p){return p.sid===sid;})[0];
  return f ? f.name : '';
}
/* 야구장 그림 — 그림이 칸을 꽉 채우도록 세로를 78 로 잡은 좌표계.
   홈(50,66) 에서 90도로 펼쳐진 부채꼴, 베이스 간격 34.
   1루(74,42) 2루(50,18) 3루(26,42) 이 되고 파울선 끝이 칸의 좌우 끝에 닿는다. */
function fieldSVG(){
  return '<svg class="fbg" viewBox="0 0 100 78" preserveAspectRatio="none">'+
    /* 색은 CSS(.fbg .og/.dt/.ig)에서 — 밝은/어두운 화면 공통으로 맑은 잔디색 */
    '<defs><linearGradient id="fgOg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cae6a"/><stop offset="1" stop-color="#2f8a4e"/></linearGradient></defs>'+
    /* 외야 잔디 */
    '<path class="og" d="M50,66 L3.3,19.3 A66,66 0 0,1 96.7,19.3 Z" fill="url(#fgOg)"/>'+
    /* 내야 흙 */
    '<path class="dt" d="M50,66 L16.1,32.1 A48,48 0 0,1 83.9,32.1 Z" fill="#d39b62"/>'+
    /* 내야 잔디 — 네 베이스를 이은 마름모 */
    '<polygon class="ig" points="50,66 74,42 50,18 26,42" fill="#55b673"/>'+
    /* 파울선 · 외야 펜스 */
    '<path d="M50,66 L3.3,19.3 M50,66 L96.7,19.3" stroke="rgba(255,255,255,.75)" '+
      'stroke-width=".6" fill="none"/>'+
    '<path d="M3.3,19.3 A66,66 0 0,1 96.7,19.3" stroke="rgba(255,255,255,.55)" '+
      'stroke-width=".8" fill="none"/>'+
    /* 베이스 · 투수판 · 홈플레이트 */
    '<g fill="#eef6f1">'+
      '<rect x="71.8" y="39.8" width="4.4" height="4.4" transform="rotate(45 74 42)"/>'+
      '<rect x="47.8" y="15.8" width="4.4" height="4.4" transform="rotate(45 50 18)"/>'+
      '<rect x="23.8" y="39.8" width="4.4" height="4.4" transform="rotate(45 26 42)"/>'+
      '<polygon points="47.4,63.6 52.6,63.6 52.6,66.2 50,68.4 47.4,66.2"/>'+
      '<rect x="46" y="48.2" width="8" height="1.8" rx=".6"/>'+
    '</g></svg>';
}
/* 이 선수가 맡은 자리 (없으면 '') */
function posOf(g, side, sid){
  var m = (g.def||{})[side] || {}, r = '';
  Object.keys(m).forEach(function(k){ if(m[k]===sid) r = k; });
  return r;
}
/* 자리 배정 — 원래 있던 자리는 비우고, 그 자리에 있던 사람은 대기로 밀린다 */
function setPos(g, side, sid, posKey){
  g.def = g.def || {}; g.def[side] = g.def[side] || {};
  var m = g.def[side], kicked = '';
  Object.keys(m).forEach(function(k){ if(m[k]===sid) delete m[k]; });
  if(posKey){ kicked = m[posKey] || ''; m[posKey] = sid; }
  return kicked;
}
/* 빈 자리를 타순 순서대로 채운다 */
function autoPos(g, side){
  var m = defOf(g, side), taken = {};
  Object.keys(m).forEach(function(k){ taken[m[k]] = 1; });
  var rest = benchOf(g, side), i = 0;
  POS.forEach(function(P){ if(!m[P.k] && rest[i]) m[P.k] = rest[i++].sid; });
  return i;
}
/* 이닝별 득점 — 그 회에 기록된 타석의 득점을 합친다 */
function runsIn(g, inning, half){
  return (g.atbats||[]).reduce(function(a,x){
    return a + ((x.inning===inning && x.half===half) ? (x.run||0) : 0); }, 0);
}
function hitsOf(g, side){
  return (g.atbats||[]).filter(function(x){
    return x.side===side && x.kind>=1 && x.kind<=4; }).length;
}
/* 그 회를 시작했는지 — 아직 안 온 회만 점수 칸을 '-' 로 비운다 (진행 중인 회는 지금까지의 점수) */
function halfPlayed(g, inning, half){
  if(inning < g.st.inning) return true;
  if(inning > g.st.inning) return false;
  return half==='초' ? true : (g.st.half==='말');
}

/* 타석 결과 칩 — kind: 0아웃 1안타 2·3루타 4홈런 5포볼 6야수선택 7실책 */
var KIND_TX = ['아웃','안타','2루타','3루타','홈런','포볼','야선','실책'];
function chipHTML(kind){
  var c = kind===4 ? 'hr' : (kind===2||kind===3) ? 'x' : kind===1 ? '' : (kind===5||kind===6||kind===7) ? 'bb' : 'out';   /* ★ 'o' 는 타순 번호 칸(.orow .o)과 겹쳐 칩이 좁아졌다 */
  return '<span class="rc '+c+'">'+(kind===4?'🏆 ':'')+KIND_TX[kind]+'</span>';
}
/* 반 안에서의 부문 순위 — 홈런·타율·안타·타점 중 가장 높은 것 하나 (10위 안일 때만) */
function bestRank(cum, sid){
  var me = cum[sid]; if(!me) return null;
  var all = Object.keys(cum).map(function(k){ return cum[k]; });
  var CATS = [{k:'hr',t:'홈런'},{k:'avg',t:'타율',q:true},{k:'h',t:'안타'},{k:'rbi',t:'타점'}];
  var best = null;
  CATS.forEach(function(C){
    if(C.q && me.ab < LB_MIN_AB) return;
    if(!(me[C.k] > 0)) return;
    var r = 1 + all.filter(function(x){ return (!C.q || x.ab>=LB_MIN_AB) && x[C.k] > me[C.k]; }).length;
    if(r <= 10 && (!best || r < best.r)) best = {r:r, t:C.t};
  });
  return best;
}

/* 수비 참여 자동 기록 — 같은 경기에선 학생당 한 번뿐(id = dp_학생).
   via:'end' = 수비 이닝이 끝날 때 9자리에 있던 학생, via:'swap' = 이닝 도중 교체로 들고 난 학생 */
function awardDef(g, sids, via){
  var have = {}, made = [];
  (g.defense||[]).forEach(function(d){ if(d.kind==='play') have[d.sid] = 1; });
  sids.forEach(function(sid){
    if(!sid || have[sid]) return; have[sid] = 1;
    var r = {id:'dp_'+ck(sid), sid:sid, kind:'play', auto:1, via:via,
             inning:g.st.inning, half:g.st.half, ts:stamp()};
    g.defense.push(r); made.push(r);
  });
  made.forEach(function(r){ syncDF(S.cur, g, r); });
  return made;
}
function onField(g, side){
  var m = defOf(g, side);
  return Object.keys(m).map(function(k){ return m[k]; }).filter(Boolean);
}

/* 경기 진행 기록 — 복기용. 「1회 말 · 3번 박지윤 — 아웃 (유격수 양연규)」 */
var KIND_LOG = ['아웃','1루타','2루타','3루타','홈런','포볼','야수선택','실책 출루'];
function playLog(g){
  var list = (g.atbats||[]).slice();
  sortRec(list);
  if(!list.length) return '<div class="msg">아직 기록이 없습니다</div>';
  return '<ol class="plog">'+list.reverse().map(function(a){
    var no = a.stBefore ? (a.stBefore.idx+1)+'번 ' : '';
    var fld = (a.fld||[]).map(function(f){
      var P = POS.filter(function(x){ return x.k===f.pos; })[0];
      return (P ? P.n+' ' : '')+esc(pName(g, f.sid));
    }).join(' → ');
    var what = KIND_LOG[a.kind] || '';
    if(fld) what += a.kind===6 ? ' ('+fld+' 주자 아웃)' : ' ('+fld+')';
    var sc = a.sc!=null ? a.sc : (a.rbi||0);
    return '<li><span class="pi">'+(a.inning||'')+'회 '+(a.half||'')+'</span>'+
      '<span class="pn2">'+no+'<b>'+esc(a.name||nameOf(g,a.sid))+'</b></span>'+
      '<span class="pw k'+a.kind+'">'+what+(sc ? ' · <em>'+sc+'점</em>' : '')+'</span></li>';
  }).join('')+'</ol>';
}

function board(g){
  try{ return boardImpl(g); }catch(e){ showErr(e, 'v-game'); }
}
function boardImpl(g){
  var c = cls();
  watchGame(S.cur, g.no);
  if(g._setup) return setupView(g);      // 경기 세팅 화면 (감시는 붙인 채로 둔다)
  document.body.classList.add('ingame');
  var atk = atkSide(g), fs = firstSide(g), ls = otherSide(fs);
  var dside = atk==='H' ? 'A' : 'H';          // 수비팀
  var order = atk==='H' ? g.orderH : g.orderA;
  var b = order[g.st.idx];
  var st = tally(g.atbats, g.defense, {});
  var cum = tally(allAtbats(c), allDefense(c), {});
  g.bases = g.bases || [null,null,null];
  var dmap = defOf(g, dside);
  g._pick = g._pick || [];                    // 아웃 기여로 고른 선수
  g._swap = !!g._swap;                        // 교대 모드
  function tname(side){ return side==='H' ? g.home : g.away; }
  var pickTag = g._pick.length ? ' <small class="ptag">🧤 '+g._pick.map(function(sid){ return esc(pName(g,sid)); }).join('·')+'</small>' : '';
  var outsNow = (g.atbats||[]).filter(function(a){
    return a.inning===g.st.inning && a.half===g.st.half && a.kind===0; }).length;

  /* ── 점수 카드 ── */
  function tcard(side){
    var on = side===atk;
    return '<div class="tcard '+side+(on?' atk':'')+'">'+
      '<div class="tn">'+esc(tname(side))+'</div>'+
      '<div class="ts">'+(side==='H'?g.hs:g.as)+'</div>'+
      '<div class="tf"><span class="th">안타 '+hitsOf(g,side)+'</span>'+
        '<span class="tb">'+(on?'⚑ 공격중':'수비')+'</span><span></span></div>'+
    '</div>';
  }
  function lamps(v,n,cl,ct){           // ct 가 있으면 눌러서 고칠 수 있는 불
    var o=''; for(var i=0;i<n;i++) o+='<span class="lamp'+(i<v?' '+cl:'')+'"'+
      (ct ? ' data-ct="'+ct+'" data-i="'+i+'"' : '')+'></span>'; return o;
  }
  /* 이닝별 점수 — 팀 | 1 | 2 | … | 안타 | ▲▼
     총점(R)은 양옆 큰 점수 카드에 있으므로 뺐다 (사용자: "득점이면 양 끝에 있으니 없어도 될 것 같다").
     머리글은 학생이 헷갈리지 않게 한글로. */
  function scoreTable(){
    var n = g.innings;
    var head = '<tr><th class="inh">팀</th>';
    for(var i=1;i<=n;i++) head += '<th'+(i===g.st.inning?' class="cur"':'')+'>'+i+'</th>';
    head += '<th class="hh">안타</th><th class="adjh"></th></tr>';
    function row(side){
      var half = halfOfSide(g, side);
      var o = '<tr class="'+(side==='H'?'h':'a')+'"><td class="tm">'+esc(tname(side))+'</td>';
      for(var i=1;i<=n;i++){
        var played = halfPlayed(g,i,half), v = runsIn(g,i,half);
        var now = (i===g.st.inning && half===g.st.half);
        o += '<td class="'+(played && v ? '' : 'z')+(now?' now':'')+'">'+(played? v : '-')+'</td>';
      }
      return o + '<td class="hh">'+hitsOf(g,side)+'</td>'+
        '<td class="adjc"><div class="adj"><button data-sc="'+side+'+">▲</button><button data-sc="'+side+'-">▼</button></div></td></tr>';
    }
    return '<table class="isc">'+head+row(fs)+row(ls)+'</table>';   // 선공이 윗줄
  }

  /* ── 타격 순서 — 지금 타자 칸만 크게 펼쳐 타자 정보를 보여 준다 ── */
  function nowCard(p, i){
    var pp = findP(g, p.sid) || {};
    var me = cum[p.sid] || {ab:0,h:0,hr:0,rbi:0,avg:0};
    var mine = allAtbats(c).filter(function(a){ return a.sid===p.sid; });
    sortRec(mine);
    var today = (g.atbats||[]).filter(function(a){ return a.sid===p.sid; });
    var show = today.length ? today : mine.slice(-3);
    var rk = bestRank(cum, p.sid);
    return '<div class="orow now big" id="nowRow">'+
      '<div class="nb-top"><span class="nb-no">'+(i+1)+'</span><span class="nb-of">/ '+order.length+'번 타자</span>'+
        (rk ? '<span class="nb-rk">☆ '+rk.t+' 반 '+rk.r+'위</span>' : '')+'</div>'+
      '<div class="nb-nm">'+(pp.num ? '<span>'+esc(pp.num)+'</span>' : '')+'<b>'+esc(p.name)+'</b>'+
        (p.dup ? '<em>중복</em>' : '')+'</div>'+
      '<div class="nb-st"><div><div class="l">시즌 타율</div>'+
          (me.ab ? '<div class="v">'+fmtAvg(me.avg)+'</div>' : '<div class="v na">첫 타석</div>')+'</div>'+
        '<div class="nb-r"><div class="nb-sum">'+me.ab+'타수 '+me.h+'안타'+(me.hr ? ' · 홈런 '+me.hr : '')+'</div>'+
          (show.length ? '<div class="nb-rec">'+(today.length?'오늘':'최근')+' '+
            show.map(function(a){ return chipHTML(a.kind); }).join('')+'</div>' : '')+
        '</div></div>'+
    '</div>';
  }
  function orderHTML(){
    var bs = g.bases||[];
    return order.map(function(p,i){
      if(i===g.st.idx) return nowCard(p, i);
      var done = i < g.st.idx;
      var s = cum[p.sid];
      var last = (g.atbats||[]).filter(function(a){ return a.sid===p.sid && a.side===atk; }).slice(-1)[0];
      return '<div class="orow'+(done?' done':'')+(bs.indexOf(p.sid)>=0?' onb':'')+'">'+
        '<span class="o">'+(i+1)+'</span>'+
        '<span class="nm">'+esc(p.name)+(p.dup?'*':'')+'</span>'+
        '<span class="av">'+(s && s.ab ? fmtAvg(s.avg) : '')+'</span>'+
        (last ? chipHTML(last.kind) : '')+'</div>';
    }).join('');
  }

  function ordPanel(sideCls){
    return '<div class="gcol gord '+sideCls+'">'+
      '<div class="goh"><span>타격순서</span><small>'+esc(tname(atk))+' 공격 · '+order.length+'명</small></div>'+
      '<div class="olist" id="olist">'+orderHTML()+'</div>'+
    '</div>';
  }
  /* 공수교대 직후 한 번만 뒤집히는 효과 */
  var swapAnim = g._lastHalf && g._lastHalf !== g.st.inning+g.st.half;
  g._lastHalf = g.st.inning+g.st.half;

  /* ── 수비 배치도 — 늘 보인다. 아웃을 만든 선수를 탭 → 「아웃 처리」 ── */
  function fieldPanel(){
    var bench = benchOf(g, dside);
    var hint = g._swap ? '교대할 자리를 누르세요'
      : g._pick.length ? g._pick.length+'명 선택 — 「아웃」이나 「야수선택」을 누르면 같이 기록돼요'
      : '공을 처리한 수비수를 누른 뒤 결과 버튼';
    return '<div class="fph"><span class="pt '+dside+'">'+esc(tname(dside))+'</span><span class="pmode">수비</span>'+
        '<span class="fhint'+(g._pick.length||g._swap?' on':'')+'">'+hint+'</span></div>'+
      '<div class="fwrap"><div class="field">'+fieldSVG()+POS.map(function(P){
          var sid = dmap[P.k], on = g._pick.indexOf(sid)>=0;
          return '<div class="po'+(P.z==='of'?' of':'')+(on?' pick':'')+(g._swap?' swap':'')+'" data-pos="'+P.k+'" '+
            'style="left:'+P.x+'%;top:'+P.y+'%"><div class="pp">'+P.n+'</div>'+
            '<div class="pn">'+esc(sid? pName(g,sid) : '—')+'</div></div>';
        }).join('')+'</div></div>'+
      '<div class="bench">대기 '+bench.length+'명'+
        (bench.length ? ' · '+bench.map(function(p){return esc(p.name);}).join(', ') : '')+'</div>'+
      '<div class="dbtn">'+
        '<button id="swapB" class="'+(g._swap?'on':'')+'">수비 교대</button>'+
        '<button id="pickClr"'+(g._pick.length?'':' disabled')+'>선택 지우기'+(g._pick.length?' ('+g._pick.length+'명)':'')+'</button>'+
      '</div>';
  }

  el('v-game').innerHTML =
  '<div class="gb">'+
    '<div class="gbar">'+
      '<button id="menuB">☰ 메뉴</button>'+
      songBarHTML()+
      '<span class="gt">'+gLabel(g)+'<small>'+(g.mode==='intra'?'학급내':'학급대항')+' · '+g.innings+'이닝 · 전원타격제</small></span>'+
      '<button id="thB">'+(document.documentElement.dataset.theme==='light'?'🌙 어둡게':'☀ 밝게')+'</button>'+
      '<button id="undo">↶ 되돌리기</button>'+
      '<button id="setB">경기 세팅</button>'+
      '<button id="fsB">⛶ 전체화면</button>'+
      '<button id="fin" class="dn">경기 종료</button>'+
    '</div>'+
    /* 팀마다 자리 고정 — 왼쪽 = 선공(점수표 윗줄), 오른쪽 = 후공. 카드 바로 아래에 그 팀이 지금 하는 일
       (수비 중이면 수비 배치도, 공격 중이면 타격 순서)이 온다. 공수교대 때 아래 두 칸이 제자리에서 뒤집힌다. */
    '<div class="gsc">'+tcard(fs)+
      '<div class="gmid">'+scoreTable()+'</div>'+
      tcard(ls)+'</div>'+
    '<div class="gmn'+(swapAnim?' swp':'')+'">'+
      (atk===fs ? ordPanel('sl') : '<div class="gcol gfld sl">'+fieldPanel()+'</div>')+
      '<div class="gcol gplay">'+
        /* 띠는 «한 줄»: 「1회 초 · B●●○ S●○ · 14/14 · 아웃 0」 — 좁은 화면에서 두 줄로 깨지지 않게 불을 작게 */
        '<div class="cstrip"><span class="ginn">'+g.st.inning+'회 '+g.st.half+'</span>'+
          '<div class="cnt">'+
            '<div class="g"><span class="k">B</span>'+lamps(g._b||0,3,'b','B')+'</div>'+
            '<div class="g"><span class="k">S</span>'+lamps(g._s||0,2,'s','S')+'</div>'+
          '</div>'+
          /* 전원타격제라 아웃 3개로 교대하지 않는다 → 불 대신 「이번 회 몇 번째 타자 / 아웃 몇 명」 */
          '<div class="prog"><b>'+Math.min(g.st.idx+1, order.length)+'<small>/'+order.length+'</small></b>'+
            '<em>아웃 '+outsNow+'</em></div>'+
        '</div>'+
        '<div class="brun">'+diamondHTML(g)+
          '<button class="clrb" id="clrB">주자 비우기</button>'+
          '<div class="dlb">루를 눌러 진루·아웃 수정</div></div>'+
        (b ? '<div class="hits">'+
               '<button class="h1" data-k="1">1루타</button>'+
               '<button class="h2" data-k="2">2루타</button>'+
               '<button class="h3" data-k="3">3루타</button>'+
               '<button class="h5" data-k="5">포볼</button>'+
               '<button class="h6" data-k="6">야수선택'+pickTag+'</button>'+
               '<button class="h7" data-k="7">실책 출루</button>'+
               '<button class="h4" data-k="4">홈런</button>'+
               '<button class="h0" data-k="0">아웃'+pickTag+'</button>'+
             '</div>' : '')+
        '<div class="cbt">'+
          /* 아래 버튼은 누르기만(+1) — 불을 피해 누르기 어렵다는 지적으로 불을 빼고 글자만. 고치기는 위 띠의 불을 눌러서 */
          '<button id="pB" class="cb">BALL</button>'+
          '<button id="pS" class="cs">STRIKE</button>'+
          '<button id="pR" class="rz">카운트 지우기</button>'+
        '</div>'+
      '</div>'+
      (atk===fs ? '<div class="gcol gfld sr">'+fieldPanel()+'</div>' : ordPanel('sr'))+
    '</div>'+
  '</div>'+
  '<div class="card hdrow" style="margin-top:11px"><h3>경기 진행 기록 (최근 순)</h3>'+playLog(g)+'</div>'+
  '<div class="card hdrow"><h3>이 경기 기록</h3>'+
    (Object.keys(st).length ?
      '<table><tr><th>이름</th><th class="n">타석</th><th class="n">타수</th><th class="n">안타</th>'+
      '<th class="n">타율</th><th class="n">볼넷</th><th class="n">득점</th><th class="n">타점</th><th class="n">수비</th></tr>'+
      Object.keys(st).map(function(k){ var x=st[k];
        return '<tr><td>'+esc(nameOf(g,k))+'</td><td class="n">'+x.pa+'</td><td class="n">'+x.ab+'</td>'+
          '<td class="n">'+x.h+'</td><td class="n">'+fmtAvg(x.avg)+'</td><td class="n">'+x.bb+'</td>'+
          '<td class="n">'+x.r+'</td><td class="n">'+x.rbi+'</td><td class="n">'+x.dOut+'</td></tr>'; }).join('')+'</table>'
      : '<div class="msg">아직 기록이 없습니다</div>')+'</div>';

  /* 지금 타자가 타격 순서 칸에 보이게 스크롤 */
  var ol = el('olist'), nowR = el('nowRow');
  if(ol && nowR) ol.scrollTop = Math.max(0, nowR.offsetTop - ol.offsetTop - ol.clientHeight*0.22);

  el('v-game').querySelectorAll('.hits button').forEach(function(x){
    x.onclick = function(){ swing(+x.dataset.k); };
  });
  el('v-game').querySelectorAll('[data-sc]').forEach(function(x){
    x.onclick = function(){
      var k=x.dataset.sc, w=k.charAt(0), d=k.charAt(1)==='+'?1:-1;
      if(w==='H') g.hs=Math.max(0,g.hs+d); else g.as=Math.max(0,g.as+d);
      syncState(S.cur,g); board(g);
    };
  });
  //  다이아몬드 — 주자 이동/아웃 고르기
  el('v-game').querySelectorAll('.bs').forEach(function(x){
    x.onclick = function(){
      var i = +x.dataset.b, sid = g.bases[i];
      if(!sid){ g.bases[i] = b ? b.sid : 'x'; syncState(S.cur,g); board(g); return; }
      runnerPop(g, i, sid);
    };
  });
  //  수비 배치도 — 선수 탭 = 아웃 기여 선택, 교대 모드면 교체
  el('v-game').querySelectorAll('[data-pos]').forEach(function(x){
    x.onclick = function(){
      var k = x.dataset.pos;
      if(g._swap) return swapPop(g, dside, k);
      var sid = dmap[k]; if(!sid) return;
      var i = g._pick.indexOf(sid);
      if(i>=0) g._pick.splice(i,1); else g._pick.push(sid);
      board(g);
    };
  });
  el('swapB').onclick = function(){ g._swap = !g._swap; g._pick=[]; board(g); };
  el('pickClr').onclick = function(){ g._pick = []; board(g); };
  el('menuB').onclick = function(){ document.body.classList.add('sideopen'); };
  bindSongBar();
  watchSongIdx(S.cur);
  SONG._pf = SONG._pf || {};
  if(!SONG._pf[S.cur] && SONG.idx[S.cur]){ SONG._pf[S.cur] = 1; prefetchClassSongs(S.cur); }
  el('thB').onclick = function(){ setTheme(document.documentElement.dataset.theme==='light' ? 'dark' : 'light'); board(g); };
  el('setB').onclick = function(){ g._setup = true; document.body.classList.remove('fs'); save(); render(); };
  el('fsB').onclick = function(){
    document.body.classList.toggle('fs');
    if(document.body.classList.contains('fs') && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(function(){});
    else if(document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
  };
  /* 볼카운트 — 심판이 헷갈리지 않게 크게. 4볼·3스트라이크에서 멈추고 결과 버튼을 누르라고 알린다 */
  el('pS').onclick = function(){
    if((g._s||0) >= 2){ toast('스트라이크 3개 — 「아웃」을 눌러 주세요'); return; }
    g._s = (g._s||0)+1; save(); board(g);
  };
  el('pB').onclick = function(){
    if((g._b||0) >= 3){ toast('볼 4개 — 「포볼」을 눌러 주세요'); return; }
    g._b = (g._b||0)+1; save(); board(g);
  };
  /* 위 띠의 불을 눌러 지우기 — 켜진 불을 누르면 그 불부터 꺼진다 (잘못 눌렀을 때 하나만 되돌리기).
     (볼을 한 번 더 눌렀을 때 전부 지우지 않고 하나만 되돌리려고 — 사용자 선택) */
  el('v-game').querySelectorAll('.lamp[data-ct]').forEach(function(x){
    x.onclick = function(e){
      e.stopPropagation();                         // 볼·스트라이크 버튼(+1)까지 눌리지 않게
      var k = x.dataset.ct==='B' ? '_b' : '_s', i = +x.dataset.i;
      if(i >= (g[k]||0)) return;                   // 꺼진 불은 눌러도 그대로 — 지우기 전용
      g[k] = i;
      save(); board(g);
    };
  });
  el('pR').onclick = function(){ g._s=0; g._b=0; save(); board(g); };
  el('clrB').onclick = function(){ g.bases=[null,null,null]; syncState(S.cur,g); board(g); toast('주자를 비웠습니다'); };
  el('undo').onclick = function(){
    if(!g.atbats.length) return toast('되돌릴 기록이 없습니다');
    var last = g.atbats.pop();
    if(last.run) (last.side==='H') ? g.hs-=last.run : g.as-=last.run;
    if(last.stBefore){
      /* 이 타석으로 공수교대가 됐었다면, 그때 자동으로 준 수비 참여도 같이 무른다 */
      var sb = last.stBefore;
      g.defense = g.defense.filter(function(d){
        var kill = d.auto && d.via==='end' && d.inning===sb.inning && d.half===sb.half;
        if(kill) drop(gPath(S.cur,g)+'/df/'+d.id);
        return !kill;
      });
      g.st = sb;
    }
    if(last.basesBefore) g.bases = last.basesBefore;
    g.defense = g.defense.filter(function(d){       // 그 타석에 묶였던 수비 아웃도 같이
      if(d.ab===last.id){ drop(gPath(S.cur,g)+'/df/'+d.id); return false; } return true; });
    g._s=0; g._b=0; g._pick=[];
    dropAB(S.cur, g, last.id);            // 배열 전체가 아니라 그 한 칸만 지운다
    stopAll();
    syncState(S.cur,g); board(g); toast('한 타석 되돌림');
  };
  el('fin').onclick = function(){
    if(!confirm('경기를 종료할까요?')) return;
    stopAll();
    g.status='done'; document.body.classList.remove('fs');
    ['_s','_b','_o','_pick','_swap'].forEach(function(k){ delete g[k]; });
    unwatch(); syncGameFull(S.cur,g); render(); toast(gLabel(g)+' 종료');
  };

  function swing(kind){
    if(!b) return;
    var before = g.bases.slice();
    var res = advance(g.bases, b.sid, kind);
    g.bases = res.bases;
    var scored = res.runs.length;

    var rec = {id:newId(), ts:stamp(), side:atk, sid:b.sid, name:b.name, kind:kind,
               result: (kind>=1&&kind<=4)?'H':'O', dup:!!b.dup,
               run:0, rbi:((kind===5||kind===7)?0:scored),   /* 포볼 밀어내기·실책 득점은 타점 없음 */
               sc:scored, inning:g.st.inning, half:g.st.half,
               stBefore:Object.assign({},g.st), basesBefore:before};
    g.atbats.push(rec);
    var touched=[];
    res.runs.forEach(function(sid){
      if(sid===b.sid){ rec.run+=1; }
      else for(var i=g.atbats.length-2;i>=0;i--){
        if(g.atbats[i].sid===sid){ g.atbats[i].run=(g.atbats[i].run||0)+1;
          if(touched.indexOf(i)<0) touched.push(i); break; }
      }
    });
    if(atk==='H') g.hs+=scored; else g.as+=scored;
    if(kind===0) g._o = Math.min(3,(g._o||0)+1);
    /* 수비 연동 — 결과는 공격 버튼이 정하고, 미리 탭해 둔 수비수는 「누가 처리했나」로 이 타석에 묶는다.
       아웃·야수선택일 때만 수비 아웃으로 기록(안타·포볼·실책이면 선택만 지운다). 되돌리기는 ab 로 같이 지운다. */
    var dfMade = [];
    if((kind===0 || kind===6) && g._pick.length){
      rec.fld = g._pick.map(function(sid){ return {sid:sid, pos:posOf(g, dside, sid)}; });
      dfMade = g._pick.map(function(sid){
        var r = {id:newId(), sid:sid, ts:stamp(), ab:rec.id};
        g.defense.push(r); return r; });
    }
    g._s=0; g._b=0; g._pick=[];
    if(g.st.idx+1 >= order.length) awardDef(g, onField(g, dside), 'end');   // 수비 이닝 끝 → 9명 수비 참여
    g.st = nextState(g.st, order.length);
    /* 공수교대 — 주자·아웃 리셋. 교대 모드도 꺼서 다음 회에 헛눌리지 않게 한다 */
    if(g.st.idx===0){ g._o=0; g.bases=[null,null,null]; g._swap=false; }
    if(isGameOver(g.st, g.innings)){
      stopAll();
      g.status='done'; document.body.classList.remove('fs');
      unwatch(); syncGameFull(S.cur,g); render(); toast('경기 종료'); return;
    }
    syncAB(S.cur, g, rec);                                  // 새 타석은 자기 칸에
    dfMade.forEach(function(r){ syncDF(S.cur, g, r); });
    touched.forEach(function(i){ syncABRun(S.cur, g, g.atbats[i]); });  // 앞 타자는 run 만
    syncState(S.cur, g);
    board(g);
    cheerBatter(g);                                         // 다음 타자 소개 → 응원가
    if(kind===6) toast('야수선택 — 죽은 주자를 다이아몬드에서 눌러 지우세요');
    else if(kind===7) toast('실책 출루 — 주자가 더 갔으면 베이스를 눌러 고치세요');
    else if(scored) toast(b.name+' · '+scored+'점');
  }
}

/* 주자를 눌렀을 때 — 어디로 갔는지 고른다 */
function runnerPop(g, idx, sid){
  var d = document.createElement('div');
  d.className='pop';
  d.innerHTML = '<div class="popbox"><h4>'+esc(pName(g,sid))+'</h4>'+
    '<p>'+(idx+1)+'루 주자가 어디로 갔나요?</p>'+
    '<div class="popgrid">'+
      (idx<1?'<button data-to="1">2루</button>':'')+
      (idx<2?'<button data-to="2">3루</button>':'')+
      '<button data-to="H">홈 (득점)</button>'+
      '<button data-to="O">아웃</button>'+
      '<button data-to="X" style="grid-column:1/-1">취소</button>'+
    '</div></div>';
  document.body.appendChild(d);
  d.onclick = function(e){ if(e.target===d) d.remove(); };
  d.querySelectorAll('[data-to]').forEach(function(btn){
    btn.onclick = function(){
      var to = btn.dataset.to;
      if(to==='X'){ d.remove(); return; }
      g.bases[idx] = null;
      var hit = null;
      if(to==='H'){
        var side = atkSide(g);
        if(side==='H') g.hs++; else g.as++;
        for(var i=g.atbats.length-1;i>=0;i--)
          if(g.atbats[i].sid===sid){ g.atbats[i].run=(g.atbats[i].run||0)+1; hit=g.atbats[i]; break; }
      } else if(to!=='O'){ g.bases[+to] = sid; }
      d.remove();
      if(hit) syncABRun(S.cur, g, hit);
      syncState(S.cur,g); board(g);
      toast(pName(g,sid)+' → '+(to==='H'?'득점':to==='O'?'아웃':(+to+1)+'루'));
    };
  });
}
/* 수비 교대 — 자리를 누르면 대기 선수 목록 */
function swapPop(g, side, posKey){
  var bench = benchOf(g, side), d = document.createElement('div');
  var P = POS.filter(function(x){return x.k===posKey;})[0];
  d.className='pop';
  d.innerHTML = '<div class="popbox"><h4>'+P.n+' 교체</h4>'+
    '<p>대기 '+bench.length+'명 · 누구를 넣을까요?</p>'+
    '<div class="popgrid">'+
      bench.map(function(p){ return '<button data-sid="'+p.sid+'">'+esc(p.name)+'</button>'; }).join('')+
      '<button data-sid="" style="grid-column:1/-1">취소</button>'+
    '</div></div>';
  document.body.appendChild(d);
  d.onclick = function(e){ if(e.target===d) d.remove(); };
  d.querySelectorAll('[data-sid]').forEach(function(btn){
    btn.onclick = function(){
      var sid = btn.dataset.sid;
      if(sid){
        var out = g.def[side][posKey];
        g.def[side][posKey] = sid;
        awardDef(g, [out, sid], 'swap');      // 이닝 도중 교체 — 나간 학생도 뛰었고 들어온 학생도 뛴다
        syncState(S.cur,g); toast(P.n+' → '+pName(g,sid));

      d.remove(); board(g);

}
function diamondHTML(g){
  var b = g.bases||[null,null,null];
  /* 이름은 베이스 «안에» — 베이스는 45° 돌아가 있으므로 글자는 반대로 돌려 바로 세운다 */
  function base(i, cl, lb){
    var nm = b[i] ? pName(g,b[i]) : '';
    return '<div class="bs '+cl+(b[i]?' on':'')+'" data-b="'+i+'"><span class="bn'+(nm.length>3?' sm':'')+'">'+
      (b[i] ? esc(nm) : lb)+'</span></div>';
  }
  return '<div class="dia">'+base(1,'b2','2루')+base(0,'b1','1루')+base(2,'b3','3루')+'<div class="hp"></div></div>';
}
function defSide(g, atk){ return atk==='H' ? g.orderA : g.orderH; }
function nameOf(g, sid){
  var f = g.orderH.concat(g.orderA).filter(function(p){return p.sid===sid;})[0];
  return f ? f.name : sid;
}
function pickPlayer(order, cb){
  var names = order.map(function(p,i){ return (i+1)+'. '+p.name; }).join('\n');
  var v = prompt('수비 아웃에 관여한 선수 번호를 입력하세요\n\n'+names);
  if(!v) return;
  var i = parseInt(v,10)-1;
  if(isNaN(i) || !order[i]) return toast('번호가 올바르지 않습니다');
  cb(order[i].sid);
}
function allAtbats(c){ return c.games.reduce(function(a,g){ return a.concat(g.atbats||[]); },[]); }
function allDefense(c){ return c.games.reduce(function(a,g){ return a.concat(g.defense||[]); },[]); }
function inningMap(c){
  var m = {};
  c.games.filter(function(g){return g.status==='done';}).forEach(function(g){
    var played = Math.min(g.innings, Math.max(1, g.st.inning - (g.st.half==='초'?1:0)));
    var seen = {};
    g.orderH.concat(g.orderA).forEach(function(p){
      if(seen[p.sid]) return; seen[p.sid]=1;
      if(!m[p.sid]) m[p.sid] = {inn:0, g:0};
      m[p.sid].inn += played; m[p.sid].g += 1;
    });
  });
  return m;
}

/* ══ 2026-2학기 평가계획 점수 환산 ═══════════════════════
   탁구 스트로크 20 + 탁구 리그전 20 + 야구 40 + 보고서 20 = 100점       */

/* 탁구 스트로크 20점 — 포핸드 5개 + 백핸드 5개 성공 횟수를 «합산» 한 값 */
function scStroke(n){
  if(n==null || n==='') return null;
  n = +n; return n>=9?20 : n>=7?16 : n>=5?12 : n>=3?8 : 4;
}
/* 탁구 리그전 Ⓐ — 모든 경기 득점 합 ÷ 경기 수 = 평균 득점 */
function scTTLg(avg){
  if(avg==null) return null;
  return avg>=9?20 : avg>=7?16 : avg>=5?12 : avg>=3?8 : 4;
}
/* 야구 Ⓐ 타율 30점 */
function scBA(a){
  if(a==null) return null;
  return a>=0.500?30 : a>=0.400?25 : a>=0.300?20 : a>=0.200?15 : 10;
}
/* 야구 Ⓑ 평균 기여도 10점 — «경기당» 으로 잰다 (계획서 기준) */
function scCon(v){
  if(v==null) return null;
  return v>=2.0?10 : v>=1.5?8 : v>=1.0?6 : v>=0.5?4 : 2;
}
/* 보고서 20점 — 6개 항목 중 충족 개수 */
function scRep(n){
  n = +n||0; return n>=6?20 : n>=5?16 : n>=4?12 : n>=3?8 : 4;
}

/* 타율 — 계획서: 최소 4경기. 경기 수가 모자라면 «부족한 경기 수 만큼 아웃» 을 더해 계산한다. */
var MIN_GAMES = 4;
function adjBA(x){
  if(!x || (!x.ab && !x.g)) return null;
  var add = Math.max(0, MIN_GAMES - (x.g||0));   // 부족 경기 1개 = 아웃 1개
  var ab  = (x.ab||0) + add;
  return ab ? (x.h||0)/ab : 0;
}

/* 「11,7,9」 처럼 적은 경기별 득점을 숫자 배열로 */
function parseScores(str){
  return String(str==null?'':str).split(/[^0-9.]+/)
           .filter(function(v){ return v!==''; }).map(Number)
           .filter(function(v){ return isFinite(v); });
}
/* 스트로크 합계 — 손으로 적은 합계가 있으면 그것을, 없으면 포핸드+백핸드를 쓴다.
   (포핸드·백핸드를 따로 재지 않고 합산 횟수만 기록해 둔 반이 있어서 둘 다 받는다) */
function strokeSum(t){
  t = t || {};
  if(t.sum != null && t.sum !== '') return +t.sum;
  var fh = (t.fh==null||t.fh==='') ? null : +t.fh;
  var bh = (t.bh==null||t.bh==='') ? null : +t.bh;
  return (fh==null && bh==null) ? null : (fh||0)+(bh||0);
}

/* 탁구 리그전 한 학생 집계 */
function ttLeague(t){
  var v = parseScores(t && t.scores);
  if(!v.length) return {n:0, sum:0, avg:null, a:null, area:null};
  var sum = v.reduce(function(a,b){ return a+b; }, 0);
  var avg = sum / v.length;
  var a   = scTTLg(avg);
  var card= Math.max(0, Math.min(4, +(t && t.card) || 0));   // 계획서: 탁구는 최대 4장
  return {n:v.length, sum:sum, avg:avg, a:a, area:Math.min(20, a + card)};
}

/* ── 탁구 ─────────────────────────────── */
function vTT(){
  if(!S.cur) return needClass('v-tt');
  var c = cls();
  c.tt = c.tt || {};

  function row(s){
    var t = c.tt[s.sid] || {};
    var fh = (t.fh==null||t.fh==='') ? null : +t.fh;
    var bh = (t.bh==null||t.bh==='') ? null : +t.bh;
    var sum = strokeSum(t);
    var st  = scStroke(sum);
    var lg  = ttLeague(t);
    return {fh:fh, bh:bh, sum:sum, st:st, lg:lg,
            total:(st==null && lg.area==null) ? null : (st||0)+(lg.area||0)};
  }
  function dash(v){ return v==null ? '—' : v; }

  el('v-tt').innerHTML =
    '<h2 class="t">'+esc(S.cur)+' 탁구</h2>'+
    '<p class="st">스트로크 20점 + 리그전 20점 = <b>40점</b> · '+
    '포핸드·백핸드를 따로 넣으면 <b>합계가 자동</b>으로 잡히고, '+
    '합산 횟수만 쟀다면 <b>합계 칸에 바로</b> 넣으면 됩니다 · '+
    '리그전 득점은 <b>쉼표로 나열</b>하면 평균이 자동 계산됩니다 (예: 11,7,9)</p>'+
    '<div class="card">'+
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="btn" id="ttBulk">합계 일괄 입력</button>'+

  el('v-tt').querySelectorAll('[data-tt]').forEach(function(i){

      if(k==='fh' || k==='bh') c.tt[sid].sum = null;

    i.oninput  = function(){ apply(); save(); };

  /* ── 일괄 입력 ──

     시트에서 두 열(번호 / 값)을 그대로 복사해 붙여도 되게 탭도 받는다. */
  var bulkKind = null;
  function openBulk(kind){
    bulkKind = kind;
    el('ttPaste').style.display = '';
    el('ttPasteBox').value = '';
    el('ttPasteHint').innerHTML = (kind==='sum')
      ? '<b>스트로크 합계</b> — <code>번호(또는 이름):값</code> 형식. 예) <code>2:9 3:5 4:6</code><br>'+
        '시트에서 번호·값 두 열을 복사해 붙여넣어도 됩니다.'
      : '<b>리그 득점</b> — <code>번호(또는 이름):득점,득점,…</code> 형식. 예) <code>2:11,9,8</code> 또는 <code>김철수:11,9,8</code> (한 줄에 한 명)';
    el('ttPasteBox').focus();
  }
  function applyBulk(){
    var txt = el('ttPasteBox').value || '';
    /* 번호로도 이름으로도 찾을 수 있게 — 매치메이커에서 긁어온 자료는 이름만 있다 */
    var byNum = {}, byName = {};
    c.roster.forEach(function(s){
      byNum[String(s.num).trim()] = s.sid;
      byName[String(s.name).replace(/\s+/g,'')] = s.sid;
    });
    function findSid(k){
      k = String(k).trim();
      return byNum[k] || byName[k.replace(/\s+/g,'')] || null;
    }
    var okN = 0, miss = [];
    txt.split(/[\n\r]+/).forEach(function(line){
      /* 한 줄에 여러 쌍이 올 수 있다 (스트로크 합계). 리그 득점은 값에 쉼표가 있으므로 줄 단위. */
      /* 합계는 한 줄에 여러 쌍이 올 수 있다. 이름에 공백이 없다는 전제로 공백·쉼표로 쪼갠다.
         리그 득점은 값 자체에 쉼표가 들어가므로 줄 단위로만 읽는다. */
      var pairs = (bulkKind==='sum')
        ? line.split(/[\s,;]+/).filter(Boolean)
        : (line.trim() ? [line.trim()] : []);
      pairs.forEach(function(tok){
        var m = tok.match(/^\s*([^:\t=]+?)\s*[:\t=]\s*(.+?)\s*$/);
        if(!m) return;
        var sid = findSid(m[1]);
        if(!sid){ miss.push(m[1]); return; }
        c.tt[sid] = c.tt[sid] || {};
        if(bulkKind==='sum'){
          var v = parseFloat(m[2]);
          if(!isFinite(v)) return;
          c.tt[sid].sum = v;
        }else{
          c.tt[sid].scores = m[2];
        }
        okN++;
      });
    });
    save(); syncMisc(S.cur,'tt');
    toast(okN + '명 적용' + (miss.length ? ' · 명단에 없는 번호 ' + miss.join(',') : ''));
    el('ttPaste').style.display = 'none';
    vTT();
  }
  el('ttBulk').onclick   = function(){ openBulk('sum'); };
  el('ttLgBulk').onclick = function(){ openBulk('lg'); };
  el('ttPasteOk').onclick= applyBulk;
  el('ttPasteNo').onclick= function(){ el('ttPaste').style.display = 'none'; };
}

/* ── 부문별 순위 ───────────────────────────
   평가 점수와는 무관하다. 평가에 쓰는 건 타율과 이닝당 기여도뿐이고,
   여기 나머지 기록은 학생들이 자기 기록을 재미있게 보라고 넣은 것이다.
   비율 기록(타율·출루율·장타율·OPS)은 타수가 적으면 쉽게 1등이 되어 버리므로
   최소 타수를 채운 학생만 순위에 넣는다. */
var LB_MIN_AB = 3;
var LB_SHOW = 5;                                    // 카드 한 장에 최대 몇 줄까지 보여줄지
function topN(list, key, n){
  var v = list.slice().sort(function(a,b){
    return b[key]-a[key] || (String(a.num) < String(b.num) ? -1 : 1); });
  var out = [], rank = 0, prev = null, more = 0;
  for(var i=0;i<v.length;i++){
    if(!(v[i][key] > 0)) break;                     // 0 인 기록은 순위에 넣지 않는다
    if(prev===null || v[i][key] !== prev){ rank = i+1; prev = v[i][key]; }
    if(rank > n) break;
    if(out.length >= LB_SHOW){ more++; continue; }  // 공동 순위가 많으면 「외 N명」으로 접는다
    out.push({rank:rank, row:v[i]});
  }
  return {list:out, more:more};
}
function leaderHTML(rows){
  if(!rows.length) return '';
  var qual = rows.filter(function(x){ return x.ab >= LB_MIN_AB; });      // 비율 기록 자격
  var innd = rows.filter(function(x){ return x.inn > 0; });
  var i3 = function(v){ return String(v); };
  var CATS = [
    {t:'타율',        k:'avg',     src:qual, fmt:fmtAvg, cls:'rate', note:'타수 '+LB_MIN_AB+'↑'},
    {t:'최다 안타',   k:'h',       src:rows, fmt:i3},
    {t:'홈런',        k:'hr',      src:rows, fmt:i3},
    {t:'타점',        k:'rbi',     src:rows, fmt:i3},
    {t:'출루율',      k:'obp',     src:qual, fmt:fmtAvg, cls:'rate', note:'타수 '+LB_MIN_AB+'↑'},
    {t:'장타율',      k:'slg',     src:qual, fmt:fmtAvg, cls:'rate', note:'타수 '+LB_MIN_AB+'↑'},
    {t:'OPS',         k:'ops',     src:qual, fmt:fmtAvg, cls:'rate', note:'출루율+장타율'},
    {t:'득점',        k:'r',       src:rows, fmt:i3},
    {t:'수비 아웃',   k:'dOut',    src:rows, fmt:i3,     cls:'def'},
    {t:'이닝당 기여', k:'contrib', src:innd, fmt:function(v){return v.toFixed(2);}, cls:'def', note:'평가 반영'}
  ];
  var cards = CATS.map(function(C){
    var t = topN(C.src, C.k, 3);
    return '<div class="lb '+(C.cls||'')+'"><h4>'+C.t+
      (C.note ? '<em>'+C.note+'</em>' : '')+'</h4>'+
      (t.list.length ? '<ol>'+t.list.map(function(e){
          return '<li'+(e.rank===1?' class="top"':'')+'><span class="rk">'+e.rank+'</span>'+
            '<span class="nm">'+esc(e.row.name)+'</span>'+
            '<span class="vl">'+C.fmt(e.row[C.k])+'</span></li>';
        }).join('')+'</ol>'+
        (t.more ? '<div class="none">공동 순위 외 '+t.more+'명</div>' : '')
      : '<div class="none">아직 기록 없음</div>')+'</div>';
  }).join('');
  return '<div class="card"><h3>부문별 순위</h3><div class="lbg">'+cards+'</div>'+
    '<p class="lbnote">※ 성적 평가에 들어가는 것은 <b>타율</b>과 <b>이닝당 기여도</b>뿐입니다. '+
    '나머지 부문은 자기 기록을 돌아보라고 보여 주는 참고 기록입니다.</p></div>';
}

/* ── 실시간 랭킹 (기록실 맨 위) ──────────────────
   홈런 · 타율 · 안타 세 부문, 1~3위는 메달.
   기본은 우리 반, 「전체 반」을 누르면 Firebase 에서 모든 학급 기록을 한 번 받아 합친다.
   (평가와 무관한 동기부여용 화면 — 교실 TV 로 띄우라고 「크게 보기」를 둔다) */
var RK = {scope:'mine', all:null, ts:null, loading:false, big:false};
function rkRows(cn, roster, atbats, gNames){
  var t = tally(atbats, [], {}), by = {};
  (roster||[]).forEach(function(s){ if(s && s.sid) by[s.sid] = s; });
  return Object.keys(t).map(function(sid){
    var s = by[sid], x = t[sid];
    var nm = s ? s.name : ((atbats.filter(function(a){ return a.sid===sid; })[0]||{}).name || '');
    var gi = s && s.group ? GK.indexOf(s.group) : -1;
    var grp = gi>=0 ? (gNames||[])[gi] || (s.group+'조') : '';
    return {sid:sid, cn:cn, name:nm, grp:grp, ab:x.ab, h:x.h, hr:x.hr, avg:x.avg, num:s?s.num:''};
  }).filter(function(r){ return r.name; });
}
function rkMine(){
  var c = cls();
  return rkRows(S.cur, c.roster, allAtbats(c), c.gNames);
}
function rkFetchAll(cb){
  var local = {};
  S.cfg.classNames.slice(0, S.cfg.classCount).forEach(function(cn){
    var c = S.classes[cn]; if(c && c.games && c.games.length) local[cn] = c; });
  function finish(remote){
    var rows = [];
    S.cfg.classNames.slice(0, S.cfg.classCount).forEach(function(cn){
      var v = remote && remote[ck(cn)];
      if(cn===S.cur || !v){                       // 지금 학급은 이 기기 것이 가장 최신
        var c = local[cn]; if(c) rows = rows.concat(rkRows(cn, c.roster, allAtbats(c), c.gNames));
        return;
      }
      var abs = [];
      Object.keys(v.games||{}).forEach(function(k){
        var g = v.games[k]; if(!g) return;
        if(g.ab) Object.keys(g.ab).forEach(function(id){ abs.push(g.ab[id]); });
        else (g.atbats||[]).forEach(function(a){ if(a) abs.push(a); });
      });
      rows = rows.concat(rkRows(cn, v.roster, abs, v.gNames || ['A조','B조','C조','D조']));
    });
    RK.all = rows; RK.ts = new Date(); RK.loading = false; cb();
  }
  if(!DB) return finish(null);
  RK.loading = true;
  DB.ref(ROOT()+'/classes').once('value').then(function(s){ finish(s.val()||{}); })
    .catch(function(){ toast('전체 반 기록을 못 받았습니다 — 이 기기에 있는 학급만 보여 줍니다'); finish(null); });
}
function rkTop(rows, key, n){
  var v = rows.filter(function(r){ return r[key] > 0; })
    .sort(function(a,b){ return b[key]-a[key] || b.ab-a.ab || (a.name<b.name?-1:1); });
  var out = [], rank = 0, prev = null;
  for(var i=0;i<v.length && out.length<n;i++){
    if(prev===null || v[i][key]!==prev){ rank = i+1; prev = v[i][key]; }
    out.push({rank:rank, r:v[i]});
  }
  return out;
}
function rankHTML(){
  var all = RK.scope==='all';
  var rows = all ? (RK.all||[]) : rkMine();
  var qual = rows.filter(function(r){ return r.ab >= LB_MIN_AB; });

    {t:'홈런 랭킹', ic:'⚾', k:'hr',  src:rows, f:function(v){ return v+'개'; }, cl:'hr'},
    {t:'타율 랭킹', ic:'🎯', k:'avg', src:qual, f:fmtAvg, cl:'av', note:LB_MIN_AB+'타수 이상'},
    {t:'안타 랭킹', ic:'🥎', k:'h',   src:rows, f:function(v){ return v+'개'; }, cl:'ht'}
  ];
  var MED = ['🥇','🥈','🥉'];
  var body = (all && RK.loading) ? '<div class="msg">전체 반 기록을 받는 중…</div>' :
    '<div class="rkg">'+COLS.map(function(C){
      var top = rkTop(C.src, C.k, 10);
      return '<div class="rkc '+C.cl+'"><h4>'+C.ic+' '+C.t+(C.note?'<em>'+C.note+'</em>':'')+'</h4>'+
        (top.length ? top.map(function(e){
          var m = e.rank<=3 ? ' m'+e.rank : '';
          var sub = all ? esc(e.r.cn)+(e.r.grp?' · '+esc(e.r.grp):'') : esc(e.r.grp||'');
          return '<div class="rkr'+m+'"><span class="rk">'+(e.rank<=3 ? MED[e.rank-1] : e.rank)+'</span>'+
            '<span class="nm">'+esc(e.r.name)+'<small>'+sub+'</small></span>'+
            '<span class="vl">'+C.f(e.r[C.k])+'</span></div>';
        }).join('') : '<div class="msg">아직 기록이 없습니다</div>')+'</div>';
    }).join('')+'</div>';
  return '<div class="rkwrap'+(RK.big?' big':'')+'" id="rkwrap">'+
    '<div class="rkh"><div><b>🏆 실시간 랭킹</b><small>'+
      (all ? '전체 반 합산'+(RK.ts ? ' · 업데이트 '+RK.ts.toTimeString().slice(0,5) : '') : esc(S.cur)+' 기록')+'</small></div>'+
      '<div class="row" style="gap:6px">'+
        '<div class="sw"><button data-rk="mine" class="'+(all?'':'on')+'">우리 반</button>'+
        '<button data-rk="all" class="'+(all?'on':'')+'">전체 반</button></div>'+
        (all ? '<button class="btn sm" id="rkRe">↻</button>' : '')+

function vStats(){
  if(!S.cur) return needClass('v-stats');
  var c = cls();
  var t = tally(allAtbats(c), allDefense(c), inningMap(c));
  var ZERO = {ab:0,bb:0,h:0,h2:0,h3:0,hr:0,tb:0,xbh:0,r:0,rbi:0,dOut:0,dPlay:0,inn:0,g:0,

  rows.sort(function(a,b){ return b.avg-a.avg || b.h-a.h; });

  el('v-stats').innerHTML =
    '<h2 class="t">'+esc(S.cur)+' 기록실</h2>'+
    '<p class="st">경기 '+c.games.filter(function(g){return g.status==='done';}).length+'개 누적 · 타율순</p>'+

    leaderHTML(rows)+
    '<div class="card"><div class="row" style="margin-bottom:11px">'+
      '<button class="btn pri" id="exp">구글시트로 내보내기</button>'+
      '<button class="btn" id="csv">CSV 내려받기</button></div>'+
    (rows.length ?
      '<div style="overflow-x:auto"><table><tr><th>번호</th><th>이름</th><th class="n">경기</th><th class="n">이닝</th>'+
      '<th class="n">타수</th><th class="n">안타</th><th class="n">2루타</th><th class="n">3루타</th>'+
      '<th class="n">홈런</th><th class="n">볼넷</th><th class="n">타율</th>'+
      '<th class="n">출루율</th><th class="n">장타율</th><th class="n">OPS</th>'+
      '<th class="n">득점</th><th class="n">타점</th><th class="n">수비<br>참여</th><th class="n">아웃<br>처리</th>'+
      '<th class="n">이닝당<br>기여</th><th class="n">경기당<br>기여</th></tr>'+
      rows.map(function(x){
        return '<tr><td>'+esc(x.num)+'</td><td>'+esc(x.name)+'</td>'+
          '<td class="n">'+x.g+'</td><td class="n">'+x.inn+'</td>'+
          '<td class="n">'+x.ab+'</td><td class="n">'+x.h+'</td>'+
          '<td class="n">'+x.h2+'</td><td class="n">'+x.h3+'</td><td class="n">'+x.hr+'</td>'+
          '<td class="n">'+x.bb+'</td>'+
          '<td class="n"><b>'+fmtAvg(x.avg)+'</b></td>'+
          '<td class="n">'+fmtAvg(x.obp)+'</td><td class="n">'+fmtAvg(x.slg)+'</td>'+
          '<td class="n">'+fmtAvg(x.ops)+'</td>'+
          '<td class="n">'+x.r+'</td><td class="n">'+x.rbi+'</td>'+
          '<td class="n">'+x.dPlay+'</td><td class="n">'+x.dOut+'</td>'+
          '<td class="n"><b>'+x.contrib.toFixed(2)+'</b></td>'+
          '<td class="n">'+x.contribG.toFixed(2)+'</td></tr>';
      }).join('')+'</table></div>'
      : '<div class="msg">기록이 없습니다</div>')+'</div>'+
    scoreCard();

  /* ── 평가 점수표 (2026-2학기 계획: 스트로크20 + 리그20 + 야구40 + 보고서20) ── */
  function scoreCard(){
    if(!c.roster.length) return '';
    var srt = rows.slice().sort(function(a,b){
      return String(a.num).padStart(3,'0') < String(b.num).padStart(3,'0') ? -1 : 1; });
    return '<div class="card"><h3 class="t" style="font-size:15px;margin:0 0 4px">평가 점수</h3>'+
      '<p class="st">탁구 스트로크 20 + 탁구 리그 20 + 야구 40 + 보고서 20 = <b>100점</b> · '+
      '야구 스포츠퍼슨십 카드만 여기서 넣습니다 (최대 5장)</p>'+
      '<div style="overflow-x:auto"><table><tr><th>번호</th><th>이름</th>'+
      '<th class="n">스트로크</th><th class="n">탁구<br>리그</th>'+
      '<th class="n">타율<br>(보정)</th><th class="n">경기당<br>기여</th>'+
      '<th class="n">야구<br>카드</th><th class="n">야구</th>'+
      '<th class="n">보고서</th><th class="n">총점</th></tr>'+
      srt.map(function(x){
        var v = scoreOf(x), sid = sidOf(x);
        function d(n){ return n==null ? '—' : n; }
        return '<tr><td>'+esc(x.num)+'</td><td>'+esc(x.name)+'</td>'+
          '<td class="n sc">'+d(v.st)+'</td><td class="n sc">'+d(v.lg.area)+'</td>'+
          '<td class="n">'+(v.ba==null?'—':fmtAvg(v.ba))+'</td>'+
          '<td class="n">'+(x.g?x.contribG.toFixed(2):'—')+'</td>'+
          '<td class="n"><input type="number" min="0" max="5" style="width:52px;text-align:right" '+
              'data-bc="'+sid+'" value="'+((c.tt[sid]||{}).bcard!=null?(c.tt[sid]||{}).bcard:'')+'"></td>'+
          '<td class="n sc">'+d(v.bs)+'</td>'+
          '<td class="n sc">'+d(v.rs)+'</td>'+
          '<td class="n sc tot"><b>'+v.total+'</b></td></tr>';
      }).join('')+'</table></div>'+
      '<p class="st" style="margin-top:9px">※ 타율은 <b>최소 '+MIN_GAMES+'경기</b> 기준입니다. '+
      '경기 수가 모자라면 부족한 경기 수만큼 아웃을 더해 계산합니다.<br>'+
      '※ 기여도는 기록·순위엔 <b>이닝당</b>을, 점수 환산엔 계획서대로 <b>경기당</b>을 씁니다.</p></div>';
  }

  /* 한 학생의 평가 산출물 한 줄 — 기록 + 환산 점수 + 총점 */
  function sidOf(x){ return (c.roster.filter(function(s){ return s.name===x.name; })[0]||{}).sid; }
  function scoreOf(x){
    var sid = sidOf(x), tt = c.tt[sid] || {}, rp = c.rep[sid] || {};
    var fh  = (tt.fh==null||tt.fh==='') ? null : +tt.fh;
    var bh  = (tt.bh==null||tt.bh==='') ? null : +tt.bh;
    var sum = strokeSum(tt);
    var st  = scStroke(sum);                       // 탁구 스트로크 20
    var lg  = ttLeague(tt);                        // 탁구 리그전 20
    var ba  = adjBA(x);                            // 최소 4경기 보정 타율
    var bA  = scBA(ba);                            // 야구 Ⓐ 타율 30
    var bB  = x.g ? scCon(x.contribG) : null;      // 야구 Ⓑ 경기당 기여 10
    var bC  = Math.max(0, Math.min(5, +tt.bcard || 0));  // 야구 카드 (최대 5장)
    var bs  = (bA==null && bB==null) ? null : Math.min(40, (bA||0)+(bB||0)+bC);
    var rn  = repCount(rp), rs = rn ? scRep(rn) : null;
    return {tt:tt, fh:fh, bh:bh, sum:sum, st:st, lg:lg, ba:ba, bcard:bC, bs:bs,
            repN:rn, rs:rs,
            total:(st||0)+(lg.area||0)+(bs||0)+(rs||0)};
  }
  function blank(v){ return v==null ? '' : v; }
  function tableData(){
    return rows.map(function(x){
      var v = scoreOf(x);
      return [x.num, x.name, x.gender, x.group,
              blank(v.fh), blank(v.bh), blank(v.sum), blank(v.st),
              v.lg.n||'', v.lg.n?v.lg.sum:'', v.lg.avg==null?'':v.lg.avg.toFixed(2),
              v.tt.card==null?'':v.tt.card, blank(v.lg.area),
              x.g, x.inn, x.ab, x.h, v.ba==null?'':fmtAvg(v.ba),
              x.r, x.rbi, x.dPlay, x.dOut,
              x.contrib.toFixed(2), x.contribG.toFixed(2), v.bcard, blank(v.bs),
              v.repN, blank(v.rs), v.total];
    });
  }
  /* ★ Apps Script 브릿지의 HDR 과 «순서·개수가 정확히 같아야» 한다 (2026-09-21 평가계획 개정판, 30열).
     갱신일시는 시트 쪽에서 붙이므로 여기선 보내지 않는다. */
  var HDR = ['번호','이름','성별','조',
             '탁구포핸드','탁구백핸드','스트로크합계','스트로크점수',
             '탁구경기수','탁구총득점','탁구평균득점','탁구카드','탁구리그점수',
             '경기','이닝','타수','안타','타율','득점','타점',
             '수비참여','수비아웃','이닝당기여','경기당기여','야구카드','야구점수',
             '보고서충족','보고서점수','총점'];
  /* CSV 에는 평가에 안 들어가는 기록(2·3루타·홈런·볼넷·출루율·장타율·OPS)까지 얹는다 */
  var CHDR = HDR.slice(0, 17).concat(['2루타','3루타','홈런','볼넷','출루율','장타율','OPS'],
                                     HDR.slice(17));
  function csvData(){
    return tableData().map(function(r, i){
      var x = rows[i];
      return r.slice(0, 17).concat([x.h2, x.h3, x.hr, x.bb,
                                    fmtAvg(x.obp), fmtAvg(x.slg), fmtAvg(x.ops)],
                                   r.slice(17));
    });
  }
  /* 야구 스포츠퍼슨십 카드 입력 (최대 5장) — 탁구 카드와 별개 칸(bcard)에 담는다 */
  el('v-stats').querySelectorAll('[data-bc]').forEach(function(i){
    i.onchange = function(){
      var sid = i.dataset.bc;
      c.tt[sid] = c.tt[sid] || {};
      c.tt[sid].bcard = i.value==='' ? null : Math.max(0, Math.min(5, +i.value));
      syncMisc(S.cur,'tt'); vStats();
    };
  });

  bindRank();
  el('csv').onclick = function(){
    var csv = [CHDR].concat(csvData()).map(function(r){
      return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv'}));
    a.download = S.cur+'_야구기록.csv'; a.click();
  };
  el('exp').onclick = function(){
    var rows = tableData();
    toast('내보내는 중…');
    //  POST 는 no-cors 라 응답을 못 읽는다 → 보낸 뒤 실제로 들어갔는지 세어서 확인한다
    gasPost('saveBaseball', {cn:S.cur, header:HDR, rows:rows})
      .then(function(){ return new Promise(function(r){ setTimeout(r, 1500); }); })
      .then(function(){ return jsonp({action:'getCount', cn:S.cur}); })
      .then(function(r){
        if(r && r.ok && r.count >= rows.length) toast('「'+S.cur+'」 탭에 '+rows.length+'명 저장 완료');
        else if(r && r.ok) toast('「'+S.cur+'」 탭 '+r.count+'행 확인 (보낸 건 '+rows.length+'행)');
        else toast('보내긴 했지만 확인 실패 — 시트를 직접 봐 주세요');
      })
      .catch(function(e){ toast('실패: '+e.message); });
  };
}

/* ═══════════════════════════════════════════════════════════
   🎵 응원가 + 캐스터 타자 소개 (2026-10-02)
   · 수집은 구글 드라이브(학생) → 선생님이 아이패드 「파일」 앱에서 골라 올린다
   · 앱이 약 100초·모노·48kbps mp3 로 줄여서 Firebase(실시간 DB)에 저장 — 모든 기기 공유
     (Firebase Storage 는 유료 요금제가 필요해 실시간 DB 에 base64 로 둔다. 반 하나 ≈ 20MB)
       songIdx/<반>/<학생>  = {name, start, v, dur, size}   ← 목록·설정(가벼움)
       songData/<반>/<학생> = {v, b64}                      ← 음원(무거움, 필요할 때만 받는다)
   · 기기는 받은 음원을 IndexedDB 에 보관 → 다음부터는 즉시 재생
   · 재생은 Web Audio — 첫 터치 때 한 번 «잠금 해제» 해 두면 그 뒤로는 버튼 없이도 이어서 틀 수 있다
     (아이패드 사파리는 사용자가 누른 순간에만 소리를 허락한다. 후배 앱은 이 때문에 가끔 무음)
   · 타자 소개는 아이패드 내장 음성(speechSynthesis). 설정에 구글 음성 키가 있으면 구글 목소리.
   ═══════════════════════════════════════════════════════════ */
var SONG = {
  ctx:null, gain:null, src:null, cur:null, paused:false, speaking:false,
  auto: (function(){ try{ return localStorage.getItem('bb.cheer') !== '0'; }catch(e){ return true; } })(),
  cache:{}, idx:{}, idxRef:null, idxKey:'', seq:0
};
var SONG_SEC = 100, SONG_RATE = 22050, SONG_KBPS = 48;
function songKey(cn, sid){ return ck(cn)+'/'+ck(sid); }

/* ── 오디오 잠금 해제 — 아무 곳이나 처음 누를 때 ── */
function audioCtx(){
  if(!SONG.ctx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    SONG.ctx = new AC();
    SONG.gain = SONG.ctx.createGain(); SONG.gain.connect(SONG.ctx.destination);
  }
  return SONG.ctx;
}
function unlockAudio(){
  var c = audioCtx(); if(!c) return;
  if(c.state === 'suspended' && !SONG.paused) c.resume();
  if(!SONG._unlocked){                      // 무음 한 조각을 틀어 두면 iOS 가 이 컨텍스트를 허락한다
    try{ var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); }catch(e){}
    SONG._unlocked = true;
  }
}
document.addEventListener('touchend', unlockAudio, true);
document.addEventListener('click', unlockAudio, true);

/* ── IndexedDB (기기 보관함) ── */
var _idb = null;
function idb(){
  if(_idb) return _idb;
  _idb = new Promise(function(res, rej){
    try{
      var r = indexedDB.open('bb_cheer_v1', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('songs'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
  return _idb;
}
function idbGet(k){
  return idb().then(function(db){ return new Promise(function(res){
    var q = db.transaction('songs','readonly').objectStore('songs').get(k);
    q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); };
  }); }).catch(function(){ return null; });
}
function idbPut(k, v){
  return idb().then(function(db){ return new Promise(function(res){
    var t = db.transaction('songs','readwrite'); t.objectStore('songs').put(v, k);
    t.oncomplete = function(){ res(true); }; t.onerror = function(){ res(false); };
  }); }).catch(function(){ return false; });
}
function b64ToBytes(b64){
  var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function bytesToB64(u8){
  var s = '', CH = 0x8000;
  for(var i=0;i<u8.length;i+=CH) s += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(s);
}
function decodeAudio(ab){
  var c = audioCtx();
  return new Promise(function(res, rej){
    try{
      var p = c.decodeAudioData(ab, res, rej);       // 옛 사파리는 콜백만 받는다
      if(p && p.then) p.then(res, rej);
    }catch(e){ rej(e); }
  });
}

/* ── 반별 목록 감시 ── */
function watchSongIdx(cn){
  if(!DB || !cn) return;
  if(SONG.idxKey === cn && SONG.idxRef) return;
  if(SONG.idxRef){ try{ SONG.idxRef.off(); }catch(e){} }
  SONG.idxKey = cn;
  SONG.idxRef = DB.ref(ROOT()+'/songIdx/'+ck(cn));
  SONG.idxRef.on('value', function(s){
    SONG.idx[cn] = s.val() || {};
    if(V==='song') vSong();
    SONG._pf = SONG._pf || {};
    if(V==='game' && !SONG._pf[cn]){ SONG._pf[cn] = 1; prefetchClassSongs(cn); }
  });
}
function songMeta(cn, sid){ return ((SONG.idx[cn]||{})[ck(sid)]) || null; }

/* ── 🔗 수노 링크 응원가 (2026-10-06) ──
   수노가 9/3 부터 무료 다운로드를 막아(평생 7곡) 학생들이 파일 대신 «공유 링크»를 냈다.
   링크에서 음원만 빼내는 건 수노가 막아 두었으므로 하지 않는다 → 수노 공식 플레이어(embed)를 창으로 띄우고 ▶ 는 사람이 누른다.
   그래서 자동 재생·시작(초)·반복은 안 된다. 파일로 올린 학생은 예전처럼 자동 재생. */
function sunoId(text){
  var m = String(text||'').match(/suno\.(?:com|ai)\/(?:song|embed)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i)
       || String(text||'').match(/\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b/i);
  return m ? m[1].toLowerCase() : '';
}
function sunoUrl(text){                                   // 붙여 넣은 글에서 수노 주소만 (짧은 공유 주소 suno.com/s/… 포함)
  var m = String(text||'').match(/https?:\/\/(?:www\.)?(?:suno\.(?:com|ai)|mureka\.ai)\/[^\s"'<>]+/i);
  return m ? m[0].replace(/[).,]+$/, '') : '';
}
function sunoEmbed(m){ return 'https://suno.com/embed/'+(m.suno || '')+'/'; }
function showSuno(m, label){
  closeSuno();
  if(!m || !m.link) return;
  var d = document.createElement('div'); d.id = 'sunoBox';
  d.innerHTML = '<div class="sh"><span>🎵 '+esc(label||'응원가')+' <small>▶ 를 눌러 재생</small></span><button id="sunoX">✕ 닫기</button></div>'+
    (m.suno ? '<iframe src="'+esc(sunoEmbed(m))+'" allow="autoplay; encrypted-media" title="수노 플레이어"></iframe>'
            : '<div style="padding:18px 12px;text-align:center"><a class="btn pri" style="font-size:18px;padding:14px 22px;display:inline-block" href="'+esc(m.link)+'" target="_blank" rel="noopener">▶ '+(/mureka/i.test(m.link)?'무레카':'수노')+'에서 열어 재생</a></div>')+
    '<div class="sf">수노 링크 응원가는 자동 재생이 안 돼요 · 안 보이면 <a href="'+esc(m.link || sunoEmbed(m))+'" target="_blank" rel="noopener">수노에서 열기</a></div>';
  document.body.appendChild(d);
  el('sunoX').onclick = closeSuno;
  SONG.cur = {sid:'', label:(label||'응원가')+' (수노)'}; songBar();
}
function closeSuno(){ var b = el('sunoBox'); if(b) b.parentNode.removeChild(b); }
function saveSunoLink(cn, s, text){
  var url = sunoUrl(text) || text.trim(), id = sunoId(text);
  if(!id && !/suno\.|mureka\.ai\/.*song/i.test(url)) return Promise.reject(new Error('수노·무레카 곡 링크가 아니에요'));
  if(!DB) return Promise.reject(new Error('Firebase 연결이 필요합니다'));
  var meta = {name:/mureka/i.test(url) ? '무레카 링크' : '수노 링크', link:url, suno:id || '', start:0, v:Date.now(), dur:0, size:0, by:DEVICE};
  var sk = ck(s.sid);
  return DB.ref(ROOT()+'/songData/'+ck(cn)+'/'+sk).remove().then(function(){
    return DB.ref(ROOT()+'/songIdx/'+ck(cn)+'/'+sk).set(meta);
  });
}

/* 음원 하나 준비 — 메모리 → 기기 보관함 → Firebase 순서로 찾는다 */
function ensureSong(cn, sid){
  var m = songMeta(cn, sid); if(!m || m.link || !audioCtx()) return Promise.resolve(null);
  var k = songKey(cn, sid), hit = SONG.cache[k];
  if(hit && hit.v === m.v) return Promise.resolve(hit.buf);
  return idbGet(k).then(function(rec){
    if(rec && rec.v === m.v && rec.blob) return rec.blob.arrayBuffer ? rec.blob.arrayBuffer() : new Response(rec.blob).arrayBuffer();
    if(!DB) return null;
    return DB.ref(ROOT()+'/songData/'+ck(cn)+'/'+ck(sid)).once('value').then(function(s){
      var d = s.val(); if(!d || !d.b64) return null;
      var u8 = b64ToBytes(d.b64), blob = new Blob([u8], {type:'audio/mpeg'});
      idbPut(k, {v:d.v, blob:blob});
      return u8.buffer;
    });
  }).then(function(ab){
    if(!ab) return null;
    return decodeAudio(ab).then(function(buf){ SONG.cache[k] = {v:m.v, buf:buf}; return buf; });
  }).catch(function(e){ console.warn('응원가 준비 실패', e); return null; });
}
/* 반 전체를 미리 받아 둔다 (경기 화면에 들어올 때 뒤에서 조용히) */
function prefetchClassSongs(cn){
  var ix = SONG.idx[cn] || {};
  Object.keys(ix).reduce(function(p, sk){
    return p.then(function(){
      var k = ck(cn)+'/'+sk;
      return idbGet(k).then(function(rec){
        if(ix[sk].link || (rec && rec.v === ix[sk].v)) return;
        if(!DB) return;
        return DB.ref(ROOT()+'/songData/'+ck(cn)+'/'+sk).once('value').then(function(s){
          var d = s.val(); if(d && d.b64) return idbPut(k, {v:d.v, blob:new Blob([b64ToBytes(d.b64)], {type:'audio/mpeg'})});
        });
      });
    });
  }, Promise.resolve()).catch(function(){});
}

/* ── 재생 ── */
function stopSong(fade){
  var c = SONG.ctx, s = SONG.src; SONG.src = null; SONG.cur = null;
  if(!c || !s) return;
  try{
    var t = c.currentTime, f = (fade==null ? .35 : fade);
    SONG.gain.gain.cancelScheduledValues(t);
    SONG.gain.gain.setValueAtTime(SONG.gain.gain.value, t);
    SONG.gain.gain.linearRampToValueAtTime(0, t + f);
    s.stop(t + f + .02);
  }catch(e){ try{ s.stop(); }catch(_){} }
}
function playSong(cn, sid, label){
  var my = ++SONG.seq;
  return ensureSong(cn, sid).then(function(buf){
    if(my !== SONG.seq) return false;                   // 그사이 다른 타자로 넘어갔다
    if(!buf){ songBar(); return false; }
    stopSong(.15);
    var c = SONG.ctx, m = songMeta(cn, sid) || {}, st = Math.max(0, Math.min(+m.start||0, buf.duration - 2));
    var s = c.createBufferSource(); s.buffer = buf; s.loop = true;
    s.loopStart = st; s.loopEnd = buf.duration;
    var g = SONG.gain.gain, t = c.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(0, t); g.linearRampToValueAtTime(1, t + .4);
    s.connect(SONG.gain); s.start(0, st);
    SONG.src = s; SONG.cur = {sid:sid, label:label};
    if(SONG.paused){ SONG.paused = false; c.resume(); }
    songBar();
    return true;
  });
}
function togglePause(){
  var c = SONG.ctx; if(!c) return;
  if(SONG.paused){ SONG.paused = false; c.resume(); }
  else { SONG.paused = true; c.suspend(); try{ speechSynthesis.pause(); }catch(e){} }
  if(!SONG.paused){ try{ speechSynthesis.resume(); }catch(e){} }
  songBar();
}
function stopAll(){
  SONG.seq++; stopSong(.2); closeSuno();
  try{ speechSynthesis.cancel(); }catch(e){}
  if(SONG._gsrc){ try{ SONG._gsrc.stop(); }catch(e){} SONG._gsrc = null; }
  SONG.speaking = false; songBar();
}

/* ── 캐스터 멘트 ── */
function korAvg(v){                      // .333 → 3할 3푼 3리
  var n = Math.round(v*1000);
  if(n >= 1000) return '10할';
  if(n === 0) return '0할';
  var h = Math.floor(n/100), p = Math.floor(n/10)%10, r = n%10, o = '';
  if(h) o += h+'할';
  if(p) o += (o?' ':'')+p+'푼';
  if(r) o += (o?' ':'')+r+'리';
  return o;
}
var KIND_SAY = ['아웃','안타','2루타','3루타','홈런','볼넷','야수선택','실책 출루'];
function introText(g, b, idx, cum){
  var me = cum[b.sid] || {ab:0,h:0,hr:0,rbi:0,avg:0};
  var t = (idx+1)+'번 타자, '+b.name+'! ';
  if(!me.ab && !me.bb) t += '오늘 첫 타석입니다. ';
  else {
    t += '시즌 타율 '+korAvg(me.avg)+', '+me.ab+'타수 '+me.h+'안타';
    if(me.hr) t += ', 홈런 '+me.hr+'개';
    if(me.rbi) t += ', 타점 '+me.rbi;
    t += '. ';
  }
  var today = (g.atbats||[]).filter(function(a){ return a.sid===b.sid; });
  if(today.length){
    var last = today[today.length-1];
    t += '앞 타석에서는 '+(last.kind===0 ? '아웃되었습니다' : KIND_SAY[last.kind]+(last.kind>=1&&last.kind<=4?'를 쳤습니다':'로 나갔습니다'))+'. ';
  }
  var rk = bestRank(cum, b.sid);
  if(rk && rk.r <= 3) t += '현재 반 '+rk.t+' '+rk.r+'위! ';
  return t;
}
function pickVoice(){
  try{
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^ko/i.test(v.lang); });
    var pref = vs.filter(function(v){ return /premium|enhanced|향상|neural/i.test(v.name); });
    return pref[0] || vs[0] || null;
  }catch(e){ return null; }
}
function speakWeb(text, done){
  var fired = false, fin = function(){ if(fired) return; fired = true; SONG.speaking = false; songBar(); done && done(); };
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; var v = pickVoice(); if(v) u.voice = v;
    u.rate = 1.08; u.pitch = 1.08; u.volume = 1;
    u.onend = fin; u.onerror = fin;
    SONG.speaking = true; songBar();
    speechSynthesis.speak(u);
    setTimeout(fin, 1500 + text.length*170);          // iOS 가 onend 를 빠뜨릴 때를 대비
  }catch(e){ fin(); }
}
/* 구글 한국어 목소리 (10/6, voices API 41개). Chirp3 HD 가 가장 자연스럽다 — Chirp3 는 pitch 를 보내면 오류 */

/* 구글 음성 — 키가 있을 때만. 같은 문장은 한 번 받은 것을 다시 쓴다 */
var _gtts = {};
function ttsVoiceName(){ return S.cfg.ttsVoice || 'ko-KR-Chirp3-HD-Puck'; }
function googleTTS(text){
  var key = (S.cfg.ttsKey||'').trim(); if(!key || !audioCtx()) return Promise.reject('no key');
  var ck = ttsVoiceName()+'|'+text; if(_gtts[ck]) return Promise.resolve(_gtts[ck]);
  return fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(key), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({input:{text:text}, voice:{languageCode:'ko-KR', name:ttsVoiceName()},
                          audioConfig:/Chirp/.test(ttsVoiceName()) ? {audioEncoding:'MP3', speakingRate:1.08} : {audioEncoding:'MP3', speakingRate:1.08, pitch:1.0}})
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j.audioContent) throw new Error((j.error&&j.error.message)||'구글 음성 실패');
    return decodeAudio(b64ToBytes(j.audioContent).buffer);
  }).then(function(buf){ _gtts[ck] = buf; return buf; });
}
function speak(text, done){
  if((S.cfg.ttsKey||'').trim()){
    SONG.speaking = true; songBar();
    googleTTS(text).then(function(buf){
      var c = SONG.ctx, s = c.createBufferSource(); s.buffer = buf; s.connect(c.destination);
      SONG._gsrc = s;
      s.onended = function(){ if(SONG._gsrc===s){ SONG._gsrc = null; SONG.speaking = false; songBar(); done && done(); } };
      s.start(0);
    }).catch(function(e){ console.warn('구글 음성 → 기기 음성으로', e); speakWeb(text, done); });
  } else speakWeb(text, done);
}

/* 타자가 바뀔 때 — 소개 멘트 → 끝나면 응원가 반복 */
function cheerBatter(g, force){
  if(!SONG.auto && !force) return;
  var atk = atkSide(g), order = atk==='H' ? g.orderH : g.orderA, b = order[g.st.idx];
  if(!b || g.status!=='live'){ stopAll(); return; }
  var c = cls(), cum = tally(allAtbats(c), allDefense(c), {});
  var my = ++SONG.seq;
  stopSong(.3); closeSuno(); try{ speechSynthesis.cancel(); }catch(e){}
  ensureSong(S.cur, b.sid);                            // 멘트 나가는 동안 미리 준비
  speak(introText(g, b, g.st.idx, cum), function(){
    if(my !== SONG.seq) return;
    SONG.seq--;                                        // playSong 이 다시 올린다
    var sm = songMeta(S.cur, b.sid);
    if(sm && sm.link) showSuno(sm, b.name+' 응원가');      // 수노 링크 → 플레이어 창 (▶ 는 사람이)
    else playSong(S.cur, b.sid, b.name+' 응원가');
    var nx = order[g.st.idx+1]; if(nx) setTimeout(function(){ ensureSong(S.cur, nx.sid); }, 1500);
  });
}
