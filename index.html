<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>야구 수행평가 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚾</text></svg>">
<script>try{if(localStorage.getItem("bb.theme")==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
<style>
:root{
  --bg:#0d1418; --panel:#152026; --panel2:#1b2930; --line:#26363e; --line2:#324650;
  --tx:#e8f0f2; --tx2:#9fb3bb; --tx3:#6b828c;
  --grass:#1f7a4d; --dirt:#c08a4a;
  --hit:#2fa96b; --out:#d2544a; --warn:#e0a33c; --info:#3d8fd1;
  --home:#3d8fd1; --away:#d2544a;
  /* 경기 화면·랭킹용 남색 계열 (수비 배치도 서랍은 .gb 밖에 붙으므로 루트에 둔다) */
  --nv0:#141f3a; --nv1:#1c2b4f; --nvl:#3a5590; --nvl2:#4a6ab0; --gold:#f5c451; --grn:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* ★ 아이패드에서 버튼을 빠르게 여러 번 누르면 화면이 확대되던 문제(더블탭 확대) — manipulation 으로 막는다.
   입력칸은 글자가 16px 보다 작으면 누를 때 사파리가 확대하므로 16px 로 둔다. */
html{-webkit-text-size-adjust:100%}
@media (pointer:coarse){ input,select,textarea{font-size:16px} }
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--panel2);
  border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
.app{display:flex;height:100%}

/* ── 사이드바 ───────────────────────────── */
.side{width:190px;flex:0 0 190px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 10px;gap:4px}
.brand{font-size:15px;font-weight:800;padding:6px 10px 12px;letter-spacing:-.3px}
.brand small{display:block;font-size:11px;color:var(--tx3);font-weight:500;margin-top:2px}
.nav{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;
  color:var(--tx2);font-size:14px;font-weight:600;width:100%;text-align:left}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--line);color:var(--tx)}
.nav i{font-style:normal;font-size:16px;width:20px;text-align:center}
.side .foot{margin-top:auto;font-size:11px;color:var(--tx3);padding:8px 10px;line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--tx3);margin-right:5px}
.dot.ok{background:var(--hit)} .dot.off{background:var(--warn)}

/* ── 본문 ─────────────────────────────── */
.main{flex:1;min-width:0;overflow-y:auto;padding:18px 22px 60px}
.vw{display:none} .vw.on{display:block}
h2.t{font-size:19px;font-weight:800;margin:0 0 3px;letter-spacing:-.3px}
p.st{font-size:12.5px;color:var(--tx3);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:13px}
.card h3{font-size:13px;font-weight:700;margin:0 0 11px;color:var(--tx2);letter-spacing:.02em}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{background:var(--line);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;
  font-size:13.5px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--info);border-color:var(--info);color:#fff}
.btn.ok{background:var(--hit);border-color:var(--hit);color:#fff}
.btn.dn{background:var(--out);border-color:var(--out);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;gap:9px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.cbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:15px 8px;
  text-align:center;font-weight:800;font-size:15px}
.cbtn:hover{border-color:var(--info)}
.cbtn.on{background:var(--info);border-color:var(--info);color:#fff}
.cbtn small{display:block;font-size:11px;font-weight:500;color:var(--tx3);margin-top:3px}
.cbtn.on small{color:rgba(255,255,255,.8)}
/* 조편성 카드 남녀 구분 — 외곽선 파랑/핑크 (10/6 사용자 요청) */
.cbtn.gm{border:2px solid #4a9be0} .cbtn.gm small{color:#8ec5f0}
.cbtn.gf{border:2px solid #e06aaf} .cbtn.gf small{color:#f0a8d8}
html[data-theme=light] .cbtn.gm{border-color:#3b82f6} html[data-theme=light] .cbtn.gm small{color:#1e40af}
html[data-theme=light] .cbtn.gf{border-color:#ec4899} html[data-theme=light] .cbtn.gf small{color:#9d174d}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;color:var(--tx3);font-weight:700;letter-spacing:.03em}
td.n,th.n{text-align:right}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:var(--line);color:var(--tx2)}
.tag.m{background:#1d3d55;color:#8ec5f0} .tag.f{background:#4a2340;color:#f0a8d8}
.tag.dup{background:#4a3a1a;color:var(--warn)}
.msg{font-size:12.5px;color:var(--tx3);padding:22px;text-align:center}
/* 자동 계산된 점수 칸 — 입력칸과 구분되게 */
td.sc{font-weight:900;font-variant-numeric:tabular-nums;color:#8fd0aa;font-size:14px}
td.sc.tot{color:var(--warn);font-size:15px}

/* ── 부문별 순위 (기록실) ──
   평가 점수와는 무관한 「재미·동기부여」용 기록판. 이름 칸을 넓게 쓴다. */
.lbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.lb{background:#12181c;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.lb h4{margin:0 0 8px;font-size:12px;font-weight:900;color:#8fd0aa;letter-spacing:.03em;
  display:flex;align-items:center;justify-content:space-between}
.lb h4 em{font-style:normal;font-size:10.5px;color:var(--tx3);font-weight:700}
.lb.rate h4{color:#e0a33c}
.lb.def h4{color:#7fb4e0}
.lb ol{margin:0;padding:0;list-style:none}
.lb li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;
  border-top:1px solid #1b2429}
.lb li:first-child{border-top:0}
.lb .rk{flex:0 0 auto;width:17px;height:17px;border-radius:5px;background:#1e282e;color:#93aab8;
  font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lb li.top .rk{background:var(--warn);color:#241a05}
.lb .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:700;color:var(--tx)}
.lb li.top .nm{font-weight:900;color:#fff}
.lb .vl{flex:0 0 auto;font-weight:900;font-variant-numeric:tabular-nums;color:#cfdde5}
.lb li.top .vl{color:var(--warn)}
.lb .none{font-size:11.5px;color:var(--tx3);padding:6px 0}
.lbnote{font-size:11.5px;color:var(--tx3);margin:10px 0 0;line-height:1.5}
.sw{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.sw button{padding:8px 15px;font-size:13px;font-weight:700;color:var(--tx3)}
.sw button.on{background:var(--info);color:#fff}

/* 조편성 카드 안의 학생 줄 */
.pl{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:14px}
.pl .nm{flex:1;min-width:0}

/* ── 경기 화면 (2026-10 개편) ─────────────────────────────────
   아이패드 가로(1180×820)를 기준으로 짠 3단 구성.
     위   = 두 팀 점수 카드 + 가운데 이닝·볼카운트
     아래 = 현재 타자 카드 | 주루 다이아몬드·타격 버튼 | 타격 순서
   수비 배치도는 늘 띄우지 않고 서랍(☰ 수비 배치도)으로 꺼낸다.

   ★ 크기는 전부 --u 의 배수로만 쓴다. --u 는 화면 폭·높이 중 «모자란 쪽» 에 맞춰
     정해지므로, 아이패드든 교실 TV 든 화면 비율이 그대로 유지된다. */
.gb{
  --u:clamp(9px, min(.98vw, 1.48vh), 19px);
  /* ★ 위(점수)·아래(타자·주루·타순) 줄이 같은 칸 폭을 써야 세로 경계선이 맞는다 */
  --cols:repeat(3, minmax(0,1fr));        /* 세 칸 같은 폭 (사용자 요청) */
  display:flex;flex-direction:column;gap:calc(var(--u) * .7);
  height:calc(100vh - 36px);height:calc(100dvh - 36px);min-height:520px;
  background:var(--nv0);border-radius:14px;padding:calc(var(--u) * .8);
  border:1px solid #2b3f6b}

/* 맨 위 도구줄 */
.gbar{display:flex;align-items:center;gap:calc(var(--u) * .5);flex:0 0 auto;flex-wrap:wrap}
.gbar .gt{font-size:calc(var(--u) * 1.15);font-weight:800;color:#c9d6f0;margin-right:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gbar .gt small{font-size:calc(var(--u) * .9);color:#7186b0;font-weight:600;margin-left:.5em}
.gbar button{background:#1f3260;border:1px solid var(--nvl);border-radius:calc(var(--u) * .55);
  padding:calc(var(--u) * .5) calc(var(--u) * .9);font-size:calc(var(--u) * 1);font-weight:800;
  color:#d6e2f8;white-space:nowrap}
.gbar button:active{filter:brightness(1.3)}
.gbar button.fb{background:#123a2a;border-color:#2f8f5f;color:#9ef0c0}
.gbar button.fb.on{background:#2f8f5f;color:#fff}
.sbar{display:inline-flex;align-items:center;gap:calc(var(--u) * .3);min-width:0;flex:0 1 auto}
.gbar button{height:calc(var(--u) * 3.6)}                  /* 손가락 크기(약 44px)로 — 도구줄 버튼 높이 통일 */
.sbar{gap:calc(var(--u) * .4)}
.sbar button{min-width:calc(var(--u) * 4);padding:0 calc(var(--u) * .8);font-size:calc(var(--u) * 1.25)}
.sbar #sPlay,.sbar #sStop{min-width:calc(var(--u) * 6)}
.sbar #sPlay{background:#173a5e;border-color:#3d7fc0;color:#fff}
.sbar button.on{background:#123a2a;border-color:#2f8f5f;color:#9ef0c0}
.sbar .slab{background:#0f1b38;border:1px solid #2a4580;border-radius:calc(var(--u) * .55);padding:calc(var(--u) * .55) calc(var(--u) * .8);margin-right:calc(var(--u) * .6);font-size:calc(var(--u) * 1.05);font-weight:800;color:#c9d6f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:calc(var(--u) * 13)}
.sbar .slab.pz{color:var(--gold)}
/* 수노 링크 응원가 — 공식 플레이어 창 (2026-10-06: 수노 다운로드 제한으로 링크 제출) */
#sunoBox{position:fixed;right:12px;bottom:12px;z-index:60;width:min(420px,calc(100vw - 24px));background:#0f1b38;border:2px solid #3d7fc0;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
#sunoBox .sh{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#fff;font-weight:800;font-size:15px}
#sunoBox .sh span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sunoBox .sh small{color:#ffd166;font-weight:700}
#sunoBox .sh button{background:#24345e;border:1px solid #3d7fc0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
#sunoBox iframe{display:block;width:100%;height:240px;border:0;background:#000}
#sunoBox .sf{padding:6px 10px 9px;font-size:12px;color:#c9d6f0}
#sunoBox .sf a{color:#9ecbff}
html[data-theme=light] .sbar .slab{color:#1d2b47;background:#f3f6fa;border-color:#c9d3e1}
html[data-theme=light] .sbar button.on{background:#e7f7ed;border-color:#16a34a;color:#166534}
.gbar button.dn{background:#4a1a1a;border-color:#a8433a;color:#ffb3aa}

/* ── 점수 줄 ── */
.gsc{display:grid;grid-template-columns:var(--cols);gap:calc(var(--u) * .7);flex:0 0 auto}
.tcard{position:relative;border-radius:calc(var(--u) * 1);padding:calc(var(--u) * .5) calc(var(--u) * 1);
  background:var(--nv1);border:2px solid #34497a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-width:0;transition:all .2s}
.tcard .tn{font-size:calc(var(--u) * 1.6);font-weight:900;letter-spacing:-.3px;color:#fff;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .ts{font-size:calc(var(--u) * 5.2);font-weight:900;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;margin:calc(var(--u) * .1) 0}
.tcard .tf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
.tcard .tf .th{justify-self:start}
.tcard .tb{font-size:calc(var(--u) * .95);font-weight:800;padding:calc(var(--u) * .22) calc(var(--u) * .8);
  border-radius:calc(var(--u) * .4);background:#283b66;color:#8ea3cc;letter-spacing:.06em}
.tcard .th{font-size:calc(var(--u) * .95);color:#8ea3cc;font-weight:800}
.tcard.H .tn{color:#8fbaf2} .tcard.A .tn{color:#f29c92}
.tcard.atk.H{background:linear-gradient(180deg,#183a6e,#112a52);border-color:#4f8fe6;
  box-shadow:0 0 calc(var(--u)*1.4) rgba(79,143,230,.45)}
.tcard.atk.A{background:linear-gradient(180deg,#5a1f22,#3e1517);border-color:#e6675a;
  box-shadow:0 0 calc(var(--u)*1.4) rgba(230,103,90,.45)}
.tcard.atk .tb{background:var(--gold);color:#2a1d02}


/* 가운데 위 — 예전 전광판 점수표를 칸에 꽉 차게 (사용자 요청: "크고 명확하게") */
.gmid{background:var(--nv1);border:1px solid #34497a;border-radius:calc(var(--u) * 1);overflow:hidden;
  display:flex;min-width:0;padding:0}
.isc{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.isc th{text-align:center;font-size:calc(var(--u) * 1.05);font-weight:900;color:#93aab8;background:#18284c;
  padding:calc(var(--u) * .3) 0;letter-spacing:.04em;height:calc(var(--u) * 2)}
.isc th.inh{width:26%;color:#7d92ba;letter-spacing:.04em}
.isc th.cur{background:#28426e;color:var(--gold)}
.isc th.rh{color:#ff7b6e} .isc th.hh{color:#e0a33c}
.isc th.adjh{width:calc(var(--u) * 2.8)}
.isc td{text-align:center;font-weight:900;font-size:calc(var(--u) * 2.3);color:#cfdde5;line-height:1;
  border-top:1px solid #2c3e66;padding:0}
.isc td.z{color:#55688f}
.isc td.now{background:rgba(245,196,81,.08)}
.isc td.tm{font-size:calc(var(--u) * 1.7);color:#fff;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:0 calc(var(--u) * .4)}
.isc tr.h td.tm{background:linear-gradient(180deg,#4a86d6,#2b5fa8)}
.isc tr.a td.tm{background:linear-gradient(180deg,#d2564a,#a83d33)}
.isc td.rr{font-size:calc(var(--u) * 2.9);color:#fff;background:#4a2430}
.isc td.hh{font-size:calc(var(--u) * 2.9);color:#e0a33c}
.isc .adj{display:flex;flex-direction:column;gap:calc(var(--u) * .2);align-items:center}
.isc .adj button{width:calc(var(--u) * 1.9);height:calc(var(--u) * 1.3);border-radius:calc(var(--u) * .3);
  background:#24375e;border:1px solid #3a4f7c;font-size:calc(var(--u) * .65);font-weight:900;color:#8aa2b0;line-height:1}

/* 주루 칸 맨 위 — 이닝 + 볼카운트 띠 (심판이 보면서 누르는 볼·스트라이크 버튼과 같은 칸) */
.cstrip{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u) * .6);flex:0 0 auto;flex-wrap:nowrap;white-space:nowrap;
  background:#15223f;border:1px solid #34497a;border-radius:calc(var(--u) * .7);
  padding:calc(var(--u) * .45) calc(var(--u) * .8)}
.ginn{font-size:calc(var(--u) * 1.7);font-weight:900;color:var(--gold);letter-spacing:-.3px;line-height:1;white-space:nowrap}
.cnt{display:flex;gap:calc(var(--u) * .7);align-items:center;justify-content:center;flex-wrap:nowrap}
.cstrip .lamp{width:calc(var(--u) * 1.75);height:calc(var(--u) * 1.75)}
.cstrip .cnt .k{font-size:calc(var(--u) * 1.3)}
.cnt .g{display:flex;align-items:center;gap:calc(var(--u) * .3)}
.cnt .k{font-size:calc(var(--u) * 1.35);font-weight:900;color:#7d92ba;width:1.1em;text-align:center}
.lamp{width:calc(var(--u) * 1.6);height:calc(var(--u) * 1.6);border-radius:99px;
  background:#131f3b;border:2px solid #3a4f7c}
.lamp.b{background:var(--grn);border-color:#86efac;box-shadow:0 0 calc(var(--u)*.6) rgba(74,222,128,.6)}
.lamp.s{background:var(--gold);border-color:#fde68a;box-shadow:0 0 calc(var(--u)*.6) rgba(245,196,81,.6)}
.lamp.o{background:#ef4444;border-color:#fca5a5}
.prog{display:flex;align-items:baseline;gap:calc(var(--u) * .35);white-space:nowrap}
.prog b{font-size:calc(var(--u) * 1.7);font-weight:900;color:#fff;line-height:1}
.prog b small{font-size:calc(var(--u) * 1.1);color:#8ea3cc;font-weight:800}
.prog span{font-size:calc(var(--u) * .9);font-weight:800;color:#8ea3cc}
.prog em{font-style:normal;font-size:calc(var(--u) * .95);font-weight:900;color:#fca5a5;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:calc(var(--u) * .35);
  padding:calc(var(--u) * .12) calc(var(--u) * .45);margin-left:calc(var(--u) * .2)}

/* ── 아래 3단 ── */
/* 공수교대 — 팀 칸이 제자리에서 휘리릭 뒤집히며 공격 ↔ 수비로 바뀐다 (사용자 요청) */
.gmn{perspective:1600px}
@keyframes flipIn{0%{transform:rotateY(-180deg);opacity:.15}45%{opacity:.15}55%{opacity:1}100%{transform:rotateY(0);opacity:1}}
.gmn.swp .sl,.gmn.swp .sr{animation:flipIn .7s cubic-bezier(.3,.7,.2,1);backface-visibility:hidden;transform-origin:50% 50%}
.gmn{flex:1 1 auto;min-height:0;display:grid;gap:calc(var(--u) * .7);
  grid-template-columns:var(--cols)}
.gcol{min-height:0;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u) * .6);
  background:var(--nv1);border:1px solid #34497a;border-radius:calc(var(--u) * 1.1);padding:calc(var(--u) * .7)}


/* 수비 배치도 칸 — 늘 보인다 */
.fph{display:flex;align-items:center;gap:calc(var(--u) * .5);flex:0 0 auto;min-width:0}
.fph .pt{padding:calc(var(--u) * .3) calc(var(--u) * .8);border-radius:calc(var(--u) * .45);
  font-size:calc(var(--u) * 1.3);font-weight:900;color:#fff;white-space:nowrap}
.fph .pt.H{background:linear-gradient(180deg,#3f7fd0,#2b5fa8)} .fph .pt.A{background:linear-gradient(180deg,#d2564a,#a83d33)}
.fph .pmode{font-size:calc(var(--u) * .85);font-weight:900;letter-spacing:.1em;color:#7d95a3;
  background:#283b66;border-radius:99px;padding:calc(var(--u) * .2) calc(var(--u) * .6)}
.fph .fhint{margin-left:auto;font-size:calc(var(--u) * .95);font-weight:800;color:#7d92ba;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fph .fhint.on{color:var(--gold)}
/* ★ 구장은 칸의 폭·높이 중 모자란 쪽에 맞춰 비율 그대로 (container query) */
.fwrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
/* 결과 칩 — 안타(초록) · 장타(진초록) · 홈런(금) · 포볼/야선(파랑) · 아웃(빨강) */
.rc{display:inline-flex;align-items:center;gap:.25em;font-size:calc(var(--u) * .88);font-weight:900;
  padding:calc(var(--u) * .14) calc(var(--u) * .45);border-radius:calc(var(--u) * .35);white-space:nowrap;
  background:#163a27;color:#86efac;border:1px solid #2f7a4f}
.rc.x{background:#1f4a2f;color:#bbf7d0;border-color:#3f9a63}
.rc.hr{background:linear-gradient(180deg,#ffe08a,#f5b83d);color:#2a1d02;border-color:#f5c451}
.rc.bb{background:#1a2c4f;color:#9cc1f0;border-color:#3b5d96}
.rc.out{background:#552126;color:#ffc2bd;border-color:#a8433a}
/* 주루 + 타격 */

.brun{position:relative;flex:1 1 auto;min-height:calc(var(--u) * 9);display:flex;
  align-items:center;justify-content:center}
/* ★ 정사각형 칸 — 높이를 기준으로 폭을 잡아(width:auto) 마름모가 안 찌그러진다 */
.dia{position:relative;aspect-ratio:1;height:100%;width:auto;max-width:100%;max-height:calc(var(--u) * 27)}
/* 중계 화면 스타일 베이스 (사용자 선택 2026-10-02) — 흙·잔디 없이 납작한 마름모 3개 + 작은 홈.
   빈 루 = 회색, 주자 있는 루 = 금색 + 이름표. 입력판이라 크기는 크게 유지한다. */
.bs{position:absolute;width:26%;aspect-ratio:1;transform:rotate(45deg);border-radius:9%;cursor:pointer;z-index:2;
  background:linear-gradient(135deg,#aab6cb,#7f8ca6);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.35);
  transition:background .12s, box-shadow .12s}
.bs:active{filter:brightness(1.15)}
.bs.on{background:linear-gradient(135deg,#ffe08a,#f5b83d);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 0 calc(var(--u)*1.6) rgba(245,196,81,.75)}
.bs.b2{left:37%;top:17%} .bs.b1{left:59%;top:39%} .bs.b3{left:15%;top:39%}
.hp{position:absolute;left:44.5%;top:72.5%;width:11%;aspect-ratio:1;transform:rotate(45deg);border-radius:12%;
  background:#56647f;opacity:.75;z-index:1}
.bs .bn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-45deg);
  font-size:calc(var(--u) * 1.05);font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.02em;pointer-events:none}
.bs.on .bn{font-size:calc(var(--u) * 1.35);font-weight:900;color:#2a1d02;letter-spacing:-.04em}
.bs.on .bn.sm{font-size:calc(var(--u) * 1.05)}
.clrb{position:absolute;right:0;top:0;font-size:calc(var(--u) * .85);font-weight:800;color:#7d92ba;
  background:#15223f;border:1px solid #34497a;border-radius:calc(var(--u) * .4);
  padding:calc(var(--u) * .3) calc(var(--u) * .55)}
.dlb{position:absolute;left:0;bottom:0;font-size:calc(var(--u) * .78);color:#5c6f96;font-weight:600}
.hits{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u) * .45);flex:0 0 auto}
.hits button{padding:calc(var(--u) * .8) 0;border-radius:calc(var(--u) * .6);font-weight:900;
  font-size:calc(var(--u) * 1.4);background:transparent;border:2px solid currentColor;transition:background .12s}
/* 투명 + 외곽선 (사용자 요청: 꽉 찬 색 버튼이 촌스럽다). 색 뜻은 그대로 — 안타 초록 · 홈런 금 · 포볼/야선 파랑 · 아웃 빨강 */
.hits button{grid-column:span 2}
.hits .h0{grid-column:span 4}                /* 맨 아래 줄 = 홈런(위 버튼과 같은 크기) | 아웃(두 칸) — 홈런은 거의 안 나와서 */
.h1,.h2,.h3{color:#4ade80}
.h4{color:#f5c451}
.h5,.h6,.h7{color:#7cb6ff}                   /* 둘째 줄(포볼·야수선택·실책)은 한 색 */
.h0{color:#ff7a6e}
.hits button:hover{background:rgba(255,255,255,.04)}
.hits button:active{transform:translateY(1px);background:color-mix(in srgb, currentColor 22%, transparent)}
.cbt button:active{transform:translateY(1px);filter:brightness(1.35)}
.plog{margin:0;padding:0;list-style:none;max-height:320px;overflow:auto}
.plog li{display:flex;gap:10px;align-items:baseline;padding:6px 2px;border-top:1px solid var(--line);font-size:13.5px}
.plog li:first-child{border-top:0}
.plog .pi{flex:0 0 64px;color:var(--tx3);font-weight:700}
.plog .pn2{flex:0 0 120px;color:var(--tx2)} .plog .pn2 b{color:var(--tx)}
.plog .pw{flex:1;font-weight:800} .plog .pw em{font-style:normal;color:var(--warn)}
.plog .k0{color:#f19b91} .plog .k1,.plog .k2,.plog .k3{color:#4ade80} .plog .k4{color:#f5c451}
.plog .k5,.plog .k6,.plog .k7{color:#7cb6ff}
.hits .ptag{display:block;font-size:calc(var(--u) * .8);font-weight:800;opacity:.85;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbt{display:grid;grid-template-columns:repeat(3,1fr);   /* 위 타격 버튼과 같은 3칸 (사용자 요청: 세 버튼 크기 통일) */
  gap:calc(var(--u) * .45);flex:0 0 auto}
.cbt button{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:calc(var(--u) * .5);
  height:calc(var(--u) * 4.6);padding:0 calc(var(--u) * .6);border-radius:calc(var(--u) * .7);font-weight:900;
  font-size:calc(var(--u) * 1.5);background:transparent;border:1.5px solid #4a6290;color:#d3def4}
.lamp[data-ct]{position:relative;cursor:pointer}
.lamp[data-ct]::after{content:'';position:absolute;inset:calc(var(--u) * -.55)}   /* 손가락 닿는 범위를 불보다 넓게 */
.cbt button.cb{color:#86efac;letter-spacing:.12em} .cbt button.cs{color:#fde68a;letter-spacing:.12em}
html[data-theme=light] .cbt button.cb{color:#15803d} html[data-theme=light] .cbt button.cs{color:#a16207}
.cbt button .lamp{width:calc(var(--u) * 1.6);height:calc(var(--u) * 1.6);border-width:1px}
.cbt button.rz{font-size:calc(var(--u) * 1.15);color:#a9b8d6;line-height:1.15;white-space:normal;word-break:keep-all}

/* 타격 순서 */

.goh{text-align:center;flex:0 0 auto}
.goh span{display:inline-block;font-size:calc(var(--u) * 1.1);font-weight:900;color:#e2e9f8;letter-spacing:.2em;
  background:#2a3550;border-radius:99px;padding:calc(var(--u) * .3) calc(var(--u) * 1.2)}
.goh small{display:block;font-size:calc(var(--u) * .8);color:#6a7fa8;margin-top:calc(var(--u) * .3);font-weight:700}
.olist{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:calc(var(--u) * .25);padding:0 calc(var(--u) * .5) 0 calc(var(--u) * .1)}
.orow{display:flex;align-items:center;gap:calc(var(--u) * .45);padding:calc(var(--u) * .42) calc(var(--u) * .55);
  border-radius:calc(var(--u) * .5);border:1.5px solid transparent;font-size:calc(var(--u) * 1.15);flex:0 0 auto}
.orow .o{width:1.6em;text-align:right;font-weight:900;color:#7d92ba;flex:0 0 auto}
.orow .nm{flex:1 1 auto;min-width:0;font-weight:800;color:#e2e9f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .av{font-weight:900;color:var(--gold);font-size:calc(var(--u) * 1);flex:0 0 auto}
.orow .rc{flex:0 0 auto}
.orow.now{border-color:var(--gold);background:rgba(245,196,81,.12)}
.orow.now .o,.orow.now .nm{color:var(--gold)}
.orow.done{opacity:.42}
/* 지금 타자 — 같은 줄이 크게 펼쳐진다 */
.orow.big{display:block;flex:0 0 auto;border:2px solid var(--gold);border-radius:calc(var(--u) * .8);
  background:linear-gradient(160deg,#2a2f4a 0%,#1a2547 55%,#13203f 100%);
  box-shadow:0 0 calc(var(--u)*1.2) rgba(245,196,81,.28);padding:calc(var(--u) * .7) calc(var(--u) * .85);
  margin:calc(var(--u) * .2) 0}
.nb-top{display:flex;align-items:flex-end;gap:calc(var(--u) * .4)}
.nb-no{font-size:calc(var(--u) * 3.2);font-weight:900;color:var(--gold);line-height:.9}
.nb-of{font-size:calc(var(--u) * 1.05);font-weight:800;color:#8ea3cc;padding-bottom:calc(var(--u) * .1)}
.nb-rk{margin-left:auto;align-self:flex-start;font-size:calc(var(--u) * .85);font-weight:900;color:#2a1d02;
  background:linear-gradient(180deg,#ffe08a,#f5b83d);padding:calc(var(--u) * .25) calc(var(--u) * .55);
  border-radius:calc(var(--u) * .4);white-space:nowrap}
.nb-nm{display:flex;align-items:baseline;gap:calc(var(--u) * .5);margin:calc(var(--u) * .45) 0;
  padding:calc(var(--u) * .35) 0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.nb-nm span{font-size:calc(var(--u) * 1.2);font-weight:800;color:#8ea3cc}
.nb-nm b{font-size:calc(var(--u) * 3);font-weight:900;color:#fff;letter-spacing:-.05em;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb-nm em{font-style:normal;font-size:calc(var(--u) * .8);font-weight:800;color:var(--warn);
  border:1px solid var(--warn);border-radius:calc(var(--u) * .3);padding:0 calc(var(--u) * .3)}
.nb-st{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--u) * .5)}
.nb-st .l{font-size:calc(var(--u) * .85);font-weight:800;color:#8ea3cc;letter-spacing:.06em}
.nb-st .v{font-size:calc(var(--u) * 3.3);font-weight:900;color:var(--grn);line-height:1}
.nb-st .v.na{font-size:calc(var(--u) * 2);color:#4b5f88}
.nb-r{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u) * .35);min-width:0}
.nb-sum{font-size:calc(var(--u) * 1.05);font-weight:900;color:#dbe6fa;white-space:nowrap}
.nb-rec{display:flex;gap:calc(var(--u) * .25);align-items:center;font-size:calc(var(--u) * .8);color:#8ea3cc;
  font-weight:700;flex-wrap:wrap;justify-content:flex-end}
.orow.onb .nm::after{content:' ◆';color:var(--gold);font-size:.8em}

.field{position:relative;aspect-ratio:100/78;width:100%;width:min(100cqw, calc(100cqh * 100 / 78));margin:0 auto;flex:0 0 auto;
  background:transparent;border-radius:calc(var(--u) * .7);overflow:hidden}
.fbg{position:absolute;inset:0;width:100%;height:100%;display:block}
.po{position:absolute;transform:translate(-50%,-50%);overflow:hidden;
  min-width:calc(var(--u) * 5.2);border-radius:calc(var(--u) * .45);text-align:center;cursor:pointer;transition:all .12s;
  box-shadow:0 calc(var(--u)*.14) calc(var(--u)*.5) rgba(0,0,0,.55)}
.po .pp{display:block;font-size:calc(var(--u) * .75);font-weight:900;color:#fff;
  background:#e2711d;padding:calc(var(--u) * .14) calc(var(--u) * .3);letter-spacing:.02em}
.po.of .pp{background:#1d7fc0}
.po .pn{display:block;font-size:calc(var(--u) * 1.1);font-weight:900;color:#132019;
  background:#eef3f6;padding:calc(var(--u) * .2) calc(var(--u) * .35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--u) * 7)}
.po.pick{outline:calc(var(--u) * .2) solid var(--gold)}
.po.pick .pp{background:#b8860f} .po.pick .pn{background:var(--gold);color:#241a05}
.po.swap{outline:calc(var(--u) * .14) dashed var(--info)}
.bench{font-size:calc(var(--u) * .95);color:#7d92ba;text-align:center;flex:0 0 auto}
.dbtn{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u) * .5);flex:0 0 auto}
.dbtn button{height:calc(var(--u) * 3.4);padding:0;border-radius:calc(var(--u) * .55);
  font-size:calc(var(--u) * 1.1);font-weight:900;background:#1f3260;border:1px solid #3a5590;color:#e2e9f8}
.dbtn button:disabled{opacity:.4}
.dbtn button.on{background:var(--info);border-color:var(--info);color:#fff}
.dbtn button.ok{background:var(--hit);border-color:var(--hit);color:#fff}
.dbtn button.ok2{background:#2d5f86;border-color:#4a8cc0;color:#fff}

/* 주자 이동 고르기 */
.pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:80;padding:20px}
.popbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px;
  max-width:420px;width:100%}
.popbox h4{margin:0 0 4px;font-size:17px;font-weight:800}
.popbox p{margin:0 0 12px;font-size:13px;color:var(--tx3)}
.popgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.popgrid button{padding:15px 0;border-radius:9px;font-size:16px;font-weight:800;
  background:var(--line);border:1px solid var(--line2)}

/* 경기 화면에서는 왼쪽 메뉴를 접는다 — ☰ 메뉴로 잠깐 펼친다 */
body.ingame .side{display:none}
body.ingame .main{padding:10px 12px 40px}
body.ingame.sideopen .side{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:90;
  box-shadow:10px 0 40px rgba(0,0,0,.6)}
body.ingame.sideopen::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85}
body.fs .main{padding:0}
body.fs .gb{border-radius:0;border:0;height:100vh;height:100dvh}
body.fs .hdrow{display:none}

/* 태블릿 세로 · 좁은 화면 — 위아래로 쌓는다. 기록하는 곳(타자·버튼)이 위. */
@media(max-width:900px), (orientation:portrait){
  .gb{--u:clamp(10px, 2.1vw, 18px);height:auto;min-height:0}
  .gb{--cols:1fr 1fr}                     /* 점수 카드 2칸 = 아래 주루·타순 2칸과 경계 일치 */
  .gmid{grid-column:1/-1;order:3}
  .gfld{grid-column:1/-1;order:3;min-height:calc(var(--u) * 34)}   /* 세로: 기록 버튼이 먼저, 배치도는 아래 */
  .cbt button{font-size:calc(var(--u) * 1);gap:calc(var(--u) * .3)}
  /* 세로 화면은 주루 칸이 반쪽이라 띠를 더 촘촘하게 (한 줄 유지) */
  .cstrip{padding:calc(var(--u) * .35) calc(var(--u) * .5);gap:calc(var(--u) * .35)}
  .cstrip .ginn,.cstrip .prog b{font-size:calc(var(--u) * 1.25)}
  .cstrip .lamp{width:calc(var(--u) * 1.25);height:calc(var(--u) * 1.25)}
  .cstrip .cnt{gap:calc(var(--u) * .4)} .cstrip .cnt .k{font-size:calc(var(--u) * .85)}
  .cstrip .cnt .g{gap:calc(var(--u) * .18)}
  .prog em{font-size:calc(var(--u) * .75)}
  .gplay{min-height:calc(var(--u) * 40)}
  .gord{max-height:calc(var(--u) * 46)}
}
@media(max-width:600px){
  .gb{--u:clamp(9px, 2.6vw, 16px)}
  .gmn{grid-template-columns:1fr}
  .gsc{grid-template-columns:1fr 1fr}
  .gmid{grid-column:1/-1;order:3}
}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;
    border-right:0;border-bottom:1px solid var(--line)}
  .brand,.side .foot{display:none}
  .nav{width:auto;padding:9px 12px;white-space:nowrap}
  .nav span{display:none} .nav i{font-size:19px}
  .main{padding:14px 12px 50px}
}
/* ── 실시간 랭킹 ── */
.rkwrap{background:var(--nv0);border:1px solid #2b3f6b;border-radius:14px;padding:16px;margin-bottom:13px}
.rkh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rkh b{font-size:20px;font-weight:900}
.rkh small{display:block;font-size:12px;color:#7d92ba;margin-top:2px}
.rkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rkc{background:var(--nv1);border:1.5px solid #2a4580;border-radius:14px;padding:12px}
.rkc h4{margin:0 0 10px;text-align:center;font-size:17px;font-weight:900;color:#ff9a7a}

  background:#15223f;border:1px solid #2c4170}

.rkr.m1 .rk,.rkr.m2 .rk,.rkr.m3 .rk{font-size:21px}
.rkr .nm{flex:1;min-width:0;font-size:16px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkr .nm small{font-size:11.5px;color:#7d92ba;font-weight:700;margin-left:7px}
.rkr .vl{font-size:18px;font-weight:900;color:#ffd166;flex:0 0 auto}
.rkc.av .vl{color:#4ade80} .rkc.ht .vl{color:#7cc4ff}
.rkr.m1{border:2px solid #f5c451;background:linear-gradient(90deg,#3a3010,#14223f);box-shadow:0 0 14px rgba(245,196,81,.35)}
.rkr.m2{border-color:#c8d3e6} .rkr.m3{border-color:#d08a4e}

<script>
/* ═══════════════════════════════════════════════════════════
   야구 수행평가 기록 앱 — 단일 파일
   저장:  로컬(localStorage)이 원본, Firebase 는 있으면 동기화
   내보내기: 구글 앱스스크립트 웹앱(JSONP/POST) 경유
   ═══════════════════════════════════════════════════════════ */

/* ───── 순수 로직 (node 로 테스트 완료) ───────────────── */
function buildOrder(players, targetCount){
  var base = players.map(function(p,i){
    return {sid:p.sid,name:p.name,gender:p.gender,num:p.num,dup:false,slot:i};
  });
  if(players.length===0 || targetCount<=base.length) return base;
  var need = targetCount - base.length;
  var M = players.filter(function(p){return p.gender==='남';});
  var F = players.filter(function(p){return p.gender==='여';});
  var needM = Math.round(need*(M.length/players.length)), needF = need-needM;
  if(M.length===0){needF=need;needM=0;}
  if(F.length===0){needM=need;needF=0;}
  function take(arr,k){
    if(k<=0||arr.length===0) return [];
    var s = arr.slice().sort(function(a,b){
      return (a.pa||0)-(b.pa||0) || String(a.num).localeCompare(String(b.num));});
    var out=[]; for(var i=0;i<k;i++) out.push(s[i%s.length]); return out;
  }
  take(M,needM).concat(take(F,needF)).forEach(function(p,i){
    base.push({sid:p.sid,name:p.name,gender:p.gender,num:p.num,dup:true,slot:base.length+i});
  });
  return base;
}
function nextState(st, orderLen){
  var s={inning:st.inning,half:st.half,idx:st.idx+1};
  if(s.idx<orderLen) return s;
  s.idx=0;
  if(s.half==='초') s.half='말'; else {s.half='초'; s.inning+=1;}
  return s;
}
function isGameOver(st,maxInning){ return st.inning>maxInning; }
/* 선공(초에 공격하는 쪽) — g.first: 'A'(원정) 또는 'H'(홈). 예전 경기는 'A'.
   선공 팀이 점수표 윗줄·화면 왼쪽, 후공 팀이 아랫줄·오른쪽 (사용자 요청). */
function firstSide(g){ return g.first==='H' ? 'H' : 'A'; }
function otherSide(s){ return s==='H' ? 'A' : 'H'; }
function atkSide(g){ return g.st.half==='초' ? firstSide(g) : otherSide(firstSide(g)); }
function halfOfSide(g, side){ return side===firstSide(g) ? '초' : '말'; }
function tally(atbats, defense, innings){
  var m={};
  function slot(sid){ if(!m[sid]) m[sid]={sid:sid,pa:0,ab:0,bb:0,h:0,h2:0,h3:0,hr:0,tb:0,
                                          r:0,rbi:0,dOut:0,dPlay:0,inn:0,g:0}; return m[sid]; }
  (atbats||[]).forEach(function(a){
    var x=slot(a.sid);
    x.pa+=1;
    if(isAB(a.kind)) x.ab+=1;               // 포볼·야수선택·실책 출루는 타수에서 뺀다 (아래 isAB)
    if(a.kind>=1 && a.kind<=4){             // 1·2·3루타·홈런만 안타
      x.h+=1;
      x.tb+=a.kind;                         // 루타 수 = kind 그대로 (1·2·3·4)
      if(a.kind===2) x.h2+=1;
      if(a.kind===3) x.h3+=1;
      if(a.kind===4) x.hr+=1;
    }
    if(a.kind===5) x.bb+=1;
    x.r+=(a.run||0); x.rbi+=(a.rbi||0);
  });
  /* 수비 기록 — kind:'play' = 「수비 참여」: 그 경기에 수비 9명 안에 들어갔다 (앱이 자동으로, 경기당 최대 1).
     그 밖(kind 없음) = 「아웃 처리」: 아웃을 만든 선수. 둘은 따로 센다.
     ★ 2026-10-02 정정 — 예전엔 「공은 잡았지만 아웃 실패」로 잘못 알고 수동 버튼이었다. 사용자 정의:
       "수비참여는 수비 9명 안에 들어간 학생들에게 주는 점수". 이닝마다 생기지만 최고 +1. */
  (defense||[]).forEach(function(d){
    var x = slot(d.sid);
    if(d.kind === 'play') x.dPlay += 1; else x.dOut += 1;
  });
  Object.keys(innings||{}).forEach(function(sid){
    var x=slot(sid); x.inn=innings[sid].inn||0; x.g=innings[sid].g||0; });
  Object.keys(m).forEach(function(sid){
    var x=m[sid];
    x.avg  = x.ab ? x.h/x.ab : 0;                       // 타율
    x.slg  = x.ab ? x.tb/x.ab : 0;                      // 장타율 = 총루타 ÷ 타수
    x.obp  = (x.ab+x.bb) ? (x.h+x.bb)/(x.ab+x.bb) : 0;  // 출루율 (희생타 없음)
    x.ops  = x.obp + x.slg;
    x.xbh  = x.h2 + x.h3 + x.hr;                        // 장타 (2루타 이상)
    /* 기여 분자 — 평가계획서: 득점 + 타점 + 수비 참여 + 수비 아웃 처리 참여 */
    x.dSum     = x.r + x.rbi + x.dPlay + x.dOut;
    x.contrib  = x.inn ? x.dSum/x.inn : 0;   // 이닝당 — 기록·순위·특기사항용 (선생님 요청)
    x.contribG = x.g   ? x.dSum/x.g   : 0;   // 경기당 — 평가 점수 환산용 (계획서 기준)
  });
  return m;
}
function fmtAvg(v){ var s=(Math.round(v*1000)/1000).toFixed(3); return s.charAt(0)==='0'?s.slice(1):s; }
function canAddDefense(list){ return (list||[]).length<2; }
/* 주루 — bases=[1루,2루,3루], 각 칸에 sid 또는 null.
   kind: 0=아웃  1=1루타  2=2루타  3=3루타  4=홈런  5=포볼(밀어내기)  6=야수선택  7=실책 출루
   안타·홈런은 모든 주자를 그만큼 밀고, 포볼은 「차 있는 루만」 연쇄로 민다. */
function advance(bases, batterSid, kind){
  var b = (bases||[null,null,null]).slice(), runs=[];
  if(kind===0) return {bases:b, runs:runs};

  if(kind===5){                       // 포볼 — 강제 진루만
    if(b[0]){                         // 1루가 비어 있으면 아무도 안 움직인다
      if(b[1]){
        if(b[2]) runs.push(b[2]);     // 만루 → 3루 주자 밀려서 득점
        b[2]=b[1];
      }
      b[1]=b[0];
    }
    b[0]=batterSid;
    return {bases:b, runs:runs};
  }
  if(kind===6){                       // 야수선택 — 타자만 1루로, 주자는 그대로
    b[0] = b[0] || null;              // (죽은 주자는 다이아몬드에서 따로 지운다)
    var tmp = b[0];
    b[0] = batterSid;
    if(tmp){ /* 1루에 있던 주자는 보통 아웃 — 화면에서 확인·수정 */ }
    return {bases:b, runs:runs, fc:true};
  }

  var step = kind===7 ? 1 : kind;     // 실책 출루 = 주자 진루는 1루타와 같다 (기록상 안타는 아님)
  for(var i=2;i>=0;i--){              // 안타·홈런·실책
    if(!b[i]) continue;
    var to = i + step;
    if(to>=3) runs.push(b[i]); else b[to] = b[i];
    b[i] = null;
  }
  if(step>=4) runs.push(batterSid);
  else b[step-1] = batterSid;
  return {bases:b, runs:runs};
}
/* 타석 결과 → 타수에 넣을지 (포볼은 타수에서 뺀다) */
/* ★ 2026-10-02 사용자 결정 — 「학생에게 유리하게」: 포볼(5)·야수선택(6)·실책 출루(7)는 타수에서 뺀다.
     공식 규칙은 야수선택·실책을 타수에 넣지만(타율↓), 수업 평가(타율 30점)에서는 영향이 없게 했다. */
function isAB(kind){ return kind !== 5 && kind !== 6 && kind !== 7; }
function isHit(kind){ return kind>=1 && kind<=4; }

var APP_VER = '2026-10-06u';
/* ───── 상태 ──────────────────────────────────────────── */
var DB=null, FB=null;
var S = load();

function load(){
  var d;
  try{ d = JSON.parse(localStorage.getItem('bb.v1')||'null'); }catch(e){ d=null; }
  if(!d) d = {};
  d.cfg = Object.assign({school:'', classCount:11, classNames:[], gasUrl:'', fb:'', mine:[], showAll:false}, d.cfg||{});
  d.cfg.mine = d.cfg.mine || [];
  if(!d.cfg.classNames.length) d.cfg.classNames = defaultClassNames(d.cfg.classCount);
  d.classes = d.classes || {};        // { 학급명: {roster:[], groups:{}, games:[], tt:{}, rep:{}} }
  d.cur = d.cur || null;
  return d;
}
function defaultClassNames(n){
  var out=[]; for(var i=1;i<=n;i++) out.push(i+'반'); return out;
}
var DEVICE = (function(){
  var d = localStorage.getItem('bb.dev');
  if(!d){ d = 'd'+Math.random().toString(36).slice(2,9); localStorage.setItem('bb.dev', d); }
  return d;
})();
function ck(x){ return String(x).replace(/[.#$/\[\]]/g,'_'); }
function ROOT(){ return 'baseball/' + ck(S.cfg.school || 'default'); }

/* 로컬 저장은 즉시 — 화면이 절대 기다리지 않게 한다 */
function save(){ try{ localStorage.setItem('bb.v1', JSON.stringify(S)); }catch(e){} }

/* Firebase 는 「바뀐 칸만」 뒤에서 보낸다. 실패해도 로컬은 이미 저장돼 있다. */
function push(path, val){
  if(!DB) return;
  syncing(true);
  DB.ref(ROOT()+'/'+path).set(val)
    .then(function(){ syncing(false); })
    .catch(function(){ syncing(false); });
}
function patch(path, obj){
  if(!DB) return;
  syncing(true);
  DB.ref(ROOT()+'/'+path).update(obj)
    .then(function(){ syncing(false); })
    .catch(function(){ syncing(false); });
}
function drop(path){
  if(!DB) return;
  syncing(true);
  DB.ref(ROOT()+'/'+path).remove()
    .then(function(){ syncing(false); })
    .catch(function(){ syncing(false); });
}
var _syncN = 0;
function syncing(on){
  _syncN = Math.max(0, _syncN + (on?1:-1));
  var d = el('netDot'); if(!d) return;
  d.style.opacity = _syncN ? '.4' : '1';
}

/* ═══ 동기화 (2026-08-18 다시 씀) ═══════════════════════
   예전에는 타석을 하나 기록할 때마다 「타석 배열 전체」를 올리고,
   받을 때도 받은 배열로 통째 교체했다. 그래서 두 기기가 같은 경기를 기록하면
   나중에 올라간 (더 짧은) 배열이 앞의 기록을 지워 버렸다.
   배열 번호(atbats/20)로 올리는 경우도 두 기기가 똑같이 21번째를 치면 같은 칸에 부딪혔다.

   이제 기록 한 건 = 고유 id 한 칸이다.
     올릴 때 : ab/{id} 한 칸만  → 남의 기록을 덮어쓸 수가 없다
     받을 때 : id 로 합치기만   → 받은 것 때문에 내 기록이 지워지지 않는다
     지울 때 : 그 id 만 지운다  (되돌리기)
   덕분에 두 기기가 동시에 기록해도 합쳐지고, 끊겼다 다시 붙어도 밀린 것만 올라간다.
   이닝·주자·점수 같은 「현재 상태」만 예전처럼 마지막 입력이 이긴다(cur 칸 하나). */

/* id 는 기기마다 다르게 만든다 — 같은 순번이어도 절대 안 부딪힌다 */
var _idN = 0;
function newId(){ return DEVICE+'_'+(++_idN)+'_'+Date.now().toString(36); }
/* 순서용 시각 — 같은 밀리초에 두 건이 들어와도 순서가 뒤집히지 않게 항상 커진다 */
var _lastTs = 0;
function stamp(){ _lastTs = Math.max(Date.now(), _lastTs+1); return _lastTs; }
/* 예전 기록(id 없음)에 id 를 붙인다. ts 는 배열 순서를 그대로 쓴다(작은 수라 새 기록보다 앞선다) */
function ensureIds(g){
  if(!g) return;
  g.atbats = g.atbats || []; g.defense = g.defense || [];
  g.atbats.forEach(function(r,i){ if(!r.id) r.id='old'+g.no+'_'+i; if(!r.ts) r.ts=i+1; });
  g.defense.forEach(function(r,i){ if(!r.id) r.id='oldd'+g.no+'_'+i; if(!r.ts) r.ts=i+1; });
}
function mapOf(list){
  var m={}; (list||[]).forEach(function(r){ if(r.id) m[r.id]=r; }); return m;
}
function sortRec(list){
  list.sort(function(a,b){ return (a.ts||0)-(b.ts||0) || (String(a.id)<String(b.id)?-1:1); });
}
/* 합치기만 한다 — 새로 들어온 것이면 true */
function mergeRec(list, rec){
  for(var i=0;i<list.length;i++) if(list[i].id===rec.id){ list[i]=rec; return false; }
  list.push(rec); sortRec(list); return true;
}

function gPath(cn, g){ return 'classes/'+ck(cn)+'/games/'+g.no; }

/* 현재 상태 — 이닝·주자·점수·수비 배치. 칸 하나라 수백 바이트로 끝난다. */
function syncState(cn, g, extra){
  save();
  if(!DB) return;
  var o = {st:g.st, bases:g.bases||[null,null,null], hs:g.hs, as:g.as,
           status:g.status, def:g.def||null, first:firstSide(g), _by:DEVICE, _at:Date.now()};
  if(extra) Object.keys(extra).forEach(function(k){ o[k]=extra[k]; });
  patch(gPath(cn,g)+'/cur', o);
}
/* 타석 한 건 */
function syncAB(cn, g, rec){ save(); if(DB && rec && rec.id) push(gPath(cn,g)+'/ab/'+rec.id, rec); }
/* 앞 타자의 득점만 고칠 때 — 그 칸의 run 하나만 */
function syncABRun(cn, g, rec){ save(); if(DB && rec && rec.id) patch(gPath(cn,g)+'/ab/'+rec.id, {run:rec.run||0}); }
function dropAB(cn, g, id){ save(); if(DB && id) drop(gPath(cn,g)+'/ab/'+id); }
/* 수비 기여 한 건 */
function syncDF(cn, g, rec){ save(); if(DB && rec && rec.id) push(gPath(cn,g)+'/df/'+rec.id, rec); }

/* 경기 전체 — 라인업 확정·경기 종료처럼 드물 때만.
   ★ set 이 아니라 update 로 올린다. set 이면 아직 못 받은 상대 기기의 기록까지 날아간다. */
function syncGameFull(cn, g){
  save();
  if(!DB) return;
  ensureIds(g);
  var meta = {};
  Object.keys(g).forEach(function(k){
    if(k.charAt(0)==='_') return;                        // 화면용 임시값(_pick 등)은 안 올린다
    if(k==='atbats'||k==='defense') return;              // 기록은 ab/df 칸으로 따로 올린다
    if(k==='st'||k==='bases'||k==='hs'||k==='as') return; // 현재 상태는 cur 칸으로
    meta[k] = g[k];
  });
  patch(gPath(cn,g), meta);
  syncState(cn, g);
  if(g.atbats.length)  patch(gPath(cn,g)+'/ab', mapOf(g.atbats));
  if(g.defense.length) patch(gPath(cn,g)+'/df', mapOf(g.defense));
}
/* 타순은 자주 안 바뀌니 바뀔 때만 통째로 (작은 배열이다) */
function syncOrder(cn, g){
  save();
  if(!DB) return;
  patch(gPath(cn,g), {orderH:g.orderH, orderA:g.orderA, date:g.date||null});
  syncState(cn, g);                       // st.idx 가 같이 움직였을 수 있다
}
function syncRoster(cn){
  save();
  push('classes/'+ck(cn)+'/roster', cls(cn).roster);
}
function syncMisc(cn, key){
  save();
  push('classes/'+ck(cn)+'/'+key, cls(cn)[key]);
}

/* ═══ 학급 자료 내려받기 (2026-08-20 추가) ═══════════════
   ★ 그동안 명단·조편성·경기목록·탁구기록을 「올리기만」 하고 내려받는 코드가 없었다.
     그래서 설정을 제대로 넣은 새 기기에서도 명단이 텅 빈 채로 떴다.
     이제 학급을 고르면 그 학급 자료를 통째로 받아 온다.
   ★ 받은 것으로 「덮어쓰지」 않고 합친다 —
     한쪽 기기에서 아직 안 올라간 것이 있어도 지워지지 않게. */
var _wc = null;
function watchClass(cn){
  if(!DB || !cn){ return; }
  if(_wc && _wc.key===cn) return;
  unwatchClass();
  _wc = {key:cn, refs:[], ready:false};
  var base = DB.ref(ROOT()+'/classes/'+ck(cn));
  function on(ref, ev, fn){ ref.on(ev, fn); _wc.refs.push([ref, ev, fn]); }
  function done(){ save(); render(); }
  function say(m){ if(_wc && _wc.ready) toast(m); }

  /* 명단 — sid 로 맞춰서 합친다. 같은 학생은 받은 쪽 내용으로, 없는 학생은 그대로 둔다. */
  on(base.child('roster'), 'value', function(s){
    var v = s.val(); if(!v || !v.length) return;
    var c = cls(cn), by = {};
    c.roster.forEach(function(r,i){ by[r.sid] = i; });
    var added = 0;
    v.forEach(function(r){
      if(!r || !r.sid) return;
      if(by[r.sid]!=null) c.roster[by[r.sid]] = Object.assign({}, c.roster[by[r.sid]], r);
      else { c.roster.push(r); added++; }
    });
    c.roster.sort(function(a,b){ return (+a.num||0)-(+b.num||0); });
    done(); if(added) say('명단 '+added+'명을 받았습니다');
  });

  /* 경기 목록 — 없는 경기만 채운다. 이미 있는 경기는 경기별 감시(watchGame)가 맡는다. */
  on(base.child('games'), 'value', function(s){
    var v = s.val(); if(!v) return;
    var c = cls(cn), have = {}, added = 0;
    c.games.forEach(function(g){ have[g.no] = 1; });
    Object.keys(v).forEach(function(k){
      var g = v[k]; if(!g || have[g.no]) return;
      /* 새 구조(cur/ab/df)를 예전 모양으로 펴서 넣는다 */
      var o = Object.assign({}, g);
      if(g.cur) ['st','bases','hs','as','status','def','first'].forEach(function(f){
        if(g.cur[f]!==undefined && g.cur[f]!==null) o[f] = g.cur[f]; });
      delete o.cur;
      o.atbats  = g.ab ? Object.keys(g.ab).map(function(id){
                    return Object.assign({}, g.ab[id], {id:id}); }) : (g.atbats||[]);
      o.defense = g.df ? Object.keys(g.df).map(function(id){
                    return Object.assign({}, g.df[id], {id:id}); }) : (g.defense||[]);
      delete o.ab; delete o.df;
      sortRec(o.atbats); sortRec(o.defense);
      c.games.push(o); added++;
    });
    if(added){ c.games.sort(function(a,b){ return a.no-b.no; }); done(); say('지난 경기 '+added+'개를 받았습니다'); }
  });

  /* 조편성·조 이름·탁구·보고서 — 학생별 칸이라 받은 쪽 값으로 채운다 */
  [['groups','조편성'], ['tt','탁구 기록'], ['rep','보고서']].forEach(function(q){
    on(base.child(q[0]), 'value', function(s){
      var v = s.val(); if(!v) return;
      var c = cls(cn), n = 0;
      Object.keys(v).forEach(function(k){
        if(JSON.stringify(c[q[0]][k]) === JSON.stringify(v[k])) return;
        c[q[0]][k] = v[k]; n++;
      });
      if(n){ done(); say(q[1]+'을(를) 받았습니다'); }
    });
  });
  on(base.child('gNames'), 'value', function(s){
    var v = s.val(); if(!v || !v.length) return;
    var c = cls(cn); c.gNames = v; done();
  });
  on(base.child('gCount'), 'value', function(s){
    var v = s.val(); if(!v) return;
    var c = cls(cn); c.gCount = v; done();
  });

  base.once('value').then(function(){ if(_wc && _wc.key===cn) _wc.ready = true; })
    .catch(function(){ if(_wc && _wc.key===cn) _wc.ready = true; });
}
function unwatchClass(){
  if(_wc) _wc.refs.forEach(function(x){ try{ x[0].off(x[1], x[2]); }catch(e){} });
  _wc = null;
}

/* 같은 경기를 보는 다른 기기의 입력을 실시간으로 받아온다.
   기록은 칸 단위(child_*)로 받으므로, 타석 하나 들어올 때 경기 전체를 다시 받지 않는다. */
var _w = null;
function watchGame(cn, gno){
  var key = cn+'#'+gno;
  if(!DB || (_w && _w.key===key)) return;
  unwatch();
  var g0 = gameOf(cn, gno);
  if(!g0) return;
  ensureIds(g0);
  _w = {key:key, refs:[], ready:false};
  var base = DB.ref(ROOT()+'/classes/'+ck(cn)+'/games/'+gno);

  /* 화면이 다시 그려지면 경기 객체가 바뀔 수 있으므로 그때그때 찾는다 */
  function G(){ return gameOf(cn, gno); }
  function done(){ save(); if(V==='game') render(); }
  function on(ref, ev, fn){ ref.on(ev, fn); _w.refs.push([ref, ev, fn]); }
  function say(m){ if(_w && _w.ready) toast(m); }

  /* 1) 현재 상태 — 마지막 입력이 이긴다 */
  on(base.child('cur'), 'value', function(s){
    var v = s.val(); if(!v || v._by===DEVICE) return;     // 내가 쓴 건 무시 (되울림 방지)
    var g = G(); if(!g) return;
    ['st','bases','hs','as','status','def','first'].forEach(function(k){
      if(v[k]!==undefined && v[k]!==null) g[k] = v[k]; });
    done(); say('다른 기기 진행 상황 반영');
  });

  /* 2) 타석 — 합치기만 한다 */
  var ab = base.child('ab');
  on(ab, 'child_added', function(s){
    var g=G(), r=s.val(); if(!g||!r) return;
    r.id = s.key;
    if(mergeRec(g.atbats, r)) say('다른 기기 타석 반영');
    done();
  });
  on(ab, 'child_changed', function(s){
    var g=G(), r=s.val(); if(!g||!r) return;
    r.id = s.key; mergeRec(g.atbats, r); done();
  });
  on(ab, 'child_removed', function(s){
    var g=G(); if(!g) return;
    var i = g.atbats.findIndex(function(x){ return x.id===s.key; });
    if(i>=0){ g.atbats.splice(i,1); done(); say('다른 기기 되돌리기 반영'); }
  });

  /* 2-1) 타순 — 세팅 화면에서 바뀌면 다른 기기에도 반영 */
  ['orderH','orderA'].forEach(function(k){
    on(base.child(k), 'value', function(s){
      var v = s.val(), g = G();
      if(!g || !v || !v.length) return;
      if(JSON.stringify(g[k]) === JSON.stringify(v)) return;   // 내가 올린 것과 같으면 넘어간다
      g[k] = v; done(); say('다른 기기 타순 반영');
    });
  });

  /* 3) 수비 기여 */
  var df = base.child('df');
  on(df, 'child_added', function(s){
    var g=G(), r=s.val(); if(!g||!r) return;
    r.id = s.key;
    if(mergeRec(g.defense, r)) say('다른 기기 수비 기여 반영');
    done();
  });
  on(df, 'child_removed', function(s){
    var g=G(); if(!g) return;
    var i = g.defense.findIndex(function(x){ return x.id===s.key; });
    if(i>=0){ g.defense.splice(i,1); done(); }
  });

  /* 4) 처음 한 번 — 예전 방식(배열 통째)으로 올라가 있던 기록을 새 구조로 옮겨 온다 */
  base.once('value').then(function(s){
    var v = s.val() || {}, g = G();
    if(g && !v.ab && ((v.atbats||[]).length || (v.defense||[]).length)){
      (v.atbats||[]).forEach(function(r,i){
        if(!r) return; r.id = r.id || ('old'+gno+'_'+i); r.ts = r.ts || (i+1);
        mergeRec(g.atbats, r); });
      (v.defense||[]).forEach(function(r,i){
        if(!r) return; r.id = r.id || ('oldd'+gno+'_'+i); r.ts = r.ts || (i+1);
        mergeRec(g.defense, r); });
      done();
    }
    if(g) syncGameFull(cn, g);          // 내 기록도 새 구조로 한 번 올려 둔다
    if(_w && _w.key===key) _w.ready = true;   // 여기서부터 들어오는 것만 토스트를 띄운다
  }).catch(function(){ if(_w && _w.key===key) _w.ready = true; });
}
function gameOf(cn, gno){
  var c = cls(cn); if(!c) return null;
  return (c.games||[]).filter(function(x){ return x.no===gno; })[0] || null;
}
function unwatch(){
  if(_w) _w.refs.forEach(function(x){ try{ x[0].off(x[1], x[2]); }catch(e){} });
  _w = null;
}

function cls(cn){
  cn = cn||S.cur;
  if(!cn) return null;
  if(!S.classes[cn]) S.classes[cn] = {roster:[], groups:{}, games:[], tt:{}, rep:{}};
  var c = S.classes[cn];
  c.roster=c.roster||[]; c.groups=c.groups||{}; c.games=c.games||[]; c.tt=c.tt||{}; c.rep=c.rep||{};
  c.gCount = c.gCount || 2;
  c.gNames = c.gNames || ['A조','B조','C조','D조'];
  return c;
}
/* 밝은/어두운 화면 — 기기마다 기억 (교실 밝기·TV 여부가 기기마다 달라서) */

  if(t==='light') document.documentElement.dataset.theme = 'light';

function toast(m){
  var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on');},1900);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){

/* 예전 짧은 코드는 쓰지 않는다(추측하기 쉬움) — 이 코드가 남아 있는 기기는 새 코드를 다시 묻는다 */
var RETIRED_CODES = ['YJ'];
function fbConf(){
  var raw = (S.cfg.fb||'').trim();
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return FB_DEFAULT;
}
/* 공유 설정 — 한 기기에서 바꾸면 모든 기기에 */
var SHARED_KEYS = ['gasUrl','classCount','classNames','ttsKey','ttsVoice','songFolders'];
function pushSharedCfg(){
  if(!DB || !S.cfg.school) return;
  var o = {_by:DEVICE, _at:Date.now()};
  SHARED_KEYS.forEach(function(k){ if(S.cfg[k] != null) o[k] = S.cfg[k]; });   // 이 기기에 없는 값(undefined)은 보내지 않는다 — Firebase update 가 통째로 실패하고, null 이면 공유값이 지워진다
  try{ DB.ref(ROOT()+'/cfg').update(o).catch(function(){}); }catch(e){ console.warn('공유 설정 올리기 실패', e); }
}
var _cfgRef = null;
function watchSharedCfg(){
  if(_cfgRef){ try{ _cfgRef.off(); }catch(e){} _cfgRef = null; }
  if(!DB || !S.cfg.school) return;
  _cfgRef = DB.ref(ROOT()+'/cfg');
  _cfgRef.on('value', function(snap){
    var v = snap.val();
    if(!v){                                   // 아직 아무 기기도 안 올렸으면 이 기기 설정으로 채운다
      if(S.cfg.gasUrl) pushSharedCfg();
      return;
    }
    var changed = false;
    SHARED_KEYS.forEach(function(k){
      if(v[k]==null || v[k]==='') return;
      if(JSON.stringify(S.cfg[k]) !== JSON.stringify(v[k])){ S.cfg[k] = v[k]; changed = true; }
    });
    if(changed){ save(); render(); if(v._by!==DEVICE) toast('공유 설정을 받았습니다'); }
  });
}

function initFB(){
  if(RETIRED_CODES.indexOf(S.cfg.school) >= 0){ S.cfg.school = ''; save(); }
  var raw = S.cfg.school ? 'on' : '';
  setNet(false, raw? '연결 중…' : '학교 코드 필요');
  if(_cfgRef){ try{ _cfgRef.off(); }catch(e){} _cfgRef = null; }
  unwatch(); unwatchClass();
  if(_connRef){ try{ _connRef.off(); }catch(e){} _connRef = null; }
  if(FB){ try{ FB.delete(); }catch(e){} FB = null; }
  DB = null;
  if(!raw) return;
  try{
    var conf = fbConf();
    FB = firebase.initializeApp(conf, 'bb'+Date.now());
    DB = firebase.database(FB);
    _connRef = DB.ref('.info/connected');
    _connRef.on('value', function(s){
      setNet(!!s.val(), s.val()? 'Firebase 연결' : '오프라인 (로컬 저장)');
      if(s.val() && S.cur) watchClass(S.cur);   // 붙자마자 지금 학급 자료를 받아 온다
    });

/* ───── 설정 링크 ─────────────────────────────────────
   학교명 · 앱스스크립트 주소 · Firebase 설정을 링크 하나에 담는다.
   기기가 바뀔 때마다 손으로 다시 넣지 않아도 되게 하려는 것.

   ★ 이 값들을 앱 코드(공개 저장소)에 박아 넣지 않는 이유:
     지금 Realtime Database 규칙이 열려 있어서, 이 설정을 아는 사람은
     학생 이름·번호·기록을 읽고 고치고 지울 수 있다. 공개 저장소는 봇이 훑고 다닌다.
     그래서 「코드에 심기」 대신 「선생님끼리만 주고받는 링크」로 둔다. */
function b64e(s){
  return btoa(unescape(encodeURIComponent(s)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(s){
  s = String(s).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
}
function setupLink(){
  var p = {v:1, school:S.cfg.school||'', gas:S.cfg.gasUrl||'', fb:S.cfg.fb||''};
  if(!p.school) return '';
  return location.origin + location.pathname + '#setup=' + b64e(JSON.stringify(p));
}
/* ★ 이 링크를 태블릿 바탕화면 바로가기로 걸어 두는 걸 권한다.
   그러면 브라우저가 저장소를 비워 버려도 앱을 열 때마다 설정이 저절로 다시 들어와서,
   선생님이 다시 설정하러 다닐 일이 없다.
   대신 이미 같은 설정이면 아무 말도 하지 않는다 — 열 때마다 알림이 뜨면 성가시다. */
function applySetupLink(){
  var m = /[#&]setup=([^&]+)/.exec(location.hash || '');
  if(!m) return false;
  var p = null;
  try{ p = JSON.parse(b64d(m[1])); }catch(e){}
  /* 주소창에서 즉시 지운다 — 화면을 띄워 놓거나 방문기록이 남아도 설정값이 안 보이게 */
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
  if(!p) return false;
  var changed = false;
  if(p.school && RETIRED_CODES.indexOf(p.school)<0 && S.cfg.school !== p.school){ S.cfg.school = p.school; changed = true; }
  if(p.gas    && S.cfg.gasUrl !== p.gas   ){ S.cfg.gasUrl = p.gas;    changed = true; }
  /* 예전 링크에 든 Firebase 설정이 기본 연결과 같은 프로젝트면 따로 저장하지 않는다 */
  if(p.fb && p.fb.indexOf(FB_DEFAULT.projectId) < 0 && S.cfg.fb !== p.fb){ S.cfg.fb = p.fb; changed = true; }
  if(changed) save();
  return changed;
}

/* ───── 앱스스크립트 브릿지 ───────────────────────────── */
function jsonp(params, ms){
  return new Promise(function(res, rej){
    var url = S.cfg.gasUrl;
    if(!url) return rej(new Error('앱스스크립트 주소가 없습니다'));
    var cb = 'bbcb'+Math.random().toString(36).slice(2);
    var t = setTimeout(function(){ cleanup(); rej(new Error('응답 없음 (시간 초과)')); }, ms || 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; if(sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function(d){ cleanup(); res(d); };
    var q = Object.keys(params).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    var sc = document.createElement('script');
    sc.src = url + (url.indexOf('?')<0?'?':'&') + q + '&callback=' + cb;
    sc.onerror = function(){ cleanup(); rej(new Error('연결 실패')); };
    document.body.appendChild(sc);
  });
}
function gasPost(action, payload){
  var url = S.cfg.gasUrl;
  if(!url) return Promise.reject(new Error('앱스스크립트 주소가 없습니다'));
  var fd = new FormData();
  fd.append('action', action);
  fd.append('payload', JSON.stringify(payload));
  return fetch(url, {method:'POST', body:fd, mode:'no-cors'}).then(function(){ return {ok:true}; });
}

/* ───── 오류가 나도 빈 화면에 갇히지 않게 ─────────────────────

function logErr(msg, stack, where){

    if(DB && S.cfg.school) DB.ref(ROOT()+'/_err').push({msg:String(msg).slice(0,300), stack:String(stack||'').slice(0,1500),

}

function grpKeys(){ var c = cls(); return GK.slice(0, c.gCount||2); }
function inGrp(k){ return cls().roster.filter(function(s){ return s.group===k; }); }

/* 지금까지의 타율 — 실력 균등 배정에 쓴다 */
function avgMap(){
  var c = cls(), t = tally(allAtbats(c), allDefense(c), {}), m = {};
  c.roster.forEach(function(s){ var x=t[s.sid]; m[s.sid] = (x && x.ab) ? x.h/x.ab : -1; });
  return m;
}
/* 뱀 모양 배정 — 1,2,3 / 3,2,1 로 접어 넣어 실력이 한쪽에 몰리지 않게 */
function snake(list, k){
  var out = list.map(function(){return 0;}), g=0, dir=1;
  for(var i=0;i<list.length;i++){
    out[i]=g; g+=dir;
    if(g>=k){ g=k-1; dir=-1; } else if(g<0){ g=0; dir=1; }
  }
  return out;
}
function assignAuto(mode){
  var c = cls(), k = c.gCount||2, keys = grpKeys();
  var list = c.roster.slice();
  if(mode==='num')    list.sort(function(a,b){ return String(a.num).localeCompare(String(b.num),'ko',{numeric:true}); });
  if(mode==='rand')   list.sort(function(){ return Math.random()-0.5; });
  if(mode==='skill'){ var av=avgMap(); list.sort(function(a,b){ return av[b.sid]-av[a.sid]; }); }
  if(mode==='gender'){
    //  남녀를 따로 뱀 배정해서 두 축 모두 고르게
    ['남','여'].forEach(function(gd){
      var sub = c.roster.filter(function(s){return s.gender===gd;});
      snake(sub, k).forEach(function(gi,i){ sub[i].group = keys[gi]; });
    });
    syncRoster(S.cur); vGroups(); return toast('남녀 고르게 배정했습니다');
  }
  snake(list, k).forEach(function(gi,i){ list[i].group = keys[gi]; });
  syncRoster(S.cur); vGroups();
  toast({num:'번호순',rand:'무작위',skill:'실력 균등'}[mode]+'으로 배정했습니다');
}

/* ── 드래프트 ──
   주장 지정 → 여학생 라운드 → 남학생 라운드.
   각 라운드는 「먼저 뽑을 조」를 가위바위보로 정해 누른 뒤 번갈아 지명한다. */
function startDraft(){
  var c = cls();
  c.draft = { active:true, caps:[], phase:'cap', first:null, idx:0 };
  c.roster.forEach(function(s){ s.group = null; });
  save(); vGroups();
}
function draftPool(g){                     // 이번 라운드에 남은 학생
  var c = cls();
  return c.roster.filter(function(s){
    return !s.group && (g==='F' ? s.gender==='여' : s.gender==='남');
  });
}
function draftTurn(){                      // 지금 뽑을 조의 인덱스
  var c = cls(), d = c.draft, k = c.gCount||2;
  return (d.first + d.idx) % k;
}
function draftAdvance(){
  var c = cls(), d = c.draft;
  d.idx++;
  if(draftPool(d.phase).length===0){
    if(d.phase==='F'){
      //  남학생 라운드 선공 추천 = 여학생 때 「후공이던 조」.
      //  (마지막에 뽑은 조가 아니다 — 인원이 홀수면 선공 조가 마지막까지 뽑기 때문)
      var k = c.gCount||2;
      d.suggest = (d.first + 1) % k;
      d.phase='M'; d.first=null; d.idx=0;
    }else{
      d.phase='done';
    }
  }
}

      '<button class="btn" data-au="gender">남녀 고르게</button>'+
      '<button class="btn" data-au="num">번호순</button>'+
      '<button class="btn" data-au="rand">무작위</button>'+
      '<button class="btn" data-au="skill">실력 균등</button>'+
      '<button class="btn pri" id="dStart">✋ 드래프트로 뽑기</button>'+
    '</div><p class="st" style="margin:9px 0 0">'+
    '「실력 균등」은 지금까지 쌓인 <b>타율 순으로 뱀 모양</b> 배정합니다. 기록이 없으면 무작위와 같습니다.</p></div>';

  var draftBox = '';
  if(d){
    var kN = c.gNames;
    if(d.phase==='cap'){
      var pool0 = c.roster.filter(function(s){ return !s.group; });
      draftBox =
        '<div class="card" style="border-color:var(--warn)"><h3 style="color:var(--warn)">'+
        '주장 뽑기 — <b>'+esc(kN[d.caps.length])+'</b> 주장을 고르세요 ('+(d.caps.length+1)+'/'+k+')</h3>'+
        '<p class="st" style="margin:0 0 9px">성별은 선생님이 맞춰서 고르시면 됩니다.</p>'+
        '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr))">'+
        pool0.map(function(s){
          return '<button class="cbtn '+(s.gender==='남'?'gm':s.gender==='여'?'gf':'')+'" data-cap="'+s.sid+'">'+esc(s.name)+
                 '<small>'+esc(s.gender)+'</small></button>'; }).join('')+
        '</div><div class="row" style="margin-top:11px">'+
        '<button class="btn dn sm" id="dCancel">취소</button></div></div>';

    }else if(d.phase==='done'){
      draftBox = '<div class="card" style="border-color:var(--hit)">'+
        '<h3 style="color:var(--hit)">드래프트 완료</h3>'+
        '<div class="row"><button class="btn pri" id="dDone">확정하기</button>'+
        '<button class="btn sm" id="dUndo">한 명 되돌리기</button></div></div>';

    }else{
      var gLabel = d.phase==='F' ? '여학생' : '남학생';
      var pool = draftPool(d.phase);
      if(d.first===null){
        //  가위바위보 결과 입력 — 먼저 뽑을 조 고르기
        var sug = (d.suggest!=null)? d.suggest : 0;
        draftBox =
          '<div class="card" style="border-color:var(--info)">'+
          '<h3 style="color:var(--info)">'+gLabel+' 라운드 — 먼저 뽑을 조를 고르세요</h3>'+
          '<p class="st" style="margin:0 0 9px">가위바위보 이긴 조를 누르세요.'+
          (d.phase==='M' ? ' <b style="color:var(--warn)">추천: '+esc(kN[sug])+'</b> (여학생 때 나중에 뽑은 조)' : '')+'</p>'+
          '<div class="row">'+grpKeys().map(function(_,i){
            return '<button class="btn'+(i===sug&&d.phase==='M'?' pri':'')+'" data-first="'+i+'" '+
                   'style="flex:1;justify-content:center;padding:13px">'+esc(kN[i])+' 먼저</button>'; }).join('')+
          '</div><div class="row" style="margin-top:9px">'+
          '<button class="btn dn sm" id="dCancel">취소</button></div></div>';
      }else{
        var turn = draftTurn();
        draftBox =
          '<div class="card" style="border-color:var(--info)">'+
          '<h3 style="color:var(--info)">'+gLabel+' 라운드 · 남은 '+pool.length+'명 — '+

          pool.map(function(s){
            return '<button class="cbtn '+(s.gender==='남'?'gm':s.gender==='여'?'gf':'')+'" data-pick="'+s.sid+'">'+esc(s.name)+

          '</div><div class="row" style="margin-top:11px">'+
          '<button class="btn sm" id="dUndo">한 명 되돌리기</button>'+
          '<button class="btn dn sm" id="dCancel">취소</button></div></div>';
      }
    }
  }

  var cards = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'+
    keys.map(function(kk){
      var mem = inGrp(kk);
      var M = mem.filter(function(s){return s.gender==='남';}).length;
      return '<div class="card"><h3>'+esc(grpName(kk))+' · <b style="color:var(--warn)">'+mem.length+'명</b>'+

        (mem.length ? mem.map(function(s){

            (c.draft && c.draft.caps && c.draft.caps.indexOf(s.sid)>=0 ? ' <span class="tag dup">주장</span>' : '')+
            '</span>'+
            '<span class="tag '+(s.gender==='남'?'m':'f')+'">'+esc(s.gender)+'</span>'+
            (d ? '' : '<button class="btn sm" data-mvg="'+s.sid+'">이동</button>')+'</div>';
        }).join('') : '<div class="msg">비어 있음</div>')+'</div>';
    }).join('')+'</div>';

  var unassigned = c.roster.filter(function(s){ return !s.group; });
  var un = (!d && unassigned.length) ?
    '<div class="card" style="border-color:var(--warn)"><h3 style="color:var(--warn)">미배정 '+unassigned.length+'명</h3>'+
    unassigned.map(function(s){ return '<span class="tag" style="margin:2px">'+esc(s.name)+'</span>'; }).join('')+
    '</div>' : '';

  el('v-grp').innerHTML = head + tools + draftBox + cards + un;

  el('saveGn').onclick = function(){
    c.gCount = +el('gc').value;
    var nm = el('gn').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
    for(var i=0;i<4;i++) if(nm[i]) c.gNames[i]=nm[i];
    while(c.gNames.length<4) c.gNames.push(GK[c.gNames.length]+'조');
    //  줄어든 조에 있던 학생은 미배정으로
    var ok = grpKeys();
    c.roster.forEach(function(s){ if(s.group && ok.indexOf(s.group)<0) s.group=null; });
    syncRoster(S.cur); vGroups(); toast('저장했습니다');
  };
  el('v-grp').querySelectorAll('[data-au]').forEach(function(b){
    b.onclick = function(){ assignAuto(b.dataset.au); };
  });
  if(el('dStart')) el('dStart').onclick = function(){
    if(!confirm('지금 조 배정을 지우고 드래프트를 시작할까요?')) return;
    startDraft();
  };
  el('v-grp').querySelectorAll('[data-cap]').forEach(function(b){
    b.onclick = function(){
      var sid=b.dataset.cap, i=c.draft.caps.length;
      c.draft.caps.push(sid);
      c.roster.filter(function(s){return s.sid===sid;})[0].group = keys[i];
      if(c.draft.caps.length===k){
        c.draft.phase = draftPool('F').length ? 'F' : 'M';
        c.draft.first = null; c.draft.idx = 0;
      }
      save(); vGroups();
    };
  });
  el('v-grp').querySelectorAll('[data-first]').forEach(function(b){
    b.onclick = function(){
      c.draft.first = +b.dataset.first; c.draft.idx = 0;
      if(!draftPool(c.draft.phase).length) draftAdvance();
      save(); vGroups();
    };
  });
  el('v-grp').querySelectorAll('[data-pick]').forEach(function(b){
    b.onclick = function(){
      var turn = draftTurn();
      var st = c.roster.filter(function(s){return s.sid===b.dataset.pick;})[0];
      st.group = keys[turn];
      c.draft.pickLog = (c.draft.pickLog||[]).concat([st.sid]);
      draftAdvance();
      save(); vGroups();
    };
  });
  if(el('dUndo')) el('dUndo').onclick = function(){
    var log = c.draft.pickLog||[];
    if(!log.length) return toast('되돌릴 지명이 없습니다');
    var sid = log.pop();
    var st = c.roster.filter(function(s){return s.sid===sid;})[0];
    if(st) st.group = null;
    //  라운드/차례를 하나 뒤로
    if(c.draft.phase==='done'){ c.draft.phase = st && st.gender==='여' ? 'F':'M'; }
    if(c.draft.idx>0) c.draft.idx--;
    save(); vGroups();
  };
  if(el('dCancel')) el('dCancel').onclick = function(){
    if(!confirm('드래프트를 취소할까요? 배정이 초기화됩니다.')) return;
    c.draft = null; c.roster.forEach(function(s){ s.group=null; });
    syncRoster(S.cur); vGroups();
  };
  if(el('dDone')) el('dDone').onclick = function(){
    c.draft.active = false; syncRoster(S.cur); vGroups(); toast('조편성을 확정했습니다');
  };
  el('v-grp').querySelectorAll('[data-mvg]').forEach(function(b){
    b.onclick = function(){
      var s = c.roster.filter(function(x){return x.sid===b.dataset.mvg;})[0];
      var i = keys.indexOf(s.group);
      s.group = keys[(i+1) % keys.length];
      syncRoster(S.cur); vGroups();
    };
  });
}
function nameOfSid(sid){
  var s = cls().roster.filter(function(x){return x.sid===sid;})[0];
  return s ? s.name : '';
}
