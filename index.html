/* ── 음원 줄이기·압축 (아이패드에서 바로) ── */
var _lameP = null;
function loadLame(){
  if(window.lamejs) return Promise.resolve();
  if(_lameP) return _lameP;
  _lameP = new Promise(function(res, rej){
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';
    sc.onload = function(){ res(); }; sc.onerror = function(){ _lameP = null; rej(new Error('압축 도구를 못 불러왔습니다 (인터넷 확인)')); };
    document.head.appendChild(sc);
  });
  return _lameP;
}
function compressSong(file, fromSec){
  fromSec = Math.max(0, +fromSec||0);
  return loadLame().then(function(){
    return file.arrayBuffer ? file.arrayBuffer() : new Response(file).arrayBuffer();
  }).then(decodeAudio).then(function(src){
    var from = Math.min(fromSec, Math.max(0, src.duration - 5));
    var len = Math.min(SONG_SEC, src.duration - from);
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var oc = new OAC(1, Math.ceil(len * SONG_RATE), SONG_RATE);
    var s = oc.createBufferSource(); s.buffer = src; s.connect(oc.destination); s.start(0, from, len);
    var r = oc.startRendering();
    var p = (r && r.then) ? r : new Promise(function(res){ oc.oncomplete = function(e){ res(e.renderedBuffer); }; });
    return p.then(function(out){ return {pcm: out.getChannelData(0), dur: len}; });
  }).then(function(o){
    var f = o.pcm, n = f.length, i16 = new Int16Array(n);
    for(var i=0;i<n;i++){ var x = Math.max(-1, Math.min(1, f[i])); i16[i] = x < 0 ? x*0x8000 : x*0x7FFF; }
    var enc = new lamejs.Mp3Encoder(1, SONG_RATE, SONG_KBPS), parts = [], tot = 0;
    for(var j=0;j<n;j+=1152){ var mp = enc.encodeBuffer(i16.subarray(j, j+1152)); if(mp.length){ parts.push(new Uint8Array(mp)); tot += mp.length; } }
    var end = enc.flush(); if(end.length){ parts.push(new Uint8Array(end)); tot += end.length; }
    var u8 = new Uint8Array(tot), off = 0; parts.forEach(function(p){ u8.set(p, off); off += p.length; });
    return {u8:u8, dur:Math.round(o.dur)};
  });
}
function saveSong(cn, s, file){
  var v = Date.now();
  return compressSong(file, 0).then(function(r){
    if(!DB) throw new Error('Firebase 연결이 필요합니다');
    var b64 = bytesToB64(r.u8), sk = ck(s.sid);
    var meta = {name:file.name, start:0, v:v, dur:r.dur, size:r.u8.length, by:DEVICE};
    return DB.ref(ROOT()+'/songData/'+ck(cn)+'/'+sk).set({v:v, b64:b64}).then(function(){
      return DB.ref(ROOT()+'/songIdx/'+ck(cn)+'/'+sk).set(meta);
    }).then(function(){
      idbPut(songKey(cn, s.sid), {v:v, blob:new Blob([r.u8], {type:'audio/mpeg'})});
      return r;
    });
  });
}
/* 파일 이름 → 학생 (앞의 학번 우선, 없으면 이름이 들어 있는지) */
function matchStudent(roster, fname){
  var base = fname.replace(/\.[^.]+$/, ''), m = base.match(/^\s*(\d+)/);
  if(m){
    var d = m[1];
    var byNum = roster.filter(function(s){ return String(s.num) === d; })[0];          // 명단 번호 칸이 학번이면
    if(!byNum && d.length === 5)                                                         // 20104 → 4번 (명단 번호 칸이 번호만 있을 때)
      byNum = roster.filter(function(s){ return +s.num === +d.slice(3); })[0];
    if(!byNum && d.length <= 2) byNum = roster.filter(function(s){ return +s.num === +d; })[0];
    if(byNum){
      var nm = base.replace(/^\s*\d+[\s_\-.]*/, '').trim();                              // 이름도 적혀 있으면 맞는지 확인
      if(!nm || base.indexOf(byNum.name) >= 0 || !roster.some(function(s){ return nm.indexOf(s.name) >= 0; })) return byNum;
    }
  }
  var byName = roster.filter(function(s){ return s.name && base.indexOf(s.name) >= 0; });
  return byName.length === 1 ? byName[0] : null;
}

/* 여러 반 폴더를 한 번에: 학번(20104 = 2학년 1반 4번)의 반 번호로 반을 고르고, 그 반 명단에서 학생을 찾는다.
   학번이 없으면 이름이 한 반에서만 맞을 때만 연결 */
function matchAnyClass(fname){
  var base = fname.replace(/\.[^.]+$/, ''), m = base.match(/^\s*(\d{5})/), cand = [];
  Object.keys(S.classes||{}).forEach(function(cn){
    var c = S.classes[cn]; if(!c || !c.roster || !c.roster.length) return;
    var st = matchStudent(c.roster, fname); if(!st) return;
    var nm = base.replace(/^\s*\d+[\s_\-.]*/, '').trim();
    if(nm && base.indexOf(st.name) < 0) return;                       // 이름이 적혀 있으면 이름까지 맞아야
    cand.push({cn:cn, s:st});
  });
  if(cand.length > 1 && m){                                          // 반 번호로 좁히기: 이름 속 숫자 = 학번 2·3번째 자리
    var classNo = +m[1].slice(1,3);
    cand = cand.filter(function(x){ var d = String(x.cn).match(/(\d+)\s*반/) || String(x.cn).match(/(\d+)/); return d && +d[1] === classNo; });
  }
  return cand.length === 1 ? cand[0] : null;
}

  var SF = S.cfg.songFolders || {};
  el('sgDrive').value = SF[S.cur] || ''; el('sgDriveAll').value = SF._all || '';
  function rememberFolder(k, link){ S.cfg.songFolders = Object.assign({}, S.cfg.songFolders||{}); S.cfg.songFolders[k] = link; save(); pushSharedCfg(); }
  function driveImport(link, depth, matchFn){
    if(!link) return toast('드라이브 폴더 링크를 붙여 넣어 주세요');
    if(!S.cfg.gasUrl) return toast('설정에서 앱스 스크립트 주소를 먼저 넣어 주세요');
    if(_songBusy) return toast('지금 올리는 중이에요');
    if(!DB) return toast('Firebase 연결이 필요합니다');
    el('sgProg').textContent = '드라이브 폴더 읽는 중…';
    // 링크 여러 개(줄바꿈·쉼표·공백) — 교사마다 클래스룸 폴더가 따로 생기므로 한꺼번에 읽는다. 같은 파일은 한 번만
    var links = link.split(/[\s,]+/).filter(Boolean);
    Promise.all(links.map(function(l){ return jsonp({action:'listSongs', folder:l, depth:depth}, 90000); })).then(function(rs){
      var seen = {}, files = [];
      rs.forEach(function(x, k){
        if(!x || !x.ok) throw new Error((links.length>1 ? (k+1)+'번째 링크: ' : '')+(x && x.error || '폴더를 못 읽었습니다'));
        x.files.forEach(function(f){ if(!seen[f.id]){ seen[f.id] = 1; files.push(f); } });
      });
      return {ok:true, files:files};
    }).then(function(r){
      var jobs = [], miss = [], big = [];
      r.files.forEach(function(f){
        if(f.size > 15*1048576){ big.push(f.name); return; }
        var m = matchFn(f.name); if(m) jobs.push({cn:m.cn, s:m.s, d:f}); else miss.push(f.name);
      });
      var cns = jobs.map(function(j){ return j.cn; }).filter(function(x,i,a){ return a.indexOf(x)===i; });
      // 이미 같은 드라이브 파일을 가져온 학생은 건너뛴다 (늦게 낸 학생만 다시 가져오기)
      return Promise.all(cns.map(function(cn){ return DB.ref(ROOT()+'/songIdx/'+ck(cn)).once('value').then(function(x){ return [cn, x.val()||{}]; }); }))
        .then(function(pairs){
          var have = {}; pairs.forEach(function(p){ have[p[0]] = p[1]; });
          var skip = 0;
          jobs = jobs.filter(function(j){ var m = have[j.cn][ck(j.s.sid)]; if(m && m.src === j.d.id){ skip++; return false; } return true; });
          if(miss.length || big.length) alert((miss.length ? '학생을 찾지 못한 파일 '+miss.length+'개 (건너뜀)\n'+miss.slice(0,40).join('\n')+(miss.length>40?'\n…':'')+'\n\n' : '')+
            (big.length ? '15MB가 넘어 건너뛴 파일\n'+big.join('\n') : ''));
          if(!jobs.length){ el('sgProg').textContent = ''; return toast(skip ? '새로 가져올 파일이 없어요 (이미 '+skip+'개 있음)' : '가져올 음원이 없어요'); }
          unlockAudio(); _songBusy = true;
          var ok = 0, fail = [], i = 0, per = {};
          (function next(){
            if(i >= jobs.length){
              _songBusy = false; vSong();
              var sum = Object.keys(per).map(function(cn){ return cn+' '+per[cn]; }).join(' · ');
              toast('드라이브에서 응원가 '+ok+'개 저장'+(sum && cns.length>1 ? ' ('+sum+')' : '')+(skip ? ' · 이미 있음 '+skip : '')+(fail.length ? ' · 실패 '+fail.length : ''));
              if(fail.length) setTimeout(function(){ alert('가져오지 못한 파일\n\n'+fail.join('\n')); }, 300);
              return;
            }
            var j = jobs[i++]; if(el('sgProg')) el('sgProg').textContent = '드라이브에서 가져오는 중 '+i+' / '+jobs.length+' · '+j.cn+' '+j.s.name;
            jsonp({action:'getSong', id:j.d.id}, 120000).then(function(g){
              if(!g || !g.ok) throw new Error(g && g.error || '파일을 못 받았습니다');
              return saveSong(j.cn, j.s, new File([b64ToBytes(g.b64)], j.d.name, {type:g.mime || 'audio/mpeg'}));
            }).then(function(){
              DB.ref(ROOT()+'/songIdx/'+ck(j.cn)+'/'+ck(j.s.sid)).update({src:j.d.id});
              ok++; per[j.cn] = (per[j.cn]||0) + 1; next();
            }).catch(function(e){ fail.push(j.cn+' '+j.d.name+' — '+(e && e.message || e)); next(); });
          })();
        });
    }).catch(function(e){ el('sgProg').textContent = ''; alert('드라이브 폴더를 읽지 못했어요\n\n'+(e && e.message || e)+
      '\n\n· 앱스 스크립트를 새 버전(응원가 가져오기 포함)으로 업데이트했는지\n· 앱스 스크립트를 배포한 계정이 그 폴더를 볼 수 있는지 확인해 주세요'); });
  }
  el('sgDriveGo').onclick = function(){
    var link = el('sgDrive').value.trim(); if(link) rememberFolder(S.cur, link);
    driveImport(link, 1, function(name){ var st = matchStudent(c.roster, name); return st ? {cn:S.cur, s:st} : null; });
  };
  el('sgDriveAllGo').onclick = function(){
    var link = el('sgDriveAll').value.trim(); if(link) rememberFolder('_all', link);
    driveImport(link, 4, matchAnyClass);
  };
  el('v-song').querySelectorAll('[data-sgup]').forEach(function(b){
    b.onclick = function(){
      var s = c.roster.filter(function(x){ return x.sid===b.dataset.sgup; })[0];
      pickFiles(el('sgOne'), function(files){ if(files[0]) runQueue([{s:s, f:files[0]}]); });
    };
  });
  el('v-song').querySelectorAll('[data-sgpl]').forEach(function(b){
    b.onclick = function(){ unlockAudio(); var s = c.roster.filter(function(x){ return x.sid===b.dataset.sgpl; })[0];
      var m = songMeta(S.cur, s.sid); if(m && m.link) return showSuno(m, s.name+' 응원가 (미리 듣기)');
      toast('▶ '+s.name+' 응원가 불러오는 중'); playSong(S.cur, s.sid, s.name+' 응원가 (미리 듣기)'); };
  });
  el('v-song').querySelectorAll('[data-sgst]').forEach(function(inp){
    inp.onchange = function(){
      var v = Math.max(0, Math.round(+inp.value||0));
      if(DB) DB.ref(ROOT()+'/songIdx/'+ck(S.cur)+'/'+ck(inp.dataset.sgst)).update({start:v});
      toast('시작 위치 '+v+'초 — ▶ 로 들어 보세요');
    };
  });
  el('v-song').querySelectorAll('[data-sgdel]').forEach(function(b){
    b.onclick = function(){
      var s = c.roster.filter(function(x){ return x.sid===b.dataset.sgdel; })[0];
      if(!confirm(s.name+' 학생의 응원가를 지울까요?')) return;
      DB.ref(ROOT()+'/songIdx/'+ck(S.cur)+'/'+ck(s.sid)).remove();
      DB.ref(ROOT()+'/songData/'+ck(S.cur)+'/'+ck(s.sid)).remove();
      stopAll();
    };
  });
  el('sgStop').onclick = function(){ stopAll(); };
  /* 🔗 수노 링크 — 줄마다 «학번·이름 + 링크». 링크 앞 글자로 학생을 찾는다 */
  el('sgSunoGo').onclick = function(){
    var lines = el('sgSuno').value.split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean);
    if(!lines.length) return toast('수노 링크를 붙여 넣어 주세요');
    var jobs = [], miss = [], last = '';
    lines.forEach(function(ln){
      var u = sunoUrl(ln) || (sunoId(ln) ? ln : '');
      var who = (u ? ln.replace(u, ' ') : ln).replace(/https?:\S+/g, ' ').trim();
      if(!u){ last = who || last; return; }                       // 이름 줄과 링크 줄이 따로 오는 경우
      if(!who) who = last; last = '';
      var st = who ? matchStudent(c.roster, who.replace(/^[^\d가-힣]+/, '')) : null;
      if(st) jobs.push({s:st, u:u}); else miss.push(ln);
    });
    if(!jobs.length) return alert('학생을 찾지 못했어요\n\n한 줄에 「학번 이름 링크」로 적어 주세요\n예) 20410 홍길동 https://suno.com/s/abcd');
    Promise.all(jobs.map(function(j){ return saveSunoLink(S.cur, j.s, j.u).then(function(){ return 1; }, function(e){ miss.push(j.s.name+' — '+e.message); return 0; }); }))
      .then(function(r){
        var ok = r.reduce(function(a,b){ return a+b; }, 0);
        toast('수노 링크 '+ok+'명 등록'); el('sgSuno').value = '';
        if(miss.length) alert('등록하지 못한 줄\n\n'+miss.join('\n'));
      });
  };
  el('v-song').querySelectorAll('[data-sglk]').forEach(function(b){
    b.onclick = function(){
      var s = c.roster.filter(function(x){ return x.sid===b.dataset.sglk; })[0];
      var t = prompt(s.name+' 학생의 수노 링크를 붙여 넣으세요'); if(!t) return;
      saveSunoLink(S.cur, s, t).then(function(){ toast(s.name+' 수노 링크 등록'); }, function(e){ alert(e.message); });
    };
  });
  el('sgTry').onclick = function(){
    unlockAudio();
    var s = c.roster[0] || {name:'홍길동', sid:'x'};
    var fake = {atbats:[]}, cum = {}; cum[s.sid] = {ab:9, h:3, hr:1, rbi:2, avg:3/9, bb:0};
    speak(introText(fake, s, 4, cum), function(){});
  };
}

/* ───── 시작 ──────────────────────────── */
/* 두 손가락 확대 막기 (iPadOS 사파리는 viewport 의 user-scalable=no 를 무시하므로 직접 막는다) */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
/* ※ 빠른 두 번째 탭을 touchend 에서 막는 방법은 쓰지 않는다 — 볼·스트라이크를 연달아 누를 때 두 번째가 씹힌다.
     더블탭 확대는 CSS touch-action:manipulation 으로 충분하다. */
var _fromLink = applySetupLink();
initFB();
render();
if(_fromLink) toast('설정을 불러왔습니다 — 이제 앱 주소로 바로 들어오시면 됩니다');
window.addEventListener('online', function(){ if(!S.cfg.fb) setNet(false,'로컬 저장'); });
</script>
